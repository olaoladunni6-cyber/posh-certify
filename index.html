<!DOCTYPE html>
<html lang="en-NG"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Posh Certify</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#0d1613;max-width:480px;margin:0 auto}h1{font-family:Georgia,serif}.wrap{background:#f4efe6;min-height:100vh;padding:16px 16px 96px}.top{background:#1c332c;color:#f4efe6;padding:14px 16px;display:flex;justify-content:space-between}.btn{border:0;border-radius:999px;padding:10px 14px;background:#c4a574;margin:4px 4px 0 0}.btn.bad{background:#8c3a32;color:#fff}.btn.dark{background:#101512;color:#fff}.card,.room,.acct{background:#fff;border-radius:14px;padding:12px;margin:8px 0;border:0;width:100%;text-align:left}.ok{background:#dcebe3;padding:10px;border-radius:12px}.warn{background:#f3e6c8;padding:10px;border-radius:12px}textarea,input,select{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}p{margin:8px 0 0}textarea{min-height:64px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee}.row input{width:64px;margin:0}.qty{font-weight:700;color:#8c3a32}video,img.media{width:100%;max-height:180px;border-radius:10px;object-fit:cover}.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;padding:8px;font-size:12px}.login{min-height:100vh;color:#fff;padding:28px 18px;background:#1c332c}</style></head><body><div id="app"></div>
<script>
const KEY="posh-full-v13";
const JOBS=[["checkout","Checkout"],["inhouse","In-house"],["postmaint","Post maintenance"],["spring","Spring clean"]];
function jobLabel(j){var x=JOBS.filter(function(a){return a[0]===j;})[0];return x?x[1]:(j||"Not allocated");}
function hkName(id){var u=db.users.filter(function(x){return x.id===id;})[0];return u?u.name:"Unassigned";}
const POINTS=["Doorway","Bed","Vanity","Shower","Towels","Wardrobe","Desk","Minibar","High-touch","Floor","Curtains","Walkthrough"];
const ITEMS=[{id:"bath_towel",cat:"Towels",name:"Bath towel"},{id:"hand_towel",cat:"Towels",name:"Hand towel"},{id:"face_cloth",cat:"Towels",name:"Face cloth"},{id:"bath_mat",cat:"Towels",name:"Bath mat"},{id:"bathrobe",cat:"Towels",name:"Bathrobe"},{id:"sheet",cat:"Linen",name:"Bed sheet"},{id:"pillow",cat:"Linen",name:"Pillowcase"},{id:"duvet",cat:"Linen",name:"Duvet / comforter"},{id:"blanket",cat:"Linen",name:"Extra blanket"},{id:"soap",cat:"Toiletries",name:"Soap / shower gel"},{id:"shampoo",cat:"Toiletries",name:"Shampoo"},{id:"conditioner",cat:"Toiletries",name:"Conditioner"},{id:"lotion",cat:"Toiletries",name:"Body lotion"},{id:"dental",cat:"Toiletries",name:"Dental kit"},{id:"tissue",cat:"Toiletries",name:"Tissue / toilet paper"},{id:"slippers",cat:"Amenities",name:"Slippers"},{id:"water",cat:"Amenities",name:"Bottled water"},{id:"tea",cat:"Amenities",name:"Tea / coffee / sugar"},{id:"sew",cat:"Amenities",name:"Sewing kit"},{id:"bag",cat:"Amenities",name:"Laundry bag"},{id:"other",cat:"Other",name:"Other item"}];
function seed(){return{whatsapp:"",frontDesk:"",slips:[],scores:[],issues:[],breakfasts:[],menu:{day:"",choices:["Continental","Nigerian","Fruit platter","Tea and toast"]},locations:["Ikeja","Victoria Island"],catalog:ITEMS.map(function(x){return{id:x.id,cat:x.cat,name:x.name,par:1};}),users:[{id:"admin",name:"Super Admin",role:"superadmin",site:"All sites",pin:"9090",whatsapp:"",demo:true},{id:"sophia",name:"Sophia Adeyemi",role:"manager",site:"Ikeja",pin:"2401",whatsapp:"",demo:true},{id:"blessing",name:"Blessing Okoro",role:"housekeeper",site:"Ikeja",pin:"4412",whatsapp:"",demo:true},{id:"tunde",name:"Tunde Balogun",role:"housekeeper",site:"Victoria Island",pin:"5508",whatsapp:"",demo:true},{id:"desk",name:"Front Desk Ikeja",role:"frontdesk",site:"Ikeja",pin:"1100",whatsapp:"",demo:true},{id:"dunni",name:"Oladunni Olayanju",role:"ceo",site:"Ikeja & VI",pin:"2026",whatsapp:"",demo:true},{id:"maint",name:"Ibrahim Musa",role:"maint",site:"Ikeja & VI",pin:"3300",whatsapp:"",demo:true},{id:"amina",name:"Amina Bello",role:"laundry",site:"Ikeja",pin:"6600",whatsapp:"",demo:true},{id:"chef",name:"Chef Ade",role:"kitchen",site:"Ikeja",pin:"7700",whatsapp:"",demo:true}],rooms:[{id:"r201",number:"201",site:"Ikeja",type:"Deluxe King",hk:"",job:"",status:"pending",photos:{},missing:{},laundryLog:[],demo:true},{id:"r501",number:"501",site:"Victoria Island",type:"Executive King",hk:"",job:"",status:"pending",photos:{},missing:{},laundryLog:[],demo:true}]};}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||"");if(x&&x.users)return x;}catch(e){}return seed();}
var db=load();if(!db.slips)db.slips=[];if(!db.breakfasts)db.breakfasts=[];if(!db.scores)db.scores=[];if(!db.issues)db.issues=[];if(!db.menu)db.menu={day:"",choices:["Continental","Nigerian","Fruit platter","Tea and toast"]};if(!db.locations)db.locations=["Ikeja","Victoria Island"];if(!db.catalog||!db.catalog.length)db.catalog=ITEMS.map(function(x){return{id:x.id,cat:x.cat,name:x.name,par:1};});if(!db.whatsapp)db.whatsapp="";if(!db.frontDesk)db.frontDesk="";if(!db.users.some(function(u){return u.role==="superadmin"||u.id==="admin";}))db.users.unshift({id:"admin",name:"Super Admin",role:"superadmin",site:"All sites",pin:"9090",whatsapp:"",demo:true});db.users.forEach(function(u){if(u.role==="gm")u.role="ceo";});
db.rooms.forEach(function(r){if(!r.photos)r.photos={};if(!r.missing)r.missing={};if(!r.job)r.job="";if(r.laundryChecked==null)r.laundryChecked=false;});
function catalog(){return db.catalog&&db.catalog.length?db.catalog:ITEMS;}
function itemName(id){var it=catalog().filter(function(x){return x.id===id;})[0];return it?it.name:id;}
var user=null,tab="rooms",roomId=null,pending=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function mgr(){return user&&user.role==="manager";}
function isFD(){return user&&user.role==="frontdesk";}
function isGM(){return user&&(user.role==="ceo"||user.role==="gm");}
function isMaint(){return user&&user.role==="maint";}
function isLaundry(){return user&&user.role==="laundry";}
function isKitchen(){return user&&user.role==="kitchen";}
function isSuper(){return user&&user.role==="superadmin";}
function roleName(r){return {housekeeper:"Housekeeper",manager:"Duty manager",frontdesk:"Front desk",gm:"CEO",ceo:"CEO",superadmin:"Super Admin",maint:"Maintenance",laundry:"Laundry",kitchen:"Kitchen"}[r]||r;}
function today(){var d=new Date();function z(n){return (n<10?"0":"")+n;}return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());}
function digits(s){return String(s||"").replace(/[^0-9]/g,"");}
function firstWa(role){var u=db.users.filter(function(x){return x.role===role&&digits(x.whatsapp).length>=11;})[0];return u?digits(u.whatsapp):"";}
function waDigits(){return digits(db.whatsapp)||firstWa("manager");}
function fdDigits(){return digits(db.frontDesk)||firstWa("frontdesk");}
function gmDigits(){return firstWa("ceo")||firstWa("gm");}
function pingMgrGm(msg){var a=waDigits(),g=gmDigits();if(a.length>=11)window.open("https://wa.me/"+a+"?text="+encodeURIComponent(msg),"_blank");setTimeout(function(){if(g.length>=11&&g!==a)window.open("https://wa.me/"+g+"?text="+encodeURIComponent(msg),"_blank");},700);}
function monthKey(){return today().slice(0,7);}
function naira(n){return "\u20a6"+Number(n||0).toLocaleString("en-NG");}
function todayScore(hk){return (db.scores||[]).filter(function(s){return s.hk===hk&&s.day===today();})[0];}
function monthUnsat(hk){return (db.scores||[]).filter(function(s){return s.hk===hk&&s.day.slice(0,7)===monthKey()&&s.rating==="unsat";}).length;}
function monthDeduct(hk){return monthUnsat(hk)*500;}
function scorePanel(){var hks=db.users.filter(function(u){return u.role==="housekeeper";});var rows=hks.map(function(u){var s=todayScore(u.id);var mark=s?(s.rating==="sat"?"Satisfactorily \u00b7 full pay":"Unsatisfactorily \u00b7 "+naira(500)+" deduction"):"Not scored today";var btns=mgr()?"<button class='btn sat' data-id='"+u.id+"'>Satisfactorily</button> <button class='btn bad unsat' data-id='"+u.id+"'>Unsatisfactorily</button>":"";return "<div class=card><b>"+u.name+"</b><br>"+u.site+"<br>"+mark+"<br>This month: "+monthUnsat(u.id)+" unsat \u00b7 deduct "+naira(monthDeduct(u.id))+"<br>"+btns+"</div>";}).join("");return "<h1>Housekeeper scores</h1><div class=ok>"+today()+" \u00b7 Satisfactorily = full pay \u00b7 Unsatisfactorily = \u20a6500 off that day. Duty manager scores once per housekeeper per day.</div>"+(rows||"<p>No housekeepers.</p>");}
function canReport(){return user&&(user.role==="housekeeper"||isFD()||mgr()||isGM());}
function issueLabel(s){return {received:"Received",pending:"Pending",materials:"Materials needed",cash:"Cash needed",outsourced:"Outsourced",completed:"Completed"}[s]||s;}
function issueHold(s){return s==="materials"||s==="cash"||s==="outsourced";}
function hoursAgo(ts){return (Date.now()-Number(ts||0))/3600000;}
function fmtWhen(ts){try{return new Date(ts).toLocaleString();}catch(e){return "";}}
function issueOverdue(it){if(!it||it.status==="completed"||issueHold(it.status))return false;return hoursAgo(it.openedAt)>=24;}
function issueLateOnComplete(it){if(!it||!it.completedAt)return false;if(issueHold(it.heldAs||""))return false;return (Number(it.completedAt)-Number(it.openedAt))>=24*3600000;}
function monthMaintPen(){return (db.issues||[]).filter(function(x){return x.penalty&&String(x.openedDay||"").slice(0,7)===monthKey();}).reduce(function(a,x){return a+Number(x.penalty||0);},0);}
function viewIssues(){var form="";if(canReport())form="<div class=card><h3>Report a fault</h3><select id=irm>"+db.rooms.map(function(r){return "<option value='"+r.number+"'>"+r.number+" \u00b7 "+r.site+"</option>";}).join("")+"</select><textarea id=ifault placeholder='What is wrong?'></textarea><p>Deadline (hours)</p><input id=ihours type=number min=1 max=24 value=6><button class=btn id=raiseI>Send to maintenance</button></div>";var list=(db.issues||[]).slice().reverse();var cards=list.map(function(it){var late=issueOverdue(it);var lateDone=it.status==="completed"&&issueLateOnComplete(it);var flag=late?"<div class=warn>Over 24 hours. Penalty "+naira(1000)+" unless materials, cash or outsourced.</div>":(lateDone&&!it.penalty&&it.cert!=="waived"?"<div class=warn>Finished after 24 hours.</div>":"");var st="";if(isMaint()&&it.status!=="completed")st=["received","pending","materials","cash","outsourced","completed"].map(function(s){return "<button class='btn setI' data-id='"+it.id+"' data-st='"+s+"'>"+issueLabel(s)+"</button>";}).join(" ");var mgrBtns="";if(mgr()&&it.status==="completed"&&!it.cert){mgrBtns="<button class='btn certI' data-id='"+it.id+"' data-v='sat'>Certify satisfactory</button> <button class='btn bad certI' data-id='"+it.id+"' data-v='unsat'>Unsatisfactory</button>";if(lateDone)mgrBtns+=" <button class='btn bad penI' data-id='"+it.id+"'>Penalize "+naira(1000)+"</button> <button class='btn dark waiveI' data-id='"+it.id+"'>No penalty (resources / outsourced)</button>";}if(mgr()&&late&&it.status!=="completed")mgrBtns+="<button class='btn bad penI' data-id='"+it.id+"'>Penalize "+naira(1000)+"</button>";var pay=it.penalty?("<p>Penalty "+naira(it.penalty)+"</p>"):"";var cert=it.cert?("<p>Duty manager: "+(it.cert==="sat"?"Satisfactory":it.cert==="waived"?"Penalty waived":"Unsatisfactory")+"</p>"):"";return "<div class=card><b>Rm "+it.room+"</b> \u00b7 "+issueLabel(it.status)+(late?" \u00b7 LATE":"")+"<br>"+it.fault+"<br>By "+it.by+" \u00b7 due "+fmtWhen(it.deadlineAt)+"<br>Opened "+fmtWhen(it.openedAt)+flag+pay+cert+st+mgrBtns+"</div>";}).join("");return "<h1>Maintenance issues</h1><div class=ok>Issuer sets a deadline (default 6 hours). Not finished in 24 hours = "+naira(1000)+" unless materials, cash or outsourced. Duty manager certifies or penalizes.</div>"+form+(cards||"<p>No issues yet.</p>");}
function todayMeals(){return db.breakfasts.filter(function(b){return b.day===today();});}
function makeCode(){var c;do{c=String(1000+Math.floor(Math.random()*9000));}while(todayMeals().some(function(b){return b.code===c;}));return c;}
function mealReportText(){var list=todayMeals(),sv=list.filter(function(b){return b.status==="served";});var by={};sv.forEach(function(b){by[b.meal]=(by[b.meal]||0)+1;});var lines=Object.keys(by).map(function(k){return by[k]+" x "+k;});return "POSH BREAKFAST REPORT\n"+today()+"\nIssued: "+list.length+"\nServed: "+sv.length+"\nPending: "+(list.length-sv.length)+"\n"+(lines.join("\n")||"No meals served yet.");}
function locSel(id,v){return "<select id='"+id+"'>"+db.locations.map(function(l){return "<option"+(l===v?" selected":"")+">"+l+"</option>";}).join("")+"</select>";}
function roleSel(id,v){var roles=[["housekeeper","Housekeeper"],["manager","Duty manager"],["frontdesk","Front desk"],["ceo","CEO"],["superadmin","Super Admin"],["maint","Maintenance"],["laundry","Laundry"],["kitchen","Kitchen"]];return "<select id='"+id+"'>"+roles.map(function(r){return "<option value='"+r[0]+"'"+(v===r[0]?" selected":"")+">"+r[1]+"</option>";}).join("")+"</select>";}
function hkSel(id,v){var hks=db.users.filter(function(u){return u.role==="housekeeper";});return "<select id='"+id+"'>"+hks.map(function(u){return "<option value='"+u.id+"'"+(v===u.id?" selected":"")+">"+u.name+"</option>";}).join("")+"</select>";}
function jobSel(id,v){return "<select id='"+id+"'>"+JOBS.map(function(j){return "<option value='"+j[0]+"'"+(v===j[0]?" selected":"")+">"+j[1]+"</option>";}).join("")+"</select>";}
function mediaCount(r){var n=0;Object.keys(r.photos||{}).forEach(function(k){if(r.photos[k])n++;});return n;}
function mediaBox(src){if(!src||src===true)return src?"<p>On file</p>":"<p>No media</p>";var s=String(src);if(s.indexOf("data:video")===0)return "<video class=media controls playsinline src='"+s+"'></video>";if(s.indexOf("data:image")===0)return "<img class=media src='"+s+"'>";return "<p>On file</p>";}
function missCount(r){var n=0;Object.keys(r.missing||{}).forEach(function(k){n+=Number(r.missing[k]||0);});return n;}
function allocBox(){var roomOpts=db.rooms.map(function(r){return "<option value='"+r.id+"'>"+r.number+" \u00b7 "+r.site+"</option>";}).join("");var add=isSuper()?"<div class=card><h3>Add room</h3><input id=rnum placeholder='Room number'><input id=rtype placeholder='Type'>"+locSel("rsite","Ikeja")+"<button class=btn id=addRoom>Add room</button></div>":"";return ((isFD()||mgr())?"<div class=card><h3>Allocate room</h3><select id=aroom>"+roomOpts+"</select>"+hkSel("ahk","")+jobSel("ajob","checkout")+"<button class=btn id=doAlloc>Assign to housekeeper</button></div>":"")+add;}
function draw(){var el=document.getElementById("app");
if(!user){if(pending){el.innerHTML="<div class=login><h1>Enter PIN</h1><p>"+pending.name+"</p><input id=pinbox type=password inputmode=numeric placeholder='PIN'><p><button class=btn id=pinok>Unlock</button> <button class='btn dark' id=pincancel>Back</button></p></div>";document.getElementById("pinok").onclick=function(){if(document.getElementById("pinbox").value.trim()===String(pending.pin)){user=pending;pending=null;tab=isKitchen()?"meals":(isLaundry()?"laundry":(isMaint()?"issues":"rooms"));roomId=null;draw();}};document.getElementById("pincancel").onclick=function(){pending=null;draw();};return;}
el.innerHTML="<div class=login><h1>Posh Certify</h1>"+db.users.map(function(u){return "<button class=acct data-id='"+u.id+"'><b>"+u.name+"</b><br>"+roleName(u.role)+" \u00b7 "+u.site+"</button>";}).join("")+"</div>";
el.querySelectorAll(".acct").forEach(function(b){b.onclick=function(){pending=db.users.filter(function(u){return u.id===b.getAttribute("data-id");})[0];draw();};});return;}
var inner=tab==="staff"?viewStaff():tab==="me"?viewMe():tab==="meals"?viewMeals():tab==="issues"?viewIssues():tab==="laundry"?viewSlips():roomId?viewRoom():viewBoard();
el.innerHTML="<div class=top><span>Certify NG</span><span>"+user.name.split(" ")[0]+"</span></div><div class=wrap>"+inner+"</div><div class=dock><button id=d1>Rooms</button><button id=d2>Fix</button><button id=d5>Meals</button><button id=d3>Staff</button><button id=d4>Me</button></div>";
["rooms","issues","staff","me","meals"].forEach(function(name,i){var ids=["d1","d2","d3","d4","d5"];document.getElementById(ids[i]).onclick=function(){tab=isLaundry()&&name==="issues"?"laundry":name;roomId=null;draw();};});
bind();}
function viewBoard(){if(isKitchen())return viewMeals();if(isLaundry())return viewSlips();if(isGM()){var tm=todayMeals(),sv=tm.filter(function(b){return b.status==="served";}).length;var openI=(db.issues||[]).filter(function(x){return x.status!=="completed";}).length;return "<div class=ok>CEO report only.</div><h1>House report</h1><div class=card><h3>Breakfast today</h3><p><b>"+sv+"</b> served of <b>"+tm.length+"</b> issued</p></div><div class=card><h3>Maintenance</h3><p>"+openI+" open issues</p></div>"+scorePanel();}
var list=(mgr()||isMaint()||isFD()||isSuper())?db.rooms:db.rooms.filter(function(r){return r.hk===user.id&&r.status!=="ooo"&&r.job;});
var cards=list.map(function(r){var admin=isSuper()?" <button class='btn editR' data-id='"+r.id+"'>Edit</button> <button class='btn bad delR' data-id='"+r.id+"'>Delete</button>":"";return "<div class=room><b>"+r.number+"</b> "+r.type+"<br>"+r.site+" \u00b7 "+r.status+" \u00b7 "+jobLabel(r.job)+"<br>"+hkName(r.hk)+" <button class='btn open' data-id='"+r.id+"'>Open</button>"+admin+"</div>";}).join("");
if(!list.length&&!(isFD()||mgr()||isSuper()))cards+="<div class=warn>No rooms allocated to you yet.</div>";
return ((isFD()||mgr()||isSuper())?allocBox():"")+"<h1>Rooms</h1>"+cards;}
function viewMeals(){if(!db.menu.day||db.menu.day!==today())db.menu.day=today();
var choices=db.menu.choices||["Continental","Nigerian","Fruit platter","Tea and toast"];
var list=todayMeals();var served=list.filter(function(b){return b.status==="served";});
var head="<h1>Complimentary breakfast</h1><div class=ok>"+today()+" \u00b7 issued "+list.length+" \u00b7 served "+served.length+" \u00b7 waiting "+(list.length-served.length)+"</div>";
var menu="<div class=card><h3>Today's meal choices</h3>"+choices.map(function(c){return "<p>"+c+"</p>";}).join("")+((mgr()||isKitchen())?"<textarea id=mchoices>"+choices.join("\n")+"</textarea><button class=btn id=saveMenu>Save today's menu</button>":"")+"</div>";
var issue="";if(isFD()||mgr())issue="<div class=card><h3>Issue breakfast</h3><input id=gname placeholder='Guest name'><select id=groom>"+db.rooms.map(function(r){return "<option>"+r.number+"</option>";}).join("")+"</select><select id=gmeal>"+choices.map(function(c){return "<option>"+c+"</option>";}).join("")+"</select><button class=btn id=issueBf>Issue code</button></div>";
var kit="";if(isKitchen()||mgr())kit="<div class=card><h3>Verify guest on arrival</h3><p>List shows guest name and meal only. Ask for the code. Code confirms the guest is genuine and the voucher is unused.</p><input id=gcode placeholder='Enter guest code' inputmode=numeric><button class=btn id=findBf>Verify code</button><div id=bfhit></div></div>";
var rows=list.slice().reverse().map(function(b){return isKitchen()?"<div class=card><b>"+b.guest+"</b><br>"+b.meal+(b.status==="served"?" \u00b7 SERVED":" \u00b7 waiting")+"</div>":"<div class=card><b>"+b.code+"</b> \u00b7 "+b.guest+" \u00b7 Rm "+b.room+"<br>"+b.meal+" \u00b7 "+b.status.toUpperCase()+"</div>";}).join("");
return head+menu+issue+kit+"<button class=btn id=sendBfRep>Send today's report to duty manager and CEO</button><h3>Today</h3>"+(rows||"<p>None issued yet.</p>");}
function viewSlips(){var open=db.slips.filter(function(s){return s.status==="sent";});return "<h1>Laundry</h1>"+open.map(function(s){return "<div class=card><b>Room "+s.room+"</b><p>"+s.summary+"</p>"+(isLaundry()?"<button class='btn recv' data-id='"+s.id+"'>Certify received</button>":"")+"</div>";}).join("")||"<div class=ok>No bags waiting.</div>";}
function laundryBox(r){var can=user&&user.role==="housekeeper"&&r.hk===user.id&&r.job;var rows=catalog().map(function(it){var n=Number((r.missing||{})[it.id]||0);return "<div class=row><span>"+it.name+"</span>"+(can?"<input class=q type=number min=0 data-item='"+it.id+"' value='"+(n||"")+"'>":"<span class=qty>"+n+"</span>")+"</div>";}).join("");return "<div class=card><h3>Missing items</h3>"+rows+(can?"<button class=btn id=lrep>Save count</button>":"")+"</div>";}
function sendBox(r){var can=user&&user.role==="housekeeper"&&r.hk===user.id;var rows=catalog().filter(function(it){return it.cat==="Towels"||it.cat==="Linen";}).map(function(it){return "<div class=row><span>"+it.name+"</span>"+(can?"<input class=sq type=number min=0 data-item='"+it.id+"' placeholder='0'>":"")+"</div>";}).join("");return "<div class=card><h3>Send to laundry</h3>"+rows+(can?"<button class=btn id=sendL>Send to laundry</button>":"")+"</div>";}
function viewRoom(){var r=db.rooms.filter(function(x){return x.id===roomId;})[0];var miss=missCount(r),shots=mediaCount(r);
var act=mgr()?(miss||shots<3?"<div class=warn>Cannot certify yet.</div><button class='btn bad' id=ooo>Set OUT OF ORDER</button> <button class=btn id=rel>Return to service</button>":"<button class=btn id=cert>Certify and notify front desk</button> <button class='btn bad' id=ooo>Set OUT OF ORDER</button> <button class=btn id=rel>Return to service</button>"):isMaint()?"<button class='btn bad' id=ooo>Set OUT OF ORDER</button> <button class=btn id=rel>Return to service</button>":isSuper()?"<div class=ok>Super Admin can edit or delete this room. Certification stays with duty manager.</div>":isFD()?"<div class=ok>Allocate on Rooms. Issue breakfast on Meals.</div>":isGM()||isLaundry()||isKitchen()?"<div class=ok>View only.</div>":(!r.job||r.hk!==user.id?"<div class=warn>Not allocated to you.</div>":shots<3?"<div class=warn>Add photos and video first.</div>":r.laundryChecked?"<button class=btn id=send>Submit to duty manager</button>":"<div class=warn>Save laundry count first.</div>");
var cap=user&&user.role==="housekeeper"&&r.hk===user.id&&r.job;
var pts=POINTS.map(function(p){return "<div class=card><b>"+p+"</b>"+mediaBox((r.photos||{})[p])+(cap?"<label class=btn>Photo<input type=file accept='image/*' capture='environment' data-pt='"+p+"'></label> <label class=btn>Record video<input type=file accept='video/*' capture='environment' data-pt='"+p+"'></label>":"")+"</div>";}).join("");
return "<p id=back>&larr; Back</p><h1>Room "+r.number+"</h1><p>"+r.status+" \u00b7 "+jobLabel(r.job)+" \u00b7 "+hkName(r.hk)+"</p>"+(isSuper()?("<div class=card><h3>Edit room</h3><p>Number</p><input id=enum value='"+r.number+"'><p>Type</p><input id=etype value='"+r.type+"'><p>Location</p>"+locSel("esite",r.site)+"<button class=btn id=saveRm>Save room</button> <button class='btn bad' id=delRm>Delete room</button></div>"):"")+(isFD()||mgr()?("<div class=card><h3>Re-allocate</h3>"+hkSel("rhk",r.hk)+jobSel("rjob",r.job||"checkout")+"<button class=btn id=reAlloc>Save allocation</button></div>"):"")+pts+laundryBox(r)+sendBox(r)+act;}
function viewStaff(){if(mgr())return scorePanel();if(isGM())return scorePanel();if(!isSuper())return "<h1>Staff</h1><div class=warn>Super Admin only.</div>";var people=db.users.map(function(u){return "<div class=card><b>"+u.name+"</b> \u00b7 "+roleName(u.role)+"<input data-en='"+u.id+"' value='"+u.name+"'>"+roleSel("er-"+u.id,u.role)+locSel("es-"+u.id,u.site)+"<input data-pinfor='"+u.id+"' placeholder='PIN'><input data-ew='"+u.id+"' value='"+digits(u.whatsapp)+"' placeholder='WhatsApp'><button class='btn saveU' data-id='"+u.id+"'>Save</button> <button class='btn bad delU' data-id='"+u.id+"'>Remove</button></div>";}).join("");return scorePanel()+"<h1>Staff</h1>"+people+"<div class=card><h3>Hotel WhatsApp</h3><input id=wa value='"+digits(db.whatsapp)+"' placeholder='Duty manager'><input id=fd value='"+digits(db.frontDesk)+"' placeholder='Front desk'><button class=btn id=saveWa>Save numbers</button></div><div class=card><h3>Add staff</h3><input id=sn placeholder='Name'>"+roleSel("sr","housekeeper")+locSel("ss","Ikeja")+"<input id=sp placeholder='PIN'><button class=btn id=addStaff>Save staff</button></div>";}
function viewMe(){var pay="";if(user.role==="housekeeper"){var s=todayScore(user.id);pay="<div class=card><h3>Today's score</h3><p>"+(s?(s.rating==="sat"?"Satisfactorily \u00b7 full pay":"Unsatisfactorily \u00b7 \u20a6500 deduction"):"Duty manager has not scored you yet.")+"</p><p>This month deductions: "+naira(monthDeduct(user.id))+"</p></div>";}if(isMaint())pay+="<div class=card><h3>Issue penalties this month</h3><p>"+naira(monthMaintPen())+"</p><p>\u20a61,000 if a job exceeds 24 hours without materials, cash or outsourcing.</p></div>";return "<h1>"+user.name+"</h1><p>"+roleName(user.role)+"</p>"+pay+"<button class=btn id=out>Sign out</button>";}
function collectCounts(){var miss={};document.querySelectorAll(".q").forEach(function(inp){var n=parseInt(inp.value,10);if(n>0)miss[inp.getAttribute("data-item")]=n;});return miss;}
function bind(){
document.querySelectorAll(".open").forEach(function(b){b.onclick=function(){roomId=b.getAttribute("data-id");tab="rooms";draw();};});
var back=document.getElementById("back");if(back)back.onclick=function(){roomId=null;draw();};
var out=document.getElementById("out");if(out)out.onclick=function(){user=null;draw();};
document.querySelectorAll("input[type=file]").forEach(function(inp){inp.onchange=function(){var f=inp.files[0];if(!f)return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];if(!r.photos)r.photos={};var rd=new FileReader();rd.onload=function(){r.photos[inp.getAttribute("data-pt")]=rd.result;save();draw();};rd.readAsDataURL(f);};});
document.querySelectorAll(".sat").forEach(function(b){b.onclick=function(){if(!mgr())return;var id=b.getAttribute("data-id");db.scores=db.scores.filter(function(s){return !(s.hk===id&&s.day===today());});db.scores.push({id:"sc"+Date.now(),hk:id,day:today(),rating:"sat",by:user.name,at:new Date().toLocaleString()});save();draw();};});
document.querySelectorAll(".unsat").forEach(function(b){b.onclick=function(){if(!mgr())return;var id=b.getAttribute("data-id");db.scores=db.scores.filter(function(s){return !(s.hk===id&&s.day===today());});db.scores.push({id:"sc"+Date.now(),hk:id,day:today(),rating:"unsat",deduct:500,by:user.name,at:new Date().toLocaleString()});save();draw();};});
var raiseI=document.getElementById("raiseI");if(raiseI)raiseI.onclick=function(){if(!canReport())return;var fault=(document.getElementById("ifault").value||"").trim();if(!fault){alert("Describe the fault.");return;}var hours=parseInt(document.getElementById("ihours").value,10);if(!(hours>0))hours=6;var room=document.getElementById("irm").value;var site="";db.rooms.forEach(function(r){if(r.number===room)site=r.site;});var now=Date.now();db.issues.push({id:"i"+now,room:room,site:site,fault:fault,by:user.name,byRole:user.role,openedAt:now,openedDay:today(),deadlineAt:now+hours*3600000,status:"received",cert:"",penalty:0});save();draw();};
document.querySelectorAll(".setI").forEach(function(b){b.onclick=function(){if(!isMaint())return;var id=b.getAttribute("data-id");var st=b.getAttribute("data-st");db.issues.forEach(function(it){if(it.id!==id)return;it.status=st;if(issueHold(st))it.heldAs=st;if(st==="completed")it.completedAt=Date.now();});save();draw();};});
document.querySelectorAll(".certI").forEach(function(b){b.onclick=function(){if(!mgr())return;var id=b.getAttribute("data-id");var v=b.getAttribute("data-v");db.issues.forEach(function(it){if(it.id!==id)return;it.cert=v;it.certifiedBy=user.name;});save();draw();};});
document.querySelectorAll(".penI").forEach(function(b){b.onclick=function(){if(!mgr())return;var id=b.getAttribute("data-id");db.issues.forEach(function(it){if(it.id!==id)return;if(issueHold(it.status)||issueHold(it.heldAs||"")){alert("No penalty while materials, cash or outsourced.");return;}it.penalty=1000;it.penalizedBy=user.name;});save();draw();};});
document.querySelectorAll(".waiveI").forEach(function(b){b.onclick=function(){if(!mgr())return;var id=b.getAttribute("data-id");db.issues.forEach(function(it){if(it.id!==id)return;it.penalty=0;it.cert=it.cert||"waived";it.waivedBy=user.name;});save();draw();};});
var saveMenu=document.getElementById("saveMenu");if(saveMenu)saveMenu.onclick=function(){if(!(mgr()||isKitchen()))return;var raw=(document.getElementById("mchoices").value||"").split("\n").map(function(s){return s.trim();}).filter(Boolean);if(!raw.length)return;db.menu={day:today(),choices:raw};save();draw();};
var issueBf=document.getElementById("issueBf");if(issueBf)issueBf.onclick=function(){if(!(isFD()||mgr()))return;var name=(document.getElementById("gname").value||"").trim();var room=document.getElementById("groom").value;var meal=document.getElementById("gmeal").value;if(!name||!room||!meal){alert("Guest name, room and meal required.");return;}var code=makeCode();db.breakfasts.push({id:"b"+Date.now(),code:code,guest:name,room:room,meal:meal,day:today(),status:"issued",issuedBy:user.name,issuedAt:new Date().toLocaleString()});save();alert("Give this code to the guest:\n\n"+code+"\n\n"+name+" \u00b7 Room "+room+" \u00b7 "+meal);draw();};
var findBf=document.getElementById("findBf");if(findBf)findBf.onclick=function(){if(!(isKitchen()||mgr()))return;var code=String((document.getElementById("gcode").value||"").trim());var hit=todayMeals().filter(function(b){return b.code===code;})[0];var box=document.getElementById("bfhit");if(!hit){box.innerHTML="<div class=warn>Not genuine. This code is not on today's breakfast list. Do not serve.</div>";return;}if(hit.status==="served"){box.innerHTML="<div class=warn>Voucher already served. Guest: "+hit.guest+" \u00b7 "+hit.meal+". Do not serve again.</div>";return;}box.innerHTML="<div class=ok><b>Guest verified</b><br>"+hit.guest+" \u00b7 "+hit.meal+"<br>Room "+hit.room+"</div><button class=btn id=serveBf>Confirm and serve</button>";document.getElementById("serveBf").onclick=function(){hit.status="served";hit.servedBy=user.name;hit.servedAt=new Date().toLocaleString();save();pingMgrGm(mealReportText());alert("Served. Daily count sent to duty manager and CEO.");draw();};};
var sendBfRep=document.getElementById("sendBfRep");if(sendBfRep)sendBfRep.onclick=function(){pingMgrGm(mealReportText());};
document.querySelectorAll(".editR").forEach(function(b){b.onclick=function(){if(!isSuper())return;roomId=b.getAttribute("data-id");tab="rooms";draw();};});
document.querySelectorAll(".delR").forEach(function(b){b.onclick=function(){if(!isSuper())return;var id=b.getAttribute("data-id");var r=db.rooms.filter(function(x){return x.id===id;})[0];if(!r)return;if(!confirm("Delete room "+r.number+"?"))return;db.rooms=db.rooms.filter(function(x){return x.id!==id;});save();if(roomId===id)roomId=null;draw();};});
var saveRm=document.getElementById("saveRm");if(saveRm)saveRm.onclick=function(){if(!isSuper())return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];if(!r)return;var n=(document.getElementById("enum").value||"").trim();if(!n){alert("Room number required");return;}r.number=n;r.type=(document.getElementById("etype").value||r.type).trim();r.site=document.getElementById("esite").value;save();draw();};
var delRm=document.getElementById("delRm");if(delRm)delRm.onclick=function(){if(!isSuper())return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];if(!r)return;if(!confirm("Delete room "+r.number+"?"))return;db.rooms=db.rooms.filter(function(x){return x.id!==roomId;});save();roomId=null;draw();};
var doAlloc=document.getElementById("doAlloc");if(doAlloc)doAlloc.onclick=function(){if(!(isFD()||mgr()))return;var r=db.rooms.filter(function(x){return x.id===document.getElementById("aroom").value;})[0];if(!r)return;r.hk=document.getElementById("ahk").value;r.job=document.getElementById("ajob").value;r.assignedBy=user.name;if(r.status==="certified")r.status="pending";r.laundryChecked=false;save();draw();};
var reAlloc=document.getElementById("reAlloc");if(reAlloc)reAlloc.onclick=function(){if(!(isFD()||mgr()))return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];r.hk=document.getElementById("rhk").value;r.job=document.getElementById("rjob").value;if(r.status==="certified")r.status="pending";save();draw();};
var addRoom=document.getElementById("addRoom");if(addRoom)addRoom.onclick=function(){if(!isSuper())return;var n=(document.getElementById("rnum").value||"").trim();if(!n)return;db.rooms.push({id:"r"+Date.now(),number:n,site:document.getElementById("rsite").value,type:(document.getElementById("rtype").value||"Standard").trim(),hk:"",job:"",status:"pending",photos:{},missing:{}});save();draw();};
var sendL=document.getElementById("sendL");if(sendL)sendL.onclick=function(){if(user.role!=="housekeeper")return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];var items={};document.querySelectorAll(".sq").forEach(function(inp){var n=parseInt(inp.value,10);if(n>0)items[inp.getAttribute("data-item")]=n;});if(!Object.keys(items).length)return;db.slips.push({id:"s"+Date.now(),room:r.number,site:r.site,by:user.name,at:new Date().toLocaleString(),items:items,received:{},status:"sent",summary:Object.keys(items).map(function(k){return items[k]+" x "+itemName(k);}).join(", ")});save();draw();};
document.querySelectorAll(".recv").forEach(function(b){b.onclick=function(){if(!isLaundry())return;var s=db.slips.filter(function(x){return x.id===b.getAttribute("data-id");})[0];s.status="received";s.receivedBy=user.name;save();draw();};});
var lrep=document.getElementById("lrep");if(lrep)lrep.onclick=function(){if(user.role!=="housekeeper")return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];r.missing=collectCounts();r.laundryChecked=true;save();draw();};
var send=document.getElementById("send");if(send)send.onclick=function(){if(user.role!=="housekeeper")return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];if(!r.job||r.hk!==user.id)return;if(mediaCount(r)<3||!r.laundryChecked){alert("Photos and laundry count required.");return;}r.status="submitted";save();roomId=null;draw();};
var cert=document.getElementById("cert");if(cert)cert.onclick=function(){if(!mgr())return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];if(r.status==="ooo"||missCount(r)>0||mediaCount(r)<3||!r.laundryChecked){alert("Not ready.");return;}r.status="certified";save();var fd=fdDigits();if(fd.length>=11)window.open("https://wa.me/"+fd+"?text="+encodeURIComponent("POSH CERTIFY Room "+r.number+" CERTIFIED. Ready to sell."),"_blank");roomId=null;draw();};
var ooo=document.getElementById("ooo");if(ooo)ooo.onclick=function(){if(!(isMaint()||mgr()))return;db.rooms.filter(function(x){return x.id===roomId;})[0].status="ooo";save();roomId=null;draw();};
var rel=document.getElementById("rel");if(rel)rel.onclick=function(){if(!(isMaint()||mgr()))return;db.rooms.filter(function(x){return x.id===roomId;})[0].status="pending";save();roomId=null;draw();};
var saveWa=document.getElementById("saveWa");if(saveWa)saveWa.onclick=function(){if(!isSuper())return;db.whatsapp=digits(document.getElementById("wa").value);db.frontDesk=digits(document.getElementById("fd").value);save();draw();};
document.querySelectorAll(".delU").forEach(function(b){b.onclick=function(){if(!isSuper())return;var id=b.getAttribute("data-id");if(user&&id===user.id)return;db.users=db.users.filter(function(u){return u.id!==id;});save();draw();};});
document.querySelectorAll(".saveU").forEach(function(b){b.onclick=function(){if(!isSuper())return;var id=b.getAttribute("data-id");var n=(document.querySelector("[data-en='"+id+"']")||{}).value;var roleEl=document.getElementById("er-"+id);var siteEl=document.getElementById("es-"+id);var pinEl=document.querySelector("[data-pinfor='"+id+"']");var waEl=document.querySelector("[data-ew='"+id+"']");db.users.forEach(function(u){if(u.id!==id)return;if(n&&String(n).trim())u.name=String(n).trim();if(roleEl)u.role=roleEl.value;if(siteEl)u.site=siteEl.value;if(pinEl&&pinEl.value.trim().length>=4)u.pin=pinEl.value.trim();if(waEl)u.whatsapp=digits(waEl.value);});save();draw();};});
var addStaff=document.getElementById("addStaff");if(addStaff)addStaff.onclick=function(){if(!isSuper())return;var n=document.getElementById("sn").value.trim();if(!n)return;var pin=document.getElementById("sp").value.trim();if(pin.length<4)return;db.users.push({id:"u"+Date.now(),name:n,role:document.getElementById("sr").value,site:document.getElementById("ss").value,pin:pin,whatsapp:"",demo:false});save();draw();};
}
draw();
</script></body></html>
