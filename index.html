<!DOCTYPE html>
<html lang="en-NG"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Posh Certify</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#0d1613;max-width:480px;margin:0 auto}h1{font-family:Georgia,serif}.wrap{background:#f4efe6;min-height:100vh;padding:16px 16px 96px}.top{background:#1c332c;color:#f4efe6;padding:14px 16px;display:flex;justify-content:space-between}.btn{border:0;border-radius:999px;padding:10px 14px;background:#c4a574;margin:4px 4px 0 0}.btn.bad{background:#8c3a32;color:#fff}.btn.dark{background:#101512;color:#fff}.card,.room,.acct{background:#fff;border-radius:14px;padding:12px;margin:8px 0;border:0;width:100%;text-align:left}.ok{background:#dcebe3;padding:10px;border-radius:12px}.warn{background:#f3e6c8;padding:10px;border-radius:12px}textarea,input,select{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}p{margin:8px 0 0}textarea{min-height:64px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee}.row input{width:64px;margin:0}.qty{font-weight:700;color:#8c3a32}video,img.media{width:100%;max-height:180px;border-radius:10px;object-fit:cover}.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;padding:8px;font-size:12px}.login{min-height:100vh;color:#fff;padding:28px 18px;background:#1c332c}</style></head><body><div id="app"></div>
<script>
const KEY="posh-full-v13";
const JOBS=[["checkout","Checkout"],["inhouse","In-house"],["postmaint","Post maintenance"],["spring","Spring clean"]];
function jobLabel(j){var x=JOBS.filter(function(a){return a[0]===j;})[0];return x?x[1]:(j||"Not allocated");}
function hkName(id){var u=db.users.filter(function(x){return x.id===id;})[0];return u?u.name:"Unassigned";}
const POINTS=["Doorway","Bed","Vanity","Shower","Towels","Wardrobe","Desk","Minibar","High-touch","Floor","Curtains","Walkthrough"];
const ITEMS=[{id:"bath_towel",cat:"Towels",name:"Bath towel"},{id:"hand_towel",cat:"Towels",name:"Hand towel"},{id:"face_cloth",cat:"Towels",name:"Face cloth"},{id:"bath_mat",cat:"Towels",name:"Bath mat"},{id:"bathrobe",cat:"Towels",name:"Bathrobe"},{id:"sheet",cat:"Linen",name:"Bed sheet"},{id:"pillow",cat:"Linen",name:"Pillowcase"},{id:"duvet",cat:"Linen",name:"Duvet / comforter"},{id:"blanket",cat:"Linen",name:"Extra blanket"},{id:"soap",cat:"Toiletries",name:"Soap / shower gel"},{id:"shampoo",cat:"Toiletries",name:"Shampoo"},{id:"conditioner",cat:"Toiletries",name:"Conditioner"},{id:"lotion",cat:"Toiletries",name:"Body lotion"},{id:"dental",cat:"Toiletries",name:"Dental kit"},{id:"tissue",cat:"Toiletries",name:"Tissue / toilet paper"},{id:"slippers",cat:"Amenities",name:"Slippers"},{id:"water",cat:"Amenities",name:"Bottled water"},{id:"tea",cat:"Amenities",name:"Tea / coffee / sugar"},{id:"sew",cat:"Amenities",name:"Sewing kit"},{id:"bag",cat:"Amenities",name:"Laundry bag"},{id:"other",cat:"Other",name:"Other item"},{id:"bulb",cat:"Maintenance",name:"Light bulb"},{id:"tap",cat:"Maintenance",name:"Tap / mixer"},{id:"lock",cat:"Maintenance",name:"Lock / key"},{id:"paint",cat:"Maintenance",name:"Paint"},{id:"acfilter",cat:"Maintenance",name:"AC filter"},{id:"pipe",cat:"Maintenance",name:"Pipe / fitting"},{id:"seal",cat:"Maintenance",name:"Sealant"},{id:"switch",cat:"Maintenance",name:"Switch / socket"}];
function seed(){return{whatsapp:"",frontDesk:"",slips:[],scores:[],issues:[],stock:{},moves:[],breakfasts:[],menus:[],supplies:[],linenIssues:[],menu:{day:"",choices:["Continental","Nigerian","Fruit platter","Tea and toast"]},locations:["Ikeja","Victoria Island"],catalog:ITEMS.map(function(x){return{id:x.id,cat:x.cat,name:x.name,par:1};}),users:[{id:"admin",name:"Super Admin",role:"superadmin",site:"All sites",pin:"9090",whatsapp:"",demo:true},{id:"sophia",name:"Sophia Adeyemi",role:"manager",site:"Ikeja",pin:"2401",whatsapp:"",demo:true},{id:"kemi",name:"Kemi Adewale",role:"manager",site:"Victoria Island",pin:"2402",whatsapp:"",demo:true},{id:"blessing",name:"Blessing Okoro",role:"housekeeper",site:"Ikeja",pin:"4412",whatsapp:"",demo:true},{id:"tunde",name:"Tunde Balogun",role:"housekeeper",site:"Victoria Island",pin:"5508",whatsapp:"",demo:true},{id:"desk",name:"Front Desk Ikeja",role:"frontdesk",site:"Ikeja",pin:"1100",whatsapp:"",demo:true},{id:"dunni",name:"Oladunni Olayanju",role:"ceo",site:"Ikeja & VI",pin:"2026",whatsapp:"",demo:true},{id:"maint",name:"Ibrahim Musa",role:"maint",site:"Ikeja",pin:"3300",whatsapp:"",demo:true},{id:"chinedu",name:"Chinedu Okeke",role:"maint",site:"Victoria Island",pin:"3301",whatsapp:"",demo:true},{id:"store",name:"Yemi Lawal",role:"storekeeper",site:"Ikeja",pin:"8800",whatsapp:"",demo:true},{id:"storevi",name:"Ngozi Eze",role:"storekeeper",site:"Victoria Island",pin:"8801",whatsapp:"",demo:true},{id:"amina",name:"Amina Bello",role:"laundry",site:"Ikeja",pin:"6600",whatsapp:"",demo:true},{id:"chef",name:"Chef Ade",role:"kitchen",site:"Ikeja",pin:"7700",whatsapp:"",demo:true},{id:"bisi",name:"Chef Bisi",role:"kitchen",site:"Victoria Island",pin:"7701",whatsapp:"",demo:true}],rooms:[{id:"r201",number:"201",site:"Ikeja",type:"Deluxe King",hk:"",job:"",status:"pending",photos:{},missing:{},laundryLog:[],demo:true},{id:"r501",number:"501",site:"Victoria Island",type:"Executive King",hk:"",job:"",status:"pending",photos:{},missing:{},laundryLog:[],demo:true}]};}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||"");if(x&&x.users)return x;}catch(e){}return seed();}
var db=load();
function catalog(){return db.catalog&&db.catalog.length?db.catalog:ITEMS;}
var user=null,tab="rooms",roomId=null,pending=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function mgr(){return user&&user.role==="manager";}
function isFD(){return user&&user.role==="frontdesk";}
function isGM(){return user&&(user.role==="ceo"||user.role==="gm");}
function isMaint(){return user&&user.role==="maint";}
function isLaundry(){return user&&user.role==="laundry";}
function isKitchen(){return user&&user.role==="kitchen";}
function isSuper(){return user&&user.role==="superadmin";}
function isStore(){return user&&user.role==="storekeeper";}
function seesAll(){return isSuper()||isGM();}
function workSite(){return user&&user.site||"";}
function siteMatch(site){if(seesAll())return true;if(!user)return false;return String(site||"")===String(user.site||"");}
function siteRooms(){return db.rooms.filter(function(r){return siteMatch(r.site);});}
function roleName(r){return {housekeeper:"Housekeeper",manager:"Duty manager",frontdesk:"Front desk",gm:"CEO",ceo:"CEO",superadmin:"Super Admin",maint:"Maintenance",laundry:"Laundry",kitchen:"Kitchen",storekeeper:"Storekeeper"}[r]||r;}
function draw(){var el=document.getElementById("app");if(!user){if(pending){el.innerHTML="<div class=login><h1>Enter PIN</h1><p>"+pending.name+"</p><input id=pinbox type=password inputmode=numeric placeholder='PIN'><p><button class=btn id=pinok>Unlock</button> <button class='btn dark' id=pincancel>Back</button></p></div>";document.getElementById("pinok").onclick=function(){if(document.getElementById("pinbox").value.trim()===String(pending.pin)){user=pending;pending=null;draw();}};document.getElementById("pincancel").onclick=function(){pending=null;draw();};return;}el.innerHTML="<div class=login><h1>Posh Certify</h1>"+db.users.map(function(u){return "<button class=acct data-id='"+u.id+"'><b>"+u.name+"</b><br>"+roleName(u.role)+" \u00b7 "+u.site+"</button>";}).join("")+"</div>";el.querySelectorAll(".acct").forEach(function(b){b.onclick=function(){pending=db.users.filter(function(u){return u.id===b.getAttribute("data-id");})[0];draw();};});return;}el.innerHTML="<div class=top><span>Certify NG</span><span>"+user.name.split(" ")[0]+"</span></div><div class=wrap><div class=ok>"+roleName(user.role)+" \u00b7 "+user.site+"</div><p>Full board loading from last good build. Laundry issues towels and linen. Storekeeper does not.</p><button class=btn id=out>Sign out</button></div>";document.getElementById("out").onclick=function(){user=null;draw();};}
draw();
</script></body></html>
