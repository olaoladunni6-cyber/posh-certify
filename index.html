<!DOCTYPE html>
<html lang="en-NG"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Posh Certify</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#0d1613;max-width:480px;margin:0 auto}h1{font-family:Georgia,serif}.wrap{background:#f4efe6;min-height:100vh;padding:16px 16px 96px}.top{background:#1c332c;color:#f4efe6;padding:14px 16px;display:flex;justify-content:space-between}.btn{border:0;border-radius:999px;padding:10px 14px;background:#c4a574;margin:4px 4px 0 0}.btn.bad{background:#8c3a32;color:#fff}.btn.dark{background:#101512;color:#fff}.card,.room,.acct{background:#fff;border-radius:14px;padding:12px;margin:8px 0;border:0;width:100%;text-align:left}.ok{background:#dcebe3;padding:10px;border-radius:12px}.warn{background:#f3e6c8;padding:10px;border-radius:12px}textarea,input,select{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}p{margin:8px 0 0}textarea{min-height:64px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee}.row input{width:64px;margin:0}.qty{font-weight:700;color:#8c3a32}video,img.media{width:100%;max-height:180px;border-radius:10px;object-fit:cover}.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;padding:8px;font-size:12px}.login{min-height:100vh;color:#fff;padding:28px 18px;background:#1c332c}</style></head><body><div id="app"></div>
<script>
const KEY="posh-full-v13";
const JOBS=[["checkout","Checkout"],["inhouse","In-house"],["postmaint","Post maintenance"],["spring","Spring clean"]];
function jobLabel(j){var x=JOBS.filter(function(a){return a[0]===j;})[0];return x?x[1]:(j||"Not allocated");}
function hkName(id){var u=db.users.filter(function(x){return x.id===id;})[0];return u?u.name:"Unassigned";}
const POINTS=["Doorway","Bed","Vanity","Shower","Towels","Wardrobe","Desk","Minibar","High-touch","Floor","Curtains","Walkthrough"];
const ITEMS=[{id:"bath_towel",cat:"Towels",name:"Bath towel"},{id:"hand_towel",cat:"Towels",name:"Hand towel"},{id:"face_cloth",cat:"Towels",name:"Face cloth"},{id:"bath_mat",cat:"Towels",name:"Bath mat"},{id:"bathrobe",cat:"Towels",name:"Bathrobe"},{id:"sheet",cat:"Linen",name:"Bed sheet"},{id:"pillow",cat:"Linen",name:"Pillowcase"},{id:"duvet",cat:"Linen",name:"Duvet / comforter"},{id:"blanket",cat:"Linen",name:"Extra blanket"},{id:"soap",cat:"Toiletries",name:"Soap / shower gel"},{id:"shampoo",cat:"Toiletries",name:"Shampoo"},{id:"conditioner",cat:"Toiletries",name:"Conditioner"},{id:"lotion",cat:"Toiletries",name:"Body lotion"},{id:"dental",cat:"Toiletries",name:"Dental kit"},{id:"tissue",cat:"Toiletries",name:"Tissue / toilet paper"},{id:"slippers",cat:"Amenities",name:"Slippers"},{id:"water",cat:"Amenities",name:"Bottled water"},{id:"tea",cat:"Amenities",name:"Tea / coffee / sugar"},{id:"sew",cat:"Amenities",name:"Sewing kit"},{id:"bag",cat:"Amenities",name:"Laundry bag"},{id:"other",cat:"Other",name:"Other item"}];
function seed(){return{whatsapp:"",frontDesk:"",slips:[],scores:[],issues:[],stock:{},moves:[],breakfasts:[],menus:[],menu:{day:"",choices:["Continental","Nigerian","Fruit platter","Tea and toast"]},locations:["Ikeja","Victoria Island"],catalog:ITEMS.map(function(x){return{id:x.id,cat:x.cat,name:x.name,par:1};}),users:[{id:"admin",name:"Super Admin",role:"superadmin",site:"All sites",pin:"9090",whatsapp:"",demo:true},{id:"sophia",name:"Sophia Adeyemi",role:"manager",site:"Ikeja",pin:"2401",whatsapp:"",demo:true},{id:"kemi",name:"Kemi Adewale",role:"manager",site:"Victoria Island",pin:"2402",whatsapp:"",demo:true},{id:"blessing",name:"Blessing Okoro",role:"housekeeper",site:"Ikeja",pin:"4412",whatsapp:"",demo:true},{id:"tunde",name:"Tunde Balogun",role:"housekeeper",site:"Victoria Island",pin:"5508",whatsapp:"",demo:true},{id:"desk",name:"Front Desk Ikeja",role:"frontdesk",site:"Ikeja",pin:"1100",whatsapp:"",demo:true},{id:"dunni",name:"Oladunni Olayanju",role:"ceo",site:"Ikeja & VI",pin:"2026",whatsapp:"",demo:true},{id:"maint",name:"Ibrahim Musa",role:"maint",site:"Ikeja",pin:"3300",whatsapp:"",demo:true},{id:"chinedu",name:"Chinedu Okeke",role:"maint",site:"Victoria Island",pin:"3301",whatsapp:"",demo:true},{id:"amina",name:"Amina Bello",role:"laundry",site:"Ikeja",pin:"6600",whatsapp:"",demo:true},{id:"chef",name:"Chef Ade",role:"kitchen",site:"Ikeja",pin:"7700",whatsapp:"",demo:true},{id:"bisi",name:"Chef Bisi",role:"kitchen",site:"Victoria Island",pin:"7701",whatsapp:"",demo:true}],rooms:[{id:"r201",number:"201",site:"Ikeja",type:"Deluxe King",hk:"",job:"",status:"pending",photos:{},missing:{},laundryLog:[],demo:true},{id:"r501",number:"501",site:"Victoria Island",type:"Executive King",hk:"",job:"",status:"pending",photos:{},missing:{},laundryLog:[],demo:true}]};}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||"");if(x&&x.users)return x;}catch(e){}return seed();}
var db=load();if(!db.slips)db.slips=[];if(!db.breakfasts)db.breakfasts=[];if(!db.scores)db.scores=[];if(!db.issues)db.issues=[];if(!db.stock)db.stock={};if(!db.moves)db.moves=[];if(!db.menus)db.menus=[];if(!db.menu)db.menu={day:"",choices:["Continental","Nigerian","Fruit platter","Tea and toast"]};if(!db.locations)db.locations=["Ikeja","Victoria Island"];if(!db.catalog||!db.catalog.length)db.catalog=ITEMS.map(function(x){return{id:x.id,cat:x.cat,name:x.name,par:1};});if(!db.whatsapp)db.whatsapp="";if(!db.frontDesk)db.frontDesk="";if(!db.users.some(function(u){return u.role==="superadmin"||u.id==="admin";}))db.users.unshift({id:"admin",name:"Super Admin",role:"superadmin",site:"All sites",pin:"9090",whatsapp:"",demo:true});if(!db.users.some(function(u){return u.role==="manager"&&u.site==="Victoria Island";}))db.users.push({id:"kemi",name:"Kemi Adewale",role:"manager",site:"Victoria Island",pin:"2402",whatsapp:"",demo:true});if(!db.users.some(function(u){return u.role==="maint"&&u.site==="Victoria Island";}))db.users.push({id:"chinedu",name:"Chinedu Okeke",role:"maint",site:"Victoria Island",pin:"3301",whatsapp:"",demo:true});if(!db.users.some(function(u){return u.role==="kitchen"&&u.site==="Victoria Island";}))db.users.push({id:"bisi",name:"Chef Bisi",role:"kitchen",site:"Victoria Island",pin:"7701",whatsapp:"",demo:true});db.users.forEach(function(u){if(u.role==="maint"&&u.site==="Ikeja & VI")u.site="Ikeja";});db.users.forEach(function(u){if(u.role==="gm")u.role="ceo";});
db.rooms.forEach(function(r){if(!r.photos)r.photos={};if(!r.missing)r.missing={};if(!r.job)r.job="";if(r.laundryChecked==null)r.laundryChecked=false;});
function catalog(){return db.catalog&&db.catalog.length?db.catalog:ITEMS;}
function itemName(id){var it=catalog().filter(function(x){return x.id===id;})[0];return it?it.name:id;}
var user=null,tab="rooms",roomId=null,pending=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function mgr(){return user&&user.role==="manager";}
function isFD(){return user&&user.role==="frontdesk";}
function isGM(){return user&&(user.role==="ceo"||user.role==="gm");}
function isMaint(){return user&&user.role==="maint";}
function isLaundry(){return user&&user.role==="laundry";}
function isKitchen(){return user&&user.role==="kitchen";}
function isSuper(){return user&&user.role==="superadmin";}
function seesAll(){return isSuper()||isGM();}
function workSite(){return user&&user.site||"";}
function siteMatch(site){if(seesAll())return true;if(!user)return false;return String(site||"")===String(user.site||"");}
function siteRooms(){return db.rooms.filter(function(r){return siteMatch(r.site);});}
function siteHks(){return db.users.filter(function(u){return u.role==="housekeeper"&&siteMatch(u.site);});}
function roomSiteOf(num){var r=db.rooms.filter(function(x){return x.number===num;})[0];return r?r.site:"";}
function roleName(r){return {housekeeper:"Housekeeper",manager:"Duty manager",frontdesk:"Front desk",gm:"CEO",ceo:"CEO",superadmin:"Super Admin",maint:"Maintenance",laundry:"Laundry",kitchen:"Kitchen"}[r]||r;}
function today(){var d=new Date();function z(n){return (n<10?"0":"")+n;}return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);function z(x){return (x<10?"0":"")+x;}return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());}
function menuFor(day){var list=(db.menus||[]).filter(function(m){return m.day===day&&(seesAll()||!m.site||m.site===workSite());});return list.slice(-1)[0];}
function digits(s){return String(s||"").replace(/[^0-9]/g,"");}
function firstWa(role){var u=db.users.filter(function(x){return x.role===role&&digits(x.whatsapp).length>=11&&(!mgr()||siteMatch(x.site));})[0];return u?digits(u.whatsapp):"";}
function waDigits(){return digits(db.whatsapp)||firstWa("manager");}
function fdDigits(){return digits(db.frontDesk)||firstWa("frontdesk");}
function gmDigits(){return firstWa("ceo")||firstWa("gm");}
function pingMgrGm(msg){var a=waDigits(),g=gmDigits();if(a.length>=11)window.open("https://wa.me/"+a+"?text="+encodeURIComponent(msg),"_blank");setTimeout(function(){if(g.length>=11&&g!==a)window.open("https://wa.me/"+g+"?text="+encodeURIComponent(msg),"_blank");},700);}
function monthKey(){return today().slice(0,7);}
function naira(n){return "\u20a6"+Number(n||0).toLocaleString("en-NG");}
function todayScore(hk){return (db.scores||[]).filter(function(s){return s.hk===hk&&s.day===today();})[0];}
function monthUnsat(hk){return (db.scores||[]).filter(function(s){return s.hk===hk&&s.day.slice(0,7)===monthKey()&&s.rating==="unsat";}).length;}
function monthDeduct(hk){return monthUnsat(hk)*500;}
function monthNoPay(hk){return (db.scores||[]).filter(function(s){return s.hk===hk&&s.day.slice(0,7)===monthKey()&&s.rating==="nopay";}).length;}
function scoreLabel(s){if(!s)return "Not scored today";if(s.rating==="sat")return "Satisfactorily \u00b7 full pay";if(s.rating==="nopay")return "No salary \u00b7 task not completed / abandoned";return "Unsatisfactorily \u00b7 "+naira(500)+" deduction";}
function scorePanel(){var hks=siteHks();var rows=hks.map(function(u){var s=todayScore(u.id);var mark=scoreLabel(s);var btns=mgr()?"<button class='btn sat' data-id='"+u.id+"'>Satisfactorily</button> <button class='btn bad unsat' data-id='"+u.id+"'>Unsatisfactorily</button> <button class='btn dark nopay' data-id='"+u.id+"'>No salary</button>":"";return "<div class=card><b>"+u.name+"</b><br>"+u.site+"<br>"+mark+"<br>This month: "+monthUnsat(u.id)+" unsat \u00b7 deduct "+naira(monthDeduct(u.id))+" \u00b7 "+monthNoPay(u.id)+" no-salary days<br>"+btns+"</div>";}).join("");return "<h1>Housekeeper scores</h1><div class=ok>"+(mgr()?user.site+" \u00b7 ":"")+today()+" \u00b7 Satisfactorily = full pay \u00b7 Unsatisfactorily = \u20a6500 off \u00b7 No salary = no pay that day.</div>"+(rows||"<p>No housekeepers at this location.</p>");}
function canStore(){return isSuper()||mgr()||isLaundry()||isGM();}
function canMove(){return isSuper()||mgr()||isLaundry();}
function stockOf(id){return Number((db.stock||{})[id]||0);}
function parOf(id){var it=catalog().filter(function(x){return x.id===id;})[0];return Number(it&&it.par!=null?it.par:1);}
function lowStock(){return catalog().filter(function(it){return stockOf(it.id)<parOf(it.id);});}
function moveStock(id,qty,type,reason){qty=parseInt(qty,10);if(!(qty>0))return false;if(!db.stock)db.stock={};if(type==="out"){if(stockOf(id)<qty)return false;db.stock[id]=stockOf(id)-qty;}else{db.stock[id]=stockOf(id)+qty;}db.moves.push({id:"m"+Date.now()+id,item:id,qty:qty,type:type,reason:reason||"",by:user?user.name:"",at:new Date().toLocaleString(),day:today()});return true;}
function viewStore(){var items=isLaundry()?catalog().filter(function(it){return it.cat==="Towels"||it.cat==="Linen";}):catalog();var low=lowStock();var head="<h1>Store</h1><div class=ok>On-hand vs par.</div>";if(low.length)head+="<div class=warn>Low stock: "+low.map(function(it){return it.name+" ("+stockOf(it.id)+"/"+parOf(it.id)+")";}).join(", ")+"</div>";var rows=items.map(function(it){var n=stockOf(it.id),p=parOf(it.id),flag=n<p?" \u00b7 LOW":"";var act=canMove()?"<input class=sqty type=number min=1 data-item='"+it.id+"' placeholder='Qty'><button class='btn recS' data-id='"+it.id+"'>Receive</button> <button class='btn bad issS' data-id='"+it.id+"'>Issue</button>":"";if(isSuper())act+=" <button class='btn dark setS' data-id='"+it.id+"'>Set count</button>";return "<div class=card><b>"+it.name+"</b> \u00b7 "+it.cat+"<br>On hand <b>"+n+"</b> \u00b7 par "+p+flag+"<br>"+act+"</div>";}).join("");var log=(db.moves||[]).slice(-12).reverse().map(function(m){return "<p>"+m.at+" \u00b7 "+(m.type==="out"?"OUT":"IN")+" "+m.qty+" x "+itemName(m.item)+" \u00b7 "+m.reason+" \u00b7 "+m.by+"</p>";}).join("");var add=isSuper()?"<div class=card><h3>Add inventory item</h3><input id=iname placeholder='Item name'><select id=icat><option>Towels</option><option>Linen</option><option>Toiletries</option><option>Amenities</option><option>Other</option></select><input id=ipar type=number min=0 placeholder='Par'><input id=iqty type=number min=0 placeholder='Opening qty'><button class=btn id=addItem>Save item</button></div>":"";return head+rows+add+"<div class=card><h3>Recent movements</h3>"+(log||"<p>None yet.</p>")+"</div>";}
function canReport(){return user&&(user.role==="housekeeper"||isFD()||mgr()||isGM());}
function issueLabel(s){return {received:"Received",pending:"Pending",materials:"Materials needed",cash:"Cash needed",outsourced:"Outsourced",completed:"Completed"}[s]||s;}
function issueHold(s){return s==="materials"||s==="cash"||s==="outsourced";}
function hoursAgo(ts){return (Date.now()-Number(ts||0))/3600000;}
function fmtWhen(ts){try{return new Date(ts).toLocaleString();}catch(e){return "";}}
function issueOverdue(it){if(!it||it.status==="completed"||issueHold(it.status))return false;return hoursAgo(it.openedAt)>=24;}
function issueLateOnComplete(it){if(!it||!it.completedAt)return false;if(issueHold(it.heldAs||""))return false;return (Number(it.completedAt)-Number(it.openedAt))>=24*3600000;}
function monthMaintPen(){return (db.issues||[]).filter(function(x){return x.penalty&&String(x.openedDay||"").slice(0,7)===monthKey();}).reduce(function(a,x){return a+Number(x.penalty||0);},0);}
function viewIssues(){var form="";if(canReport())form="<div class=card><h3>Report a fault</h3><select id=irm>"+siteRooms().map(function(r){return "<option value='"+r.number+"'>"+r.number+" \u00b7 "+r.site+"</option>";}).join("")+"</select><textarea id=ifault placeholder='What is wrong?'></textarea><p>Deadline (hours)</p><input id=ihours type=number min=1 max=24 value=6><button class=btn id=raiseI>Send to maintenance</button></div>";var list=(db.issues||[]).filter(function(it){return siteMatch(it.site);}).slice().reverse();var cards=list.map(function(it){var late=issueOverdue(it);var lateDone=it.status==="completed"&&issueLateOnComplete(it);var flag=late?"<div class=warn>Over 24 hours.</div>":"";var st="";if(isMaint()&&it.status!=="completed")st=["received","pending","materials","cash","outsourced","completed"].map(function(s){return "<button class='btn setI' data-id='"+it.id+"' data-st='"+s+"'>"+issueLabel(s)+"</button>";}).join(" ");var mgrBtns="";if(mgr()&&it.status==="completed"&&!it.cert){mgrBtns="<button class='btn certI' data-id='"+it.id+"' data-v='sat'>Certify satisfactory</button> <button class='btn bad certI' data-id='"+it.id+"' data-v='unsat'>Unsatisfactory</button>";if(lateDone)mgrBtns+=" <button class='btn bad penI' data-id='"+it.id+"'>Penalize "+naira(1000)+"</button> <button class='btn dark waiveI' data-id='"+it.id+"'>No penalty</button>";}if(mgr()&&late&&it.status!=="completed")mgrBtns+="<button class='btn bad penI' data-id='"+it.id+"'>Penalize "+naira(1000)+"</button>";var pay=it.penalty?("<p>Penalty "+naira(it.penalty)+"</p>"):"";var cert=it.cert?("<p>Duty manager: "+(it.cert==="sat"?"Satisfactory":it.cert==="waived"?"Waived":"Unsatisfactory")+"</p>"):"";return "<div class=card><b>Rm "+it.room+"</b> \u00b7 "+issueLabel(it.status)+(late?" \u00b7 LATE":"")+"<br>"+it.fault+"<br>By "+it.by+flag+pay+cert+st+mgrBtns+"</div>";}).join("");return "<h1>Maintenance issues</h1>"+form+(cards||"<p>No issues at this location.</p>");}
function todayMeals(){return db.breakfasts.filter(function(b){return b.day===today();});}
function makeCode(){var c;do{c=String(1000+Math.floor(Math.random()*9000));}while(todayMeals().some(function(b){return b.code===c;}));return c;}
function mealReportText(){var list=todayMeals().filter(function(b){return siteMatch(roomSiteOf(b.room));}),sv=list.filter(function(b){return b.status==="served";});var by={};sv.forEach(function(b){by[b.meal]=(by[b.meal]||0)+1;});var lines=Object.keys(by).map(function(k){return by[k]+" x "+k;});return "POSH BREAKFAST REPORT\n"+(user&&user.site?user.site+"\n":"")+today()+"\nIssued: "+list.length+"\nServed: "+sv.length+"\n"+(lines.join("\n")||"No meals served yet.");}
function locSel(id,v){return "<select id='"+id+"'>"+db.locations.map(function(l){return "<option"+(l===v?" selected":"")+">"+l+"</option>";}).join("")+"</select>";}
function roleSel(id,v){var roles=[["housekeeper","Housekeeper"],["manager","Duty manager"],["frontdesk","Front desk"],["ceo","CEO"],["superadmin","Super Admin"],["maint","Maintenance"],["laundry","Laundry"],["kitchen","Kitchen"]];return "<select id='"+id+"'>"+roles.map(function(r){return "<option value='"+r[0]+"'"+(v===r[0]?" selected":"")+">"+r[1]+"</option>";}).join("")+"</select>";}
function hkSel(id,v){var hks=siteHks();return "<select id='"+id+"'>"+hks.map(function(u){return "<option value='"+u.id+"'"+(v===u.id?" selected":"")+">"+u.name+"</option>";}).join("")+"</select>";}
function jobSel(id,v){return "<select id='"+id+"'>"+JOBS.map(function(j){return "<option value='"+j[0]+"'"+(v===j[0]?" selected":"")+">"+j[1]+"</option>";}).join("")+"</select>";}
function mediaCount(r){var n=0;Object.keys(r.photos||{}).forEach(function(k){if(r.photos[k])n++;});return n;}
function mediaBox(src){if(!src||src===true)return src?"<p>On file</p>":"<p>No media</p>";var s=String(src);if(s.indexOf("data:video")===0)return "<video class=media controls playsinline src='"+s+"'></video>";if(s.indexOf("data:image")===0)return "<img class=media src='"+s+"'>";return "<p>On file</p>";}
function missCount(r){var n=0;Object.keys(r.missing||{}).forEach(function(k){n+=Number(r.missing[k]||0);});return n;}
function allocBox(){var roomOpts=siteRooms().map(function(r){return "<option value='"+r.id+"'>"+r.number+" \u00b7 "+r.site+"</option>";}).join("");var add=isSuper()?"<div class=card><h3>Add room</h3><input id=rnum placeholder='Room number'><input id=rtype placeholder='Type'>"+locSel("rsite","Ikeja")+"<button class=btn id=addRoom>Add room</button></div>":"";return ((isFD()||mgr())?"<div class=card><h3>Allocate room</h3><select id=aroom>"+roomOpts+"</select>"+hkSel("ahk","")+jobSel("ajob","checkout")+"<button class=btn id=doAlloc>Assign to housekeeper</button></div>":"")+add;}
function draw(){var el=document.getElementById("app");
if(!user){if(pending){el.innerHTML="<div class=login><h1>Enter PIN</h1><p>"+pending.name+"</p><input id=pinbox type=password inputmode=numeric placeholder='PIN'><p><button class=btn id=pinok>Unlock</button> <button class='btn dark' id=pincancel>Back</button></p></div>";document.getElementById("pinok").onclick=function(){if(document.getElementById("pinbox").value.trim()===String(pending.pin)){user=pending;pending=null;tab=isKitchen()?"meals":(isLaundry()?"laundry":(isMaint()?"issues":"rooms"));roomId=null;draw();}};document.getElementById("pincancel").onclick=function(){pending=null;draw();};return;}
el.innerHTML="<div class=login><h1>Posh Certify</h1>"+db.users.map(function(u){return "<button class=acct data-id='"+u.id+"'><b>"+u.name+"</b><br>"+roleName(u.role)+" \u00b7 "+u.site+"</button>";}).join("")+"</div>";
el.querySelectorAll(".acct").forEach(function(b){b.onclick=function(){pending=db.users.filter(function(u){return u.id===b.getAttribute("data-id");})[0];draw();};});return;}
var inner=tab==="staff"?viewStaff():tab==="me"?viewMe():tab==="meals"?viewMeals():tab==="issues"?viewIssues():tab==="laundry"?viewSlips():roomId?viewRoom():viewBoard();
el.innerHTML="<div class=top><span>Certify NG</span><span>"+user.name.split(" ")[0]+"</span></div><div class=wrap>"+inner+"</div><div class=dock><button id=d1>Rooms</button><button id=d2>Fix</button><button id=d5>Meals</button><button id=d3>Staff</button><button id=d4>Me</button></div>";
["rooms","issues","staff","me","meals"].forEach(function(name,i){var ids=["d1","d2","d3","d4","d5"];document.getElementById(ids[i]).onclick=function(){tab=isLaundry()&&name==="issues"?"laundry":name;roomId=null;draw();};});
bind();}
function viewBoard(){if(isKitchen())return viewMeals();if(isLaundry())return viewSlips();if(isGM()){var tm=todayMeals(),sv=tm.filter(function(b){return b.status==="served";}).length;var openI=(db.issues||[]).filter(function(x){return x.status!=="completed";}).length;return "<div class=ok>CEO report only.</div><h1>House report</h1><div class=card><h3>Breakfast today</h3><p><b>"+sv+"</b> served of <b>"+tm.length+"</b></p></div><div class=card><h3>Maintenance</h3><p>"+openI+" open issues</p></div>"+scorePanel()+viewStore();}
var list=seesAll()?db.rooms:(mgr()||isFD()||isMaint()||isLaundry()||isKitchen())?siteRooms():db.rooms.filter(function(r){return r.hk===user.id&&r.status!=="ooo"&&r.job;});

var saveMenu=document.getElementById("saveMenu");if(saveMenu)saveMenu.onclick=function(){if(!(mgr()||isKitchen()||isSuper()))return;var raw=(document.getElementById("mchoices").value||"").split("\n").map(function(s){return s.trim();}).filter(Boolean);if(!raw.length){alert("Add at least one meal choice.");return;}var day=(document.getElementById("mday")&&document.getElementById("mday").value)||addDays(1);if(!day){alert("Choose a date.");return;}if(!db.menus)db.menus=[];db.menus=db.menus.filter(function(m){return !(m.day===day&&(m.site||"")===(seesAll()?"":workSite()));});db.menus.push({day:day,choices:raw,site:seesAll()?"":workSite(),by:user.name,at:new Date().toLocaleString()});save();draw();};
