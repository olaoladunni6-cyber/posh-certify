<!DOCTYPE html>
<html lang="en-NG"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Posh Certify</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#0d1613;max-width:480px;margin:0 auto}h1{font-family:Georgia,serif}.wrap{background:#f4efe6;min-height:100vh;padding:16px 16px 90px}.top{background:#1c332c;color:#f4efe6;padding:14px 16px;display:flex;justify-content:space-between}.btn{border:0;border-radius:999px;padding:10px 14px;background:#c4a574;margin:4px 4px 0 0}.btn.bad{background:#8c3a32;color:#fff}.btn.dark{background:#101512;color:#fff}.card,.room,.acct{background:#fff;border-radius:14px;padding:12px;margin:8px 0;border:0;width:100%;text-align:left}.ok{background:#dcebe3;padding:10px;border-radius:12px}.warn{background:#f3e6c8;padding:10px;border-radius:12px}input,select{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}p{margin:8px 0 0}.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;padding:10px}.login{min-height:100vh;color:#fff;padding:28px 18px;background:#1c332c}</style></head><body><div id="app"></div>
<script>
const KEY="posh-full-v8";
function seed(){return{whatsapp:"",frontDesk:"",locations:["Ikeja","Victoria Island"],users:[{id:"sophia",name:"Sophia Adeyemi",role:"manager",site:"Ikeja",pin:"2401",whatsapp:"",demo:true},{id:"blessing",name:"Blessing Okoro",role:"housekeeper",site:"Ikeja",pin:"4412",whatsapp:"",demo:true},{id:"tunde",name:"Tunde Balogun",role:"housekeeper",site:"Victoria Island",pin:"5508",whatsapp:"",demo:true},{id:"desk",name:"Front Desk Ikeja",role:"frontdesk",site:"Ikeja",pin:"1100",whatsapp:"",demo:true},{id:"dunni",name:"Oladunni Olayanju",role:"gm",site:"Ikeja & VI",pin:"2026",whatsapp:"",demo:true},{id:"maint",name:"Ibrahim Musa",role:"maint",site:"Ikeja & VI",pin:"3300",whatsapp:"",demo:true}],rooms:[{id:"r201",number:"201",site:"Ikeja",type:"Deluxe King",hk:"blessing",status:"pending",photos:{},demo:true},{id:"r501",number:"501",site:"Victoria Island",type:"Executive King",hk:"tunde",status:"pending",photos:{},demo:true}]};}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||"");if(x&&x.users)return x;}catch(e){}return seed();}
var db=load();if(!db.frontDesk)db.frontDesk="";if(!db.whatsapp)db.whatsapp="";if(!db.locations)db.locations=["Ikeja","Victoria Island"];
db.users.forEach(function(u){if(u.whatsapp==null)u.whatsapp="";});
var user=null,tab="rooms",roomId=null,pending=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function mgr(){return user&&user.role==="manager";}
function isFD(){return user&&user.role==="frontdesk";}
function isGM(){return user&&user.role==="gm";}
function isMaint(){return user&&user.role==="maint";}
function digits(s){return String(s||"").replace(/[^0-9]/g,"");}
function firstWa(role, fallback){var u=db.users.filter(function(x){return x.role===role&&digits(x.whatsapp).length>=11;})[0];var n=u?digits(u.whatsapp):"";return n.length>=11?n:digits(fallback);}
function waDigits(){return digits(db.whatsapp)||firstWa("manager","");}
function fdDigits(){return digits(db.frontDesk)||firstWa("frontdesk","");}
function pingBoth(msg){var a=fdDigits(),b=waDigits();if(a.length>=11)window.open("https://wa.me/"+a+"?text="+encodeURIComponent(msg),"_blank");setTimeout(function(){if(b.length>=11&&b!==a)window.open("https://wa.me/"+b+"?text="+encodeURIComponent(msg),"_blank");},700);}
function locSel(id,v){return "<select id='"+id+"'>"+db.locations.map(function(l){return "<option"+(l===v?" selected":"")+">"+l+"</option>";}).join("")+"</select>";}
function roleSel(id,v){var roles=[["housekeeper","Housekeeper"],["manager","Duty manager"],["frontdesk","Front desk"],["gm","General Manager"],["maint","Maintenance"]];return "<select id='"+id+"' data-er='"+id+"'>"+roles.map(function(r){return "<option value='"+r[0]+"'"+(v===r[0]?" selected":"")+">"+r[1]+"</option>";}).join("")+"</select>";}
function draw(){var el=document.getElementById("app");
if(!user){if(pending){el.innerHTML="<div class=login><h1>Enter PIN</h1><p>"+pending.name+"</p><input id=pinbox type=password inputmode=numeric placeholder='PIN'><p><button class=btn id=pinok>Unlock</button> <button class='btn dark' id=pincancel>Back</button></p></div>";document.getElementById("pinok").onclick=function(){if(document.getElementById("pinbox").value.trim()===String(pending.pin)){user=pending;pending=null;tab="rooms";roomId=null;draw();}};document.getElementById("pincancel").onclick=function(){pending=null;draw();};return;}
el.innerHTML="<div class=login><h1>Posh Certify</h1>"+db.users.map(function(u){return "<button class=acct data-id='"+u.id+"'><b>"+u.name+"</b><br>"+u.role+" · "+u.site+"</button>";}).join("")+"</div>";
el.querySelectorAll(".acct").forEach(function(b){b.onclick=function(){pending=db.users.filter(function(u){return u.id===b.getAttribute("data-id");})[0];draw();};});return;}
var inner=tab==="staff"?viewStaff():(tab==="me"?viewMe():(roomId?viewRoom():viewBoard()));
el.innerHTML="<div class=top><span>Certify NG</span><span>"+user.name.split(" ")[0]+"</span></div><div class=wrap>"+inner+"</div><div class=dock><button id=d1>Rooms</button><button id=d3>Staff</button><button id=d4>Me</button></div>";
document.getElementById("d1").onclick=function(){tab="rooms";roomId=null;draw();};
document.getElementById("d3").onclick=function(){tab="staff";roomId=null;draw();};
document.getElementById("d4").onclick=function(){tab="me";roomId=null;draw();};
bind();}
function names(a){return a.length?a.map(function(r){return r.number;}).join(", "):"—";}
function gmCard(site){var rs=db.rooms.filter(function(r){return !site||r.site===site;});return "<div class=card><h3>"+(site||"All locations")+"</h3><p><b>"+rs.filter(function(r){return r.status==="certified";}).length+"</b> certified<br>"+names(rs.filter(function(r){return r.status==="certified";}))+"</p><p><b>"+rs.filter(function(r){return r.status==="submitted";}).length+"</b> clean / with manager<br>"+names(rs.filter(function(r){return r.status==="submitted";}))+"</p><p><b>"+rs.filter(function(r){return r.status==="ooo";}).length+"</b> OOO<br>"+names(rs.filter(function(r){return r.status==="ooo";}))+"</p></div>";}
function viewBoard(){if(isGM())return "<div class=ok>GM report only.</div><h1>House report</h1>"+gmCard("")+db.locations.map(gmCard).join("");
var list=(mgr()||isMaint())?db.rooms:(isFD()?db.rooms.filter(function(r){return r.status==="certified"||r.status==="submitted"||r.status==="ooo";}):db.rooms.filter(function(r){return r.hk===user.id&&r.status!=="ooo";}));
return "<h1>Rooms</h1>"+list.map(function(r){return "<div class=room><b>"+r.number+"</b> "+r.type+"<br>"+r.site+" · "+r.status+" <button class='btn open' data-id='"+r.id+"'>Open</button></div>";}).join("");}
function viewRoom(){var r=db.rooms.filter(function(x){return x.id===roomId;})[0];
var act=mgr()?"<button class=btn id=cert>Certify and notify front desk</button> <button class='btn bad' id=ooo>Set OUT OF ORDER</button> <button class=btn id=rel>Return to service</button>":isMaint()?"<button class='btn bad' id=ooo>Set OUT OF ORDER</button> <button class=btn id=rel>Return to service</button>":isFD()?(r.status==="ooo"?"<div class=warn>OOO. Do not sell.</div>":"<div class=ok>Sell when CERTIFIED.</div>"):isGM()?"<div class=ok>Reports only.</div>":"<button class=btn id=send>Submit to duty manager</button>";
return "<p id=back>&larr; Back</p><h1>Room "+r.number+"</h1><p>"+r.status+"</p>"+act;}
function viewStaff(){if(!mgr())return "<h1>Staff</h1><div class=warn>Duty manager only.</div>";
var people=db.users.map(function(u){return "<div class=card><b>"+u.name+"</b> · "+u.role+"<p>Name</p><input data-en='"+u.id+"' value='"+u.name+"'><p>Role</p>"+roleSel("er-"+u.id,u.role)+"<p>Location</p>"+locSel("es-"+u.id,u.site)+"<p>PIN</p><input data-pinfor='"+u.id+"' placeholder='New PIN' inputmode=numeric><p>WhatsApp</p><input data-ew='"+u.id+"' value='"+digits(u.whatsapp)+"' placeholder='2348012345678'><button class='btn saveU' data-id='"+u.id+"'>Save changes</button> <button class='btn bad delU' data-id='"+u.id+"'>Remove</button></div>";}).join("");
return "<h1>Staff</h1>"+people+"<p><button class='btn dark' id=clearDemo>Remove demo staff and rooms</button></p><div class=card><h3>Hotel WhatsApp numbers</h3><p>Duty manager desk phone — used when a room is submitted or OOO</p><input id=wa value='"+digits(db.whatsapp)+"' placeholder='23480...'><p>Front desk phone — used when a room is certified or OOO</p><input id=fd value='"+digits(db.frontDesk)+"' placeholder='23480...'><button class=btn id=saveWa>Save hotel numbers</button></div><div class=card><h3>Add staff</h3><input id=sn placeholder='Full name'>"+roleSel("sr","housekeeper")+locSel("ss","Ikeja")+"<input id=sp placeholder='PIN'><input id=sw placeholder='WhatsApp 23480...'><button class=btn id=addStaff>Save staff</button></div>";}
function viewMe(){return "<h1>"+user.name+"</h1><p>"+user.role+"</p><button class=btn id=out>Sign out</button>";}
function bind(){
document.querySelectorAll(".open").forEach(function(b){b.onclick=function(){roomId=b.getAttribute("data-id");draw();};});
var back=document.getElementById("back");if(back)back.onclick=function(){roomId=null;draw();};
var out=document.getElementById("out");if(out)out.onclick=function(){user=null;draw();};
var send=document.getElementById("send");if(send)send.onclick=function(){if(mgr()||isFD()||isGM()||isMaint())return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];r.status="submitted";save();var n=waDigits();if(n.length>=11)window.open("https://wa.me/"+n+"?text="+encodeURIComponent("POSH CERTIFY Room "+r.number+" submitted"),"_blank");roomId=null;draw();};
var cert=document.getElementById("cert");if(cert)cert.onclick=function(){if(!mgr())return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];if(r.status==="ooo"){alert("Release OOO first");return;}r.status="certified";save();var fd=fdDigits();if(fd.length>=11)window.open("https://wa.me/"+fd+"?text="+encodeURIComponent("POSH CERTIFY Room "+r.number+" CERTIFIED. Ready to sell."),"_blank");else alert("Add the front desk WhatsApp on Staff.");roomId=null;draw();};
var ooo=document.getElementById("ooo");if(ooo)ooo.onclick=function(){if(!(isMaint()||mgr()))return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];r.status="ooo";save();pingBoth("POSH CERTIFY Room "+r.number+" OUT OF ORDER. CLOSED. Do not sell.");roomId=null;draw();};
var rel=document.getElementById("rel");if(rel)rel.onclick=function(){if(!(isMaint()||mgr()))return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];r.status="pending";save();pingBoth("POSH CERTIFY Room "+r.number+" BACK IN SERVICE.");roomId=null;draw();};
var saveWa=document.getElementById("saveWa");if(saveWa)saveWa.onclick=function(){if(!mgr())return;db.whatsapp=digits(document.getElementById("wa").value);db.frontDesk=digits(document.getElementById("fd").value);save();draw();};
document.querySelectorAll(".delU").forEach(function(b){b.onclick=function(){if(!mgr())return;var id=b.getAttribute("data-id");if(user&&id===user.id){alert("Sign in as someone else before removing this account.");return;}if(!confirm("Remove this staff member?"))return;db.users=db.users.filter(function(u){return u.id!==id;});save();draw();};});
document.querySelectorAll(".saveU").forEach(function(b){b.onclick=function(){if(!mgr())return;var id=b.getAttribute("data-id");var n=(document.querySelector("[data-en='"+id+"']")||{}).value;var roleEl=document.getElementById("er-"+id);var siteEl=document.getElementById("es-"+id);var pinEl=document.querySelector("[data-pinfor='"+id+"']");var waEl=document.querySelector("[data-ew='"+id+"']");db.users.forEach(function(u){if(u.id!==id)return;if(n&&String(n).trim())u.name=String(n).trim();if(roleEl)u.role=roleEl.value;if(siteEl)u.site=siteEl.value;if(pinEl&&pinEl.value.trim().length>=4)u.pin=pinEl.value.trim();if(waEl)u.whatsapp=digits(waEl.value);});save();alert("Saved");draw();};});
var clearDemo=document.getElementById("clearDemo");if(clearDemo)clearDemo.onclick=function(){if(!mgr())return;db.users=db.users.filter(function(u){return !u.demo||(user&&u.id===user.id);});db.rooms=db.rooms.filter(function(r){return !r.demo;});save();draw();};
var addStaff=document.getElementById("addStaff");if(addStaff)addStaff.onclick=function(){if(!mgr())return;var n=document.getElementById("sn").value.trim();if(!n)return;var pin=document.getElementById("sp").value.trim();if(pin.length<4){alert("Need a PIN");return;}db.users.push({id:"u"+Date.now(),name:n,role:document.getElementById("sr").value,site:document.getElementById("ss").value,pin:pin,whatsapp:digits(document.getElementById("sw").value),demo:false});save();draw();};
}
draw();
</script></body></html>
