<!DOCTYPE html>
<html lang="en-NG"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Posh Certify</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#0d1613;max-width:480px;margin:0 auto}h1{font-family:Georgia,serif}.wrap{background:#f4efe6;min-height:100vh;padding:16px 16px 96px}.top{background:#1c332c;color:#f4efe6;padding:14px 16px;display:flex;justify-content:space-between}.btn{border:0;border-radius:999px;padding:10px 14px;background:#c4a574;margin:4px 4px 0 0}.btn.bad{background:#8c3a32;color:#fff}.btn.dark{background:#101512;color:#fff}.card,.room,.acct{background:#fff;border-radius:14px;padding:12px;margin:8px 0;border:0;width:100%;text-align:left}.ok{background:#dcebe3;padding:10px;border-radius:12px}.warn{background:#f3e6c8;padding:10px;border-radius:12px}textarea,input,select{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}p{margin:8px 0 0}textarea{min-height:64px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee}.row input{width:64px;margin:0}.qty{font-weight:700;color:#8c3a32}video,img.media{width:100%;max-height:180px;border-radius:10px;object-fit:cover}.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;padding:8px;font-size:12px}.login{min-height:100vh;color:#fff;padding:28px 18px;background:#1c332c}code{font-size:22px;letter-spacing:2px}</style></head><body><div id="app"></div>
<script>
const KEY="posh-full-v13";
const JOBS=[["checkout","Checkout"],["inhouse","In-house"],["postmaint","Post maintenance"],["spring","Spring clean"]];
function jobLabel(j){var x=JOBS.filter(function(a){return a[0]===j;})[0];return x?x[1]:(j||"Not allocated");}
function hkName(id){var u=db.users.filter(function(x){return x.id===id;})[0];return u?u.name:"Unassigned";}
const POINTS=["Doorway","Bed","Vanity","Shower","Towels","Wardrobe","Desk","Minibar","High-touch","Floor","Curtains","Walkthrough"];
const ITEMS=[{id:"bath_towel",cat:"Towels",name:"Bath towel"},{id:"hand_towel",cat:"Towels",name:"Hand towel"},{id:"face_cloth",cat:"Towels",name:"Face cloth"},{id:"bath_mat",cat:"Towels",name:"Bath mat"},{id:"bathrobe",cat:"Towels",name:"Bathrobe"},{id:"sheet",cat:"Linen",name:"Bed sheet"},{id:"pillow",cat:"Linen",name:"Pillowcase"},{id:"duvet",cat:"Linen",name:"Duvet / comforter"},{id:"blanket",cat:"Linen",name:"Extra blanket"},{id:"soap",cat:"Toiletries",name:"Soap / shower gel"},{id:"shampoo",cat:"Toiletries",name:"Shampoo"},{id:"conditioner",cat:"Toiletries",name:"Conditioner"},{id:"lotion",cat:"Toiletries",name:"Body lotion"},{id:"dental",cat:"Toiletries",name:"Dental kit"},{id:"tissue",cat:"Toiletries",name:"Tissue / toilet paper"},{id:"slippers",cat:"Amenities",name:"Slippers"},{id:"water",cat:"Amenities",name:"Bottled water"},{id:"tea",cat:"Amenities",name:"Tea / coffee / sugar"},{id:"sew",cat:"Amenities",name:"Sewing kit"},{id:"bag",cat:"Amenities",name:"Laundry bag"},{id:"other",cat:"Other",name:"Other item"}];
function seed(){return{whatsapp:"",frontDesk:"",slips:[],breakfasts:[],menu:{day:"",choices:["Continental","Nigerian","Fruit platter","Tea and toast"]},locations:["Ikeja","Victoria Island"],catalog:ITEMS.map(function(x){return{id:x.id,cat:x.cat,name:x.name,par:1};}),users:[{id:"sophia",name:"Sophia Adeyemi",role:"manager",site:"Ikeja",pin:"2401",whatsapp:"",demo:true},{id:"blessing",name:"Blessing Okoro",role:"housekeeper",site:"Ikeja",pin:"4412",whatsapp:"",demo:true},{id:"tunde",name:"Tunde Balogun",role:"housekeeper",site:"Victoria Island",pin:"5508",whatsapp:"",demo:true},{id:"desk",name:"Front Desk Ikeja",role:"frontdesk",site:"Ikeja",pin:"1100",whatsapp:"",demo:true},{id:"dunni",name:"Oladunni Olayanju",role:"gm",site:"Ikeja & VI",pin:"2026",whatsapp:"",demo:true},{id:"maint",name:"Ibrahim Musa",role:"maint",site:"Ikeja & VI",pin:"3300",whatsapp:"",demo:true},{id:"amina",name:"Amina Bello",role:"laundry",site:"Ikeja",pin:"6600",whatsapp:"",demo:true},{id:"chef",name:"Chef Ade",role:"kitchen",site:"Ikeja",pin:"7700",whatsapp:"",demo:true}],rooms:[{id:"r201",number:"201",site:"Ikeja",type:"Deluxe King",hk:"",job:"",status:"pending",photos:{},missing:{},laundryLog:[],demo:true},{id:"r501",number:"501",site:"Victoria Island",type:"Executive King",hk:"",job:"",status:"pending",photos:{},missing:{},laundryLog:[],demo:true}]};}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||"");if(x&&x.users)return x;}catch(e){}return seed();}
var db=load();if(!db.slips)db.slips=[];if(!db.breakfasts)db.breakfasts=[];if(!db.menu)db.menu={day:"",choices:["Continental","Nigerian","Fruit platter","Tea and toast"]};if(!db.locations)db.locations=["Ikeja","Victoria Island"];if(!db.catalog||!db.catalog.length)db.catalog=ITEMS.map(function(x){return{id:x.id,cat:x.cat,name:x.name,par:1};});if(!db.whatsapp)db.whatsapp="";if(!db.frontDesk)db.frontDesk="";
db.rooms.forEach(function(r){if(!r.photos)r.photos={};if(!r.missing)r.missing={};if(!r.job)r.job="";if(r.laundryChecked==null)r.laundryChecked=false;});
function catalog(){return db.catalog&&db.catalog.length?db.catalog:ITEMS;}
function itemName(id){var it=catalog().filter(function(x){return x.id===id;})[0];return it?it.name:id;}
var user=null,tab="rooms",roomId=null,pending=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function mgr(){return user&&user.role==="manager";}
function isFD(){return user&&user.role==="frontdesk";}
function isGM(){return user&&user.role==="gm";}
function isMaint(){return user&&user.role==="maint";}
function isLaundry(){return user&&user.role==="laundry";}
function isKitchen(){return user&&user.role==="kitchen";}
function today(){var d=new Date();function z(n){return (n<10?"0":"")+n;}return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());}
function digits(s){return String(s||"").replace(/[^0-9]/g,"");}
function firstWa(role){var u=db.users.filter(function(x){return x.role===role&&digits(x.whatsapp).length>=11;})[0];return u?digits(u.whatsapp):"";}
function waDigits(){return digits(db.whatsapp)||firstWa("manager");}
function fdDigits(){return digits(db.frontDesk)||firstWa("frontdesk");}
function gmDigits(){return firstWa("gm");}
function pingMgrGm(msg){var a=waDigits(),g=gmDigits();if(a.length>=11)window.open("https://wa.me/"+a+"?text="+encodeURIComponent(msg),"_blank");setTimeout(function(){if(g.length>=11&&g!==a)window.open("https://wa.me/"+g+"?text="+encodeURIComponent(msg),"_blank");},700);}
function todayMeals(){return db.breakfasts.filter(function(b){return b.day===today();});}
function makeCode(){var c;do{c=String(1000+Math.floor(Math.random()*9000));}while(todayMeals().some(function(b){return b.code===c;}));return c;}
function mealReportText(){var list=todayMeals(),sv=list.filter(function(b){return b.status==="served";});var by={};sv.forEach(function(b){by[b.meal]=(by[b.meal]||0)+1;});var lines=Object.keys(by).map(function(k){return by[k]+" x "+k;});return "POSH BREAKFAST REPORT\n"+today()+"\nIssued: "+list.length+"\nServed: "+sv.length+"\nPending: "+(list.length-sv.length)+"\n"+(lines.join("\n")||"No meals served yet.");}
function locSel(id,v){return "<select id='"+id+"'>"+db.locations.map(function(l){return "<option"+(l===v?" selected":"")+">"+l+"</option>";}).join("")+"</select>";}
function roleSel(id,v){var roles=[["housekeeper","Housekeeper"],["manager","Duty manager"],["frontdesk","Front desk"],["gm","General Manager"],["maint","Maintenance"],["laundry","Laundry"],["kitchen","Kitchen"]];return "<select id='"+id+"'>"+roles.map(function(r){return "<option value='"+r[0]+"'"+(v===r[0]?" selected":"")+">"+r[1]+"</option>";}).join("")+"</select>";}
function hkSel(id,v){var hks=db.users.filter(function(u){return u.role==="housekeeper";});return "<select id='"+id+"'>"+hks.map(function(u){return "<option value='"+u.id+"'"+(v===u.id?" selected":"")+">"+u.name+"</option>";}).join("")+"</select>";}
function jobSel(id,v){return "<select id='"+id+"'>"+JOBS.map(function(j){return "<option value='"+j[0]+"'"+(v===j[0]?" selected":"")+">"+j[1]+"</option>";}).join("")+"</select>";}
function mediaCount(r){var n=0;Object.keys(r.photos||{}).forEach(function(k){if(r.photos[k])n++;});return n;}
function mediaBox(src){if(!src||src===true)return src?"<p>On file</p>":"<p>No media</p>";var s=String(src);if(s.indexOf("data:video")===0)return "<video class=media controls playsinline src='"+s+"'></video>";if(s.indexOf("data:image")===0)return "<img class=media src='"+s+"'>";return "<p>On file</p>";}
function missCount(r){var n=0;Object.keys(r.missing||{}).forEach(function(k){n+=Number(r.missing[k]||0);});return n;}
function allocBox(){var roomOpts=db.rooms.map(function(r){return "<option value='"+r.id+"'>"+r.number+" · "+r.site+"</option>";}).join("");return "<div class=card><h3>Allocate room</h3><select id=aroom>"+roomOpts+"</select>"+hkSel("ahk","")+jobSel("ajob","checkout")+"<button class=btn id=doAlloc>Assign to housekeeper</button></div><div class=card><h3>Add room</h3><input id=rnum placeholder='Room number'><input id=rtype placeholder='Type'>"+locSel("rsite","Ikeja")+"<button class=btn id=addRoom>Add room</button></div>";}
function draw(){var el=document.getElementById("app");
if(!user){if(pending){el.innerHTML="<div class=login><h1>Enter PIN</h1><p>"+pending.name+"</p><input id=pinbox type=password inputmode=numeric placeholder='PIN'><p><button class=btn id=pinok>Unlock</button> <button class='btn dark' id=pincancel>Back</button></p></div>";document.getElementById("pinok").onclick=function(){if(document.getElementById("pinbox").value.trim()===String(pending.pin)){user=pending;pending=null;tab=isKitchen()?"meals":(isLaundry()?"laundry":"rooms");roomId=null;draw();}};document.getElementById("pincancel").onclick=function(){pending=null;draw();};return;}
el.innerHTML="<div class=login><h1>Posh Certify</h1>"+db.users.map(function(u){return "<button class=acct data-id='"+u.id+"'><b>"+u.name+"</b><br>"+u.role+" · "+u.site+"</button>";}).join("")+"</div>";
el.querySelectorAll(".acct").forEach(function(b){b.onclick=function(){pending=db.users.filter(function(u){return u.id===b.getAttribute("data-id");})[0];draw();};});return;}
var inner=tab==="staff"?viewStaff():tab==="me"?viewMe():tab==="meals"?viewMeals():tab==="laundry"?viewSlips():roomId?viewRoom():viewBoard();
el.innerHTML="<div class=top><span>Certify NG</span><span>"+user.name.split(" ")[0]+"</span></div><div class=wrap>"+inner+"</div><div class=dock><button id=d1>Rooms</button><button id=d2>Laundry</button><button id=d5>Meals</button><button id=d3>Staff</button><button id=d4>Me</button></div>";
["rooms","laundry","staff","me","meals"].forEach(function(name,i){var ids=["d1","d2","d3","d4","d5"];document.getElementById(ids[i]).onclick=function(){tab=name;roomId=null;draw();};});
bind();}
function viewBoard(){if(isKitchen())return viewMeals();if(isLaundry())return viewSlips();if(isGM()){var tm=todayMeals(),sv=tm.filter(function(b){return b.status==="served";}).length;return "<div class=ok>GM report only.</div><h1>House report</h1><div class=card><h3>Breakfast today</h3><p><b>"+sv+"</b> served of <b>"+tm.length+"</b> issued</p></div>";}
var list=(mgr()||isMaint()||isFD())?db.rooms:db.rooms.filter(function(r){return r.hk===user.id&&r.status!=="ooo"&&r.job;});
var cards=list.map(function(r){return "<div class=room><b>"+r.number+"</b> "+r.type+"<br>"+r.site+" · "+r.status+" · "+jobLabel(r.job)+"<br>"+hkName(r.hk)+" <button class='btn open' data-id='"+r.id+"'>Open</button></div>";}).join("");
if(!list.length&&!(isFD()||mgr()))cards+="<div class=warn>No rooms allocated to you yet.</div>";
return (isFD()||mgr()?allocBox():"")+"<h1>Rooms</h1>"+cards;}
function viewMeals(){if(!db.menu.day||db.menu.day!==today())db.menu.day=today();
var choices=db.menu.choices||["Continental","Nigerian","Fruit platter","Tea and toast"];
var list=todayMeals();var served=list.filter(function(b){return b.status==="served";});
var head="<h1>Complimentary breakfast</h1><div class=ok>"+today()+" · issued "+list.length+" · served "+served.length+" · waiting "+(list.length-served.length)+"</div>";
var menu="<div class=card><h3>Today's meal choices</h3>"+choices.map(function(c){return "<p>"+c+"</p>";}).join("")+((mgr()||isKitchen())?"<textarea id=mchoices>"+choices.join("\n")+"</textarea><button class=btn id=saveMenu>Save today's menu</button>":"")+"</div>";
var issue="";if(isFD()||mgr())issue="<div class=card><h3>Issue breakfast</h3><input id=gname placeholder='Guest name'><select id=groom>"+db.rooms.map(function(r){return "<option>"+r.number+"</option>";}).join("")+"</select><select id=gmeal>"+choices.map(function(c){return "<option>"+c+"</option>";}).join("")+"</select><button class=btn id=issueBf>Issue code</button></div>";
var kit="";if(isKitchen()||mgr())kit="<div class=card><h3>Kitchen verify</h3><p>Ask the guest for name, room and code. Serve only if they match.</p><input id=gcode placeholder='Guest code' inputmode=numeric><button class=btn id=findBf>Look up code</button><div id=bfhit></div></div>";
var rows=list.slice().reverse().map(function(b){return "<div class=card><b><code>"+b.code+"</code></b> · "+b.guest+" · Rm "+b.room+"<br>"+b.meal+" · "+b.status.toUpperCase()+(b.servedBy?" · "+b.servedBy:"")+"</div>";}).join("");
return head+menu+issue+kit+"<button class=btn id=sendBfRep>Send today's report to duty manager and GM</button><h3>Today</h3>"+(rows||"<p>None issued yet.</p>");}
function viewSlips(){var open=db.slips.filter(function(s){return s.status==="sent";});return "<h1>Laundry</h1>"+open.map(function(s){return "<div class=card><b>Room "+s.room+"</b><p>"+s.summary+"</p>"+(isLaundry()?"<button class='btn recv' data-id='"+s.id+"'>Certify received</button>":"")+"</div>";}).join("")||"<div class=ok>No bags waiting.</div>";}
function laundryBox(r){var can=user&&user.role==="housekeeper"&&r.hk===user.id&&r.job;var rows=catalog().map(function(it){var n=Number((r.missing||{})[it.id]||0);return "<div class=row><span>"+it.name+"</span>"+(can?"<input class=q type=number min=0 data-item='"+it.id+"' value='"+(n||"")+"'>":"<span class=qty>"+n+"</span>")+"</div>";}).join("");return "<div class=card><h3>Missing items</h3>"+rows+(can?"<button class=btn id=lrep>Save count</button>":"")+"</div>";}
function sendBox(r){var can=user&&user.role==="housekeeper"&&r.hk===user.id;var rows=catalog().filter(function(it){return it.cat==="Towels"||it.cat==="Linen";}).map(function(it){return "<div class=row><span>"+it.name+"</span>"+(can?"<input class=sq type=number min=0 data-item='"+it.id+"' placeholder='0'>":"")+"</div>";}).join("");return "<div class=card><h3>Send to laundry</h3>"+rows+(can?"<button class=btn id=sendL>Send to laundry</button>":"")+"</div>";}
function viewRoom(){var r=db.rooms.filter(function(x){return x.id===roomId;})[0];var miss=missCount(r),shots=mediaCount(r);
var act=mgr()?(miss||shots<3?"<div class=warn>Cannot certify yet.</div><button class='btn bad' id=ooo>Set OUT OF ORDER</button> <button class=btn id=rel>Return to service</button>":"<button class=btn id=cert>Certify and notify front desk</button> <button class='btn bad' id=ooo>Set OUT OF ORDER</button> <button class=btn id=rel>Return to service</button>"):isMaint()?"<button class='btn bad' id=ooo>Set OUT OF ORDER</button> <button class=btn id=rel>Return to service</button>":isFD()?"<div class=ok>Allocate on Rooms. Issue breakfast on Meals.</div>":isGM()||isLaundry()||isKitchen()?"<div class=ok>View only.</div>":(!r.job||r.hk!==user.id?"<div class=warn>Not allocated to you.</div>":shots<3?"<div class=warn>Add photos and video first.</div>":r.laundryChecked?"<button class=btn id=send>Submit to duty manager</button>":"<div class=warn>Save laundry count first.</div>");
var cap=user&&user.role==="housekeeper"&&r.hk===user.id&&r.job;
var pts=POINTS.map(function(p){return "<div class=card><b>"+p+"</b>"+mediaBox((r.photos||{})[p])+(cap?"<label class=btn>Photo<input type=file accept='image/*' capture='environment' data-pt='"+p+"'></label> <label class=btn>Record video<input type=file accept='video/*' capture='environment' data-pt='"+p+"'></label>":"")+"</div>";}).join("");
return "<p id=back>&larr; Back</p><h1>Room "+r.number+"</h1><p>"+r.status+" · "+jobLabel(r.job)+" · "+hkName(r.hk)+"</p>"+(isFD()||mgr()?("<div class=card><h3>Re-allocate</h3>"+hkSel("rhk",r.hk)+jobSel("rjob",r.job||"checkout")+"<button class=btn id=reAlloc>Save allocation</button></div>"):"")+pts+laundryBox(r)+sendBox(r)+act;}
function viewStaff(){if(!mgr())return "<h1>Staff</h1><div class=warn>Duty manager only.</div>";var people=db.users.map(function(u){return "<div class=card><b>"+u.name+"</b> · "+u.role+"<input data-en='"+u.id+"' value='"+u.name+"'>"+roleSel("er-"+u.id,u.role)+locSel("es-"+u.id,u.site)+"<input data-pinfor='"+u.id+"' placeholder='PIN'><input data-ew='"+u.id+"' value='"+digits(u.whatsapp)+"' placeholder='WhatsApp'><button class='btn saveU' data-id='"+u.id+"'>Save</button> <button class='btn bad delU' data-id='"+u.id+"'>Remove</button></div>";}).join("");return "<h1>Staff</h1>"+people+"<div class=card><h3>Hotel WhatsApp</h3><input id=wa value='"+digits(db.whatsapp)+"' placeholder='Duty manager'><input id=fd value='"+digits(db.frontDesk)+"' placeholder='Front desk'><button class=btn id=saveWa>Save numbers</button></div><div class=card><h3>Add staff</h3><input id=sn placeholder='Name'>"+roleSel("sr","housekeeper")+locSel("ss","Ikeja")+"<input id=sp placeholder='PIN'><button class=btn id=addStaff>Save staff</button></div>";}
function viewMe(){return "<h1>"+user.name+"</h1><p>"+user.role+"</p><button class=btn id=out>Sign out</button>";}
function collectCounts(){var miss={};document.querySelectorAll(".q").forEach(function(inp){var n=parseInt(inp.value,10);if(n>0)miss[inp.getAttribute("data-item")]=n;});return miss;}
function bind(){
document.querySelectorAll(".open").forEach(function(b){b.onclick=function(){roomId=b.getAttribute("data-id");tab="rooms";draw();};});
var back=document.getElementById("back");if(back)back.onclick=function(){roomId=null;draw();};
var out=document.getElementById("out");if(out)out.onclick=function(){user=null;draw();};
document.querySelectorAll("input[type=file]").forEach(function(inp){inp.onchange=function(){var f=inp.files[0];if(!f)return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];if(!r.photos)r.photos={};var rd=new FileReader();rd.onload=function(){r.photos[inp.getAttribute("data-pt")]=rd.result;save();draw();};rd.readAsDataURL(f);};});
var saveMenu=document.getElementById("saveMenu");if(saveMenu)saveMenu.onclick=function(){if(!(mgr()||isKitchen()))return;var raw=(document.getElementById("mchoices").value||"").split("\n").map(function(s){return s.trim();}).filter(Boolean);if(!raw.length)return;db.menu={day:today(),choices:raw};save();draw();};
var issueBf=document.getElementById("issueBf");if(issueBf)issueBf.onclick=function(){if(!(isFD()||mgr()))return;var name=(document.getElementById("gname").value||"").trim();var room=document.getElementById("groom").value;var meal=document.getElementById("gmeal").value;if(!name||!room||!meal){alert("Guest name, room and meal required.");return;}var code=makeCode();db.breakfasts.push({id:"b"+Date.now(),code:code,guest:name,room:room,meal:meal,day:today(),status:"issued",issuedBy:user.name,issuedAt:new Date().toLocaleString()});save();alert("Give this code to the guest:\n\n"+code+"\n\n"+name+" · Room "+room+" · "+meal);draw();};
var findBf=document.getElementById("findBf");if(findBf)findBf.onclick=function(){if(!(isKitchen()||mgr()))return;var code=String((document.getElementById("gcode").value||"").trim());var hit=todayMeals().filter(function(b){return b.code===code;})[0];var box=document.getElementById("bfhit");if(!hit){box.innerHTML="<div class=warn>No breakfast for that code today.</div>";return;}if(hit.status==="served"){box.innerHTML="<div class=warn>Already served to "+hit.guest+" Room "+hit.room+".</div>";return;}box.innerHTML="<div class=ok><b>"+hit.guest+"</b><br>Room "+hit.room+" · "+hit.meal+" · code "+hit.code+"</div><button class=btn id=serveBf>Confirm and serve</button>";document.getElementById("serveBf").onclick=function(){hit.status="served";hit.servedBy=user.name;hit.servedAt=new Date().toLocaleString();save();pingMgrGm(mealReportText());alert("Served. Daily count sent to duty manager and GM.");draw();};};
var sendBfRep=document.getElementById("sendBfRep");if(sendBfRep)sendBfRep.onclick=function(){pingMgrGm(mealReportText());};
var doAlloc=document.getElementById("doAlloc");if(doAlloc)doAlloc.onclick=function(){if(!(isFD()||mgr()))return;var r=db.rooms.filter(function(x){return x.id===document.getElementById("aroom").value;})[0];if(!r)return;r.hk=document.getElementById("ahk").value;r.job=document.getElementById("ajob").value;r.assignedBy=user.name;if(r.status==="certified")r.status="pending";r.laundryChecked=false;save();draw();};
var reAlloc=document.getElementById("reAlloc");if(reAlloc)reAlloc.onclick=function(){if(!(isFD()||mgr()))return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];r.hk=document.getElementById("rhk").value;r.job=document.getElementById("rjob").value;if(r.status==="certified")r.status="pending";save();draw();};
var addRoom=document.getElementById("addRoom");if(addRoom)addRoom.onclick=function(){if(!(isFD()||mgr()))return;var n=(document.getElementById("rnum").value||"").trim();if(!n)return;db.rooms.push({id:"r"+Date.now(),number:n,site:document.getElementById("rsite").value,type:(document.getElementById("rtype").value||"Standard").trim(),hk:"",job:"",status:"pending",photos:{},missing:{}});save();draw();};
var sendL=document.getElementById("sendL");if(sendL)sendL.onclick=function(){if(user.role!=="housekeeper")return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];var items={};document.querySelectorAll(".sq").forEach(function(inp){var n=parseInt(inp.value,10);if(n>0)items[inp.getAttribute("data-item")]=n;});if(!Object.keys(items).length)return;db.slips.push({id:"s"+Date.now(),room:r.number,site:r.site,by:user.name,at:new Date().toLocaleString(),items:items,received:{},status:"sent",summary:Object.keys(items).map(function(k){return items[k]+" x "+itemName(k);}).join(", ")});save();draw();};
document.querySelectorAll(".recv").forEach(function(b){b.onclick=function(){if(!isLaundry())return;var s=db.slips.filter(function(x){return x.id===b.getAttribute("data-id");})[0];s.status="received";s.receivedBy=user.name;save();draw();};});
var lrep=document.getElementById("lrep");if(lrep)lrep.onclick=function(){if(user.role!=="housekeeper")return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];r.missing=collectCounts();r.laundryChecked=true;save();draw();};
var send=document.getElementById("send");if(send)send.onclick=function(){if(user.role!=="housekeeper")return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];if(!r.job||r.hk!==user.id)return;if(mediaCount(r)<3||!r.laundryChecked){alert("Photos and laundry count required.");return;}r.status="submitted";save();roomId=null;draw();};
var cert=document.getElementById("cert");if(cert)cert.onclick=function(){if(!mgr())return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];if(r.status==="ooo"||missCount(r)>0||mediaCount(r)<3||!r.laundryChecked){alert("Not ready.");return;}r.status="certified";save();var fd=fdDigits();if(fd.length>=11)window.open("https://wa.me/"+fd+"?text="+encodeURIComponent("POSH CERTIFY Room "+r.number+" CERTIFIED. Ready to sell."),"_blank");roomId=null;draw();};
var ooo=document.getElementById("ooo");if(ooo)ooo.onclick=function(){if(!(isMaint()||mgr()))return;db.rooms.filter(function(x){return x.id===roomId;})[0].status="ooo";save();roomId=null;draw();};
var rel=document.getElementById("rel");if(rel)rel.onclick=function(){if(!(isMaint()||mgr()))return;db.rooms.filter(function(x){return x.id===roomId;})[0].status="pending";save();roomId=null;draw();};
var saveWa=document.getElementById("saveWa");if(saveWa)saveWa.onclick=function(){if(!mgr())return;db.whatsapp=digits(document.getElementById("wa").value);db.frontDesk=digits(document.getElementById("fd").value);save();draw();};
document.querySelectorAll(".delU").forEach(function(b){b.onclick=function(){if(!mgr())return;var id=b.getAttribute("data-id");if(user&&id===user.id)return;db.users=db.users.filter(function(u){return u.id!==id;});save();draw();};});
document.querySelectorAll(".saveU").forEach(function(b){b.onclick=function(){if(!mgr())return;var id=b.getAttribute("data-id");var n=(document.querySelector("[data-en='"+id+"']")||{}).value;var roleEl=document.getElementById("er-"+id);var siteEl=document.getElementById("es-"+id);var pinEl=document.querySelector("[data-pinfor='"+id+"']");var waEl=document.querySelector("[data-ew='"+id+"']");db.users.forEach(function(u){if(u.id!==id)return;if(n&&String(n).trim())u.name=String(n).trim();if(roleEl)u.role=roleEl.value;if(siteEl)u.site=siteEl.value;if(pinEl&&pinEl.value.trim().length>=4)u.pin=pinEl.value.trim();if(waEl)u.whatsapp=digits(waEl.value);});save();draw();};});
var addStaff=document.getElementById("addStaff");if(addStaff)addStaff.onclick=function(){if(!mgr())return;var n=document.getElementById("sn").value.trim();if(!n)return;var pin=document.getElementById("sp").value.trim();if(pin.length<4)return;db.users.push({id:"u"+Date.now(),name:n,role:document.getElementById("sr").value,site:document.getElementById("ss").value,pin:pin,whatsapp:"",demo:false});save();draw();};
}
draw();
</script></body></html>
