<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c332c">
<title>Posh Certify</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#101512;--paper:#f4efe6;--gold:#c4a574;--green:#1c332c;--soft:#5a635e}
*{box-sizing:border-box}
html,body{margin:0;background:#0d1613;font-family:Outfit,system-ui,sans-serif;color:var(--ink)}
body{max-width:480px;margin:0 auto}
h1,h3{font-family:"Cormorant Garamond",Georgia,serif;margin:0}
button{font:inherit;cursor:pointer}
.login{min-height:100vh;color:#f4efe6;padding:32px 20px;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(16,21,18,.4),#1c332c),url(https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=900&q=70) center/cover}
.brand{letter-spacing:.2em;text-transform:uppercase;font-size:10px;color:#e8d7b3}
.login h1{font-size:38px;line-height:.95;margin:22px 0 10px}
.sheet{margin-top:auto;background:var(--paper);color:var(--ink);border-radius:22px 22px 0 0;padding:16px;margin-left:-20px;margin-right:-20px}
.acct{width:100%;text-align:left;border:0;background:#fff;border-radius:14px;padding:12px;margin:8px 0}
.top{background:var(--green);color:#f4efe6;padding:14px 16px;display:flex;justify-content:space-between}
.wrap{background:var(--paper);min-height:calc(100vh - 52px);padding:16px 16px 90px}
.room{background:#fff;border-radius:14px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.btn{border:0;border-radius:999px;padding:10px 14px;background:#c4a574;color:#101512}
.ok{background:#dcebe3;color:#215c3a;padding:10px;border-radius:12px;margin:8px 0}
.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;padding:10px;font-size:12px}
.dock b{display:block;text-align:center}
</style>
</head>
<body>
<div id="app">Loading Posh Certify…</div>
<script>
const USERS=[
 {id:"sophia",name:"Sophia Adeyemi",role:"manager",title:"Duty Manager",site:"Ikeja & VI"},
 {id:"blessing",name:"Blessing Okoro",role:"housekeeper",title:"Senior Housekeeper",site:"Ikeja"},
 {id:"tunde",name:"Tunde Balogun",role:"housekeeper",title:"Victoria Island",site:"Victoria Island"}
];
let rooms=JSON.parse(localStorage.getItem("posh-hosted")||"null")||[
 {n:"201",s:"Ikeja",t:"Deluxe King",hk:"blessing",st:"pending"},
 {n:"204",s:"Ikeja",t:"Deluxe Twin",hk:"blessing",st:"pending"},
 {n:"208",s:"Ikeja",t:"Junior Suite",hk:"blessing",st:"pending"},
 {n:"501",s:"Victoria Island",t:"Executive King",hk:"tunde",st:"pending"},
 {n:"510",s:"Victoria Island",t:"Junior Suite",hk:"tunde",st:"submitted"},
 {n:"518",s:"Victoria Island",t:"Posh Suite",hk:"tunde",st:"pending"}
];
let user=null;
function save(){localStorage.setItem("posh-hosted",JSON.stringify(rooms));}
function go(u){user=u;draw();}
function setSt(i,st){rooms[i].st=st;save();draw();}
function draw(){
 const el=document.getElementById("app");
 if(!user){
  el.innerHTML='<section class="login"><div class="brand">P · Posh Hotels & Suites · NG</div><h1>Every room certified before the guest arrives.</h1><p>Housekeepers send the room. Duty manager certifies against the Posh Nigeria standard.</p><div class="sheet"><p>Staff login · tap your name</p>'+USERS.map(function(u){return '<button class="acct" onclick=\'go('+JSON.stringify(u)+')\'><b>'+u.name+'</b><br>'+u.title+' · '+u.site+'</button>';}).join("")+'</div></section>';
  return;
 }
 const list=user.role==="manager"?rooms:rooms.filter(function(r){return r.hk===user.id;});
 el.innerHTML='<div class="top"><span>Certify NG</span><span>'+user.name.split(" ")[0]+'</span></div><div class="wrap"><div class="ok">Hosted Posh Certify · work saves on this phone</div><h1>Rooms</h1>'+list.map(function(r,i){var ix=rooms.indexOf(r);return '<div class="room"><div><b>'+r.n+'</b> '+r.t+'<br>'+r.s+' · '+r.st+'</div><div>'+(user.role==="housekeeper"?'<button class="btn" onclick="setSt('+ix+',\'submitted\')">Send</button>':'<button class="btn" onclick="setSt('+ix+',\'certified\')">Certify</button>')+'</div></div>';}).join("")+'<p><button class="btn" onclick="user=null;draw()">Sign out</button></p></div>';
}
draw();
</script>
</body>
</html>
