<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c332c">
<title>Posh Certify</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0d1613;color:#101512;max-width:480px;margin:0 auto}
h1{font-family:Georgia,serif}.wrap{background:#f4efe6;min-height:100vh;padding:16px 16px 90px}
.top{background:#1c332c;color:#f4efe6;padding:14px 16px;display:flex;justify-content:space-between}
.btn{border:0;border-radius:999px;padding:10px 14px;background:#c4a574}
.btn.bad{background:#8c3a32;color:#fff}.btn.dark{background:#101512;color:#fff}
.card,.room,.acct{background:#fff;border-radius:14px;padding:12px;margin:8px 0;border:0;width:100%;text-align:left}
.ok{background:#dcebe3;padding:10px;border-radius:12px}.warn{background:#f3e6c8;padding:10px;border-radius:12px}.err{background:#f3d8d5;padding:10px;border-radius:12px;color:#8c3a32}
input,select,textarea{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}
.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;padding:10px}
.login{min-height:100vh;color:#fff;padding:28px 18px;background:#1c332c}
</style></head><body><div id="app"></div>
<script>
const KEY="posh-full-v5";
const POINTS=["Doorway","Bed","Vanity","Shower","Towels","Wardrobe","Desk","Minibar","High-touch","Floor","Curtains","Walkthrough"];
function seed(){return{locations:["Ikeja","Victoria Island"],users:[{id:"sophia",name:"Sophia Adeyemi",role:"manager",title:"Duty Manager",site:"Ikeja",pin:"2401",demo:true},{id:"blessing",name:"Blessing Okoro",role:"housekeeper",title:"Housekeeper",site:"Ikeja",pin:"4412",demo:true},{id:"tunde",name:"Tunde Balogun",role:"housekeeper",title:"Housekeeper",site:"Victoria Island",pin:"5508",demo:true}],rooms:[{id:"r201",number:"201",site:"Ikeja",type:"Deluxe King",hk:"blessing",status:"pending",photos:{},notes:"",demo:true},{id:"r501",number:"501",site:"Victoria Island",type:"Executive King",hk:"tunde",status:"pending",photos:{},notes:"",demo:true}]};}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||"");if(x&&x.users)return x;}catch(e){}return seed();}
var db=load();if(!db.locations)db.locations=["Ikeja","Victoria Island"];
db.users.forEach(function(u){if(!u.pin)u.pin="0000";});
var user=null,tab="rooms",roomId=null,pending=null,loginErr="";
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function mgr(){return user&&user.role==="manager";}
function locSel(id,v){return "<select id=\""+id+"\">"+db.locations.map(function(l){return "<option"+(l===v?" selected":"")+">"+l+"</option>";}).join("")+"</select>";}
function draw(){var el=document.getElementById("app");
if(!user){
if(pending){el.innerHTML="<div class=login><h1>Enter PIN</h1><p>"+pending.name+"</p>"+(loginErr?"<div class=err>"+loginErr+"</div>":"")+"<input id=pinbox type=password inputmode=numeric maxlength=8 placeholder='4-digit PIN'><p><button class=btn id=pinok>Unlock</button> <button class=btn dark id=pincancel>Back</button></p><p style='opacity:.7'>Ask the duty manager for your PIN. Do not share it.</p></div>";
document.getElementById("pinok").onclick=function(){var p=document.getElementById("pinbox").value.trim();if(p===String(pending.pin)){user=pending;pending=null;loginErr="";tab="rooms";roomId=null;draw();}else{loginErr="Wrong PIN";draw();}};
document.getElementById("pincancel").onclick=function(){pending=null;loginErr="";draw();};
return;}
el.innerHTML="<div class=login><h1>Posh Certify</h1><p>Tap your name, then enter your PIN.</p>"+db.users.map(function(u){return "<button class=acct data-id=\""+u.id+"\"><b>"+u.name+"</b><br>"+u.role+" · "+u.site+(u.demo?" · demo":"")+"</button>";}).join("")+"</div>";
el.querySelectorAll(".acct").forEach(function(b){b.onclick=function(){pending=db.users.filter(function(u){return u.id===b.getAttribute("data-id");})[0];loginErr="";draw();};});
return;}
var inner=tab==="staff"?viewStaff():(tab==="me"?viewMe():(roomId?viewRoom():viewBoard()));
el.innerHTML="<div class=top><span>Certify NG</span><span>"+user.name.split(" ")[0]+"</span></div><div class=wrap>"+inner+"</div><div class=dock><button id=d1>Rooms</button><button id=d3>Staff</button><button id=d4>Me</button></div>";
document.getElementById("d1").onclick=function(){tab="rooms";roomId=null;draw();};
document.getElementById("d3").onclick=function(){tab="staff";roomId=null;draw();};
document.getElementById("d4").onclick=function(){tab="me";roomId=null;draw();};
bind();}
function viewBoard(){var list=mgr()?db.rooms:db.rooms.filter(function(r){return r.hk===user.id;});
return "<div class=ok>Unlock with your PIN. Only the duty manager can add staff.</div><h1>Rooms</h1>"+list.map(function(r){return "<div class=room><b>"+r.number+"</b> "+r.type+"<br>"+r.site+" · "+r.status+" <button class='btn open' data-id=\""+r.id+"\">Open</button></div>";}).join("");}
function viewRoom(){var r=db.rooms.filter(function(x){return x.id===roomId;})[0];
var pts=POINTS.map(function(p){var src=r.photos[p];return "<div class=card><b>"+p+"</b><br>"+(src?"photo on file":"no photo")+"<br><label>Photo<input type=file accept=image/* data-pt=\""+p+"\"></label></div>";}).join("");
return "<p id=back>&larr; Back</p><h1>Room "+r.number+"</h1>"+pts+(mgr()?"<button class=btn id=cert>Certify</button>":"<button class=btn id=send>Send</button>");}
function viewStaff(){if(!mgr())return "<h1>Staff</h1><div class=warn>Only a duty manager can add staff or set PINs.</div>";
var people=db.users.map(function(u){return "<div class=card><b>"+u.name+"</b><br>"+u.role+" · "+u.site+(u.demo?" · demo":"")+"<br>PIN set: "+(u.pin?"yes":"no")+"<br><input data-pinfor=\""+u.id+"\" placeholder='New PIN' inputmode=numeric><button class='btn setPin' data-id=\""+u.id+"\">Set PIN</button> <button class='btn bad delU' data-id=\""+u.id+"\">Remove</button></div>";}).join("");
var hks=db.users.filter(function(u){return u.role==="housekeeper";});
var opts=hks.map(function(u){return "<option value=\""+u.id+"\">"+u.name+"</option>";}).join("");
return "<h1>Staff</h1>"+people+"<p><button class='btn dark' id=clearDemo>Remove demo staff and rooms</button> <button class='btn bad' id=clearStaff>Clear all staff except me</button></p><div class=card><h3>Add staff</h3><input id=sn placeholder='Full name'><input id=st placeholder=Title><select id=sr><option value=housekeeper>Housekeeper</option><option value=manager>Duty manager</option></select>"+locSel("ss","Ikeja")+"<input id=sp placeholder='4-digit PIN' inputmode=numeric><button class=btn id=addStaff>Save staff</button></div><div class=card><h3>Add room</h3><input id=rn placeholder='Room number'><input id=rt placeholder='Deluxe King'>"+locSel("rs","Ikeja")+"<select id=rh>"+opts+"</select><button class=btn id=addRoom>Save room</button></div><div class=card><h3>Add location</h3><p>"+db.locations.join(", ")+"</p><input id=ln placeholder='Lekki or Abeokuta'><button class=btn id=addLoc>Save location</button></div>";}
function viewMe(){return "<h1>"+user.name+"</h1><p>"+user.role+" · "+user.site+"</p><div class=card><h3>Change my PIN</h3><input id=np type=password inputmode=numeric placeholder='New PIN'><button class=btn id=chpin>Save PIN</button></div><button class=btn id=out>Sign out</button>";}
function bind(){
document.querySelectorAll(".open").forEach(function(b){b.onclick=function(){roomId=b.getAttribute("data-id");draw();};});
var back=document.getElementById("back");if(back)back.onclick=function(){roomId=null;draw();};
var out=document.getElementById("out");if(out)out.onclick=function(){user=null;draw();};
var chpin=document.getElementById("chpin");if(chpin)chpin.onclick=function(){var p=document.getElementById("np").value.trim();if(p.length<4){alert("Use at least 4 digits");return;}user.pin=p;save();alert("PIN saved. Tell nobody.");};
document.querySelectorAll("input[type=file]").forEach(function(inp){inp.onchange=function(){var f=inp.files[0];if(!f)return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];var rd=new FileReader();rd.onload=function(){r.photos[inp.getAttribute("data-pt")]=rd.result;save();draw();};rd.readAsDataURL(f);};});
var send=document.getElementById("send");if(send)send.onclick=function(){var r=db.rooms.filter(function(x){return x.id===roomId;})[0];r.status="submitted";save();roomId=null;draw();};
var cert=document.getElementById("cert");if(cert)cert.onclick=function(){var r=db.rooms.filter(function(x){return x.id===roomId;})[0];r.status="certified";save();roomId=null;draw();};
var addStaff=document.getElementById("addStaff");if(addStaff)addStaff.onclick=function(){if(!mgr())return;var n=document.getElementById("sn").value.trim();if(!n)return;var pin=document.getElementById("sp").value.trim();if(pin.length<4){alert("Give this person a 4-digit PIN");return;}db.users.push({id:"u"+Date.now(),name:n,role:document.getElementById("sr").value,title:document.getElementById("st").value||"Staff",site:document.getElementById("ss").value,pin:pin,demo:false});save();draw();};
var addRoom=document.getElementById("addRoom");if(addRoom)addRoom.onclick=function(){if(!mgr())return;var n=document.getElementById("rn").value.trim();if(!n)return;db.rooms.push({id:"r"+Date.now(),number:n,type:document.getElementById("rt").value||"Deluxe",site:document.getElementById("rs").value,hk:document.getElementById("rh").value,status:"pending",photos:{},notes:"",demo:false});save();tab="rooms";roomId=null;draw();};
var addLoc=document.getElementById("addLoc");if(addLoc)addLoc.onclick=function(){if(!mgr())return;var n=document.getElementById("ln").value.trim();if(!n)return;if(db.locations.indexOf(n)<0)db.locations.push(n);save();draw();};
document.querySelectorAll(".delU").forEach(function(b){b.onclick=function(){if(!mgr())return;var id=b.getAttribute("data-id");if(id===user.id){alert("You cannot remove the account you are using.");return;}db.users=db.users.filter(function(u){return u.id!==id;});save();draw();};});
document.querySelectorAll(".setPin").forEach(function(b){b.onclick=function(){if(!mgr())return;var id=b.getAttribute("data-id");var box=document.querySelector('[data-pinfor=\"'+id+'\"]');var p=(box&&box.value||"").trim();if(p.length<4){alert("PIN must be at least 4 digits");return;}db.users.forEach(function(u){if(u.id===id)u.pin=p;});save();alert("PIN updated. Tell that staff in person, not on WhatsApp group.");draw();};});
var clearDemo=document.getElementById("clearDemo");if(clearDemo)clearDemo.onclick=function(){if(!mgr())return;db.users=db.users.filter(function(u){return !u.demo||u.id===user.id;});db.rooms=db.rooms.filter(function(r){return !r.demo;});save();draw();};
var clearStaff=document.getElementById("clearStaff");if(clearStaff)clearStaff.onclick=function(){if(!mgr())return;if(!confirm("Remove every staff account except yours?"))return;db.users=db.users.filter(function(u){return u.id===user.id;});save();draw();};
}
draw();
</script></body></html>
