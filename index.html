<!DOCTYPE html>
<html lang="en-NG"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Posh Certify</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#0d1613;max-width:480px;margin:0 auto}h1{font-family:Georgia,serif}.wrap{background:#f4efe6;min-height:100vh;padding:16px 16px 90px}.top{background:#1c332c;color:#f4efe6;padding:14px 16px;display:flex;justify-content:space-between}.btn{border:0;border-radius:999px;padding:10px 14px;background:#c4a574;margin:4px 4px 0 0}.btn.bad{background:#8c3a32;color:#fff}.btn.dark{background:#101512;color:#fff}.card,.room,.acct{background:#fff;border-radius:14px;padding:12px;margin:8px 0;border:0;width:100%;text-align:left}.ok{background:#dcebe3;padding:10px;border-radius:12px}.warn{background:#f3e6c8;padding:10px;border-radius:12px}.err{background:#f3d8d5;padding:10px;border-radius:12px}input,select{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}video,img.media{width:100%;max-height:220px;border-radius:10px;background:#000;object-fit:cover}.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;padding:10px}.login{min-height:100vh;color:#fff;padding:28px 18px;background:#1c332c}.code{font-size:13px;word-break:break-all;background:#eee;padding:8px;border-radius:8px}</style></head><body><div id="app">Opening…</div>
<script>
const KEY="posh-full-v6";
const API="https://jsonblob.com/api/jsonBlob";
const POINTS=["Doorway","Bed","Vanity","Shower","Towels","Wardrobe","Desk","Minibar","High-touch","Floor","Curtains","Walkthrough"];
function seed(){return{hotelCode:"",whatsapp:"2348012345678",locations:["Ikeja","Victoria Island"],users:[{id:"sophia",name:"Sophia Adeyemi",role:"manager",title:"Duty Manager",site:"Ikeja",pin:"2401",demo:true},{id:"blessing",name:"Blessing Okoro",role:"housekeeper",title:"Housekeeper",site:"Ikeja",pin:"4412",demo:true},{id:"tunde",name:"Tunde Balogun",role:"housekeeper",title:"Housekeeper",site:"Victoria Island",pin:"5508",demo:true}],rooms:[{id:"r201",number:"201",site:"Ikeja",type:"Deluxe King",hk:"blessing",status:"pending",photos:{},notes:"",demo:true},{id:"r501",number:"501",site:"Victoria Island",type:"Executive King",hk:"tunde",status:"pending",photos:{},notes:"",demo:true}]};}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||"");if(x&&x.users)return x;}catch(e){}return seed();}
var db=load();if(!db.locations)db.locations=["Ikeja","Victoria Island"];if(!db.whatsapp)db.whatsapp="2348012345678";if(!db.hotelCode)db.hotelCode="";
db.users.forEach(function(u){if(!u.pin)u.pin="0000";});
var user=null,tab="rooms",roomId=null,pending=null,loginErr="",syncMsg="";
function slim(){return{whatsapp:db.whatsapp,locations:db.locations,users:db.users,rooms:db.rooms.map(function(r){var flags={};Object.keys(r.photos||{}).forEach(function(k){flags[k]=!!r.photos[k];});return{id:r.id,number:r.number,site:r.site,type:r.type,hk:r.hk,status:r.status,notes:r.notes||"",demo:!!r.demo,photos:flags};})};}
function mergeRemote(remote){if(!remote||!remote.users)return;var localPhotos={};db.rooms.forEach(function(r){localPhotos[r.id]=r.photos||{};});db.whatsapp=remote.whatsapp||db.whatsapp;db.locations=remote.locations||db.locations;db.users=remote.users;db.rooms=(remote.rooms||[]).map(function(r){r.photos=r.photos||{};var keep=localPhotos[r.id]||{};Object.keys(keep).forEach(function(k){if(typeof keep[k]==="string")r.photos[k]=keep[k];});return r;});}
function save(){localStorage.setItem(KEY,JSON.stringify(db));pushQueue();}
function mgr(){return user&&user.role==="manager";}
function locSel(id,v){return "<select id='"+id+"'>"+db.locations.map(function(l){return "<option"+(l===v?" selected":"")+">"+l+"</option>";}).join("")+"</select>";}
function waDigits(){return String(db.whatsapp||"").replace(/[^0-9]/g,"");}
function mediaBox(src){if(!src||src===true)return src?"<p>On file</p>":"<p>No media yet</p>";var s=String(src);if(s.indexOf("data:video")===0)return "<video class=media controls playsinline src='"+s+"'></video>";if(s.indexOf("data:image")===0)return "<img class=media src='"+s+"'>";return "<p>On file</p>";}
function pushQueue(){if(!db.hotelCode)return;fetch(API+"/"+db.hotelCode,{method:"PUT",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(slim())}).then(function(r){syncMsg=r.ok?"Queue shared":"Share failed "+r.status;}).catch(function(){syncMsg="Share failed";});}
function pullQueue(cb){if(!db.hotelCode){if(cb)cb(false);return;}fetch(API+"/"+db.hotelCode,{headers:{Accept:"application/json"}}).then(function(r){if(!r.ok)throw new Error("bad");return r.json();}).then(function(j){mergeRemote(j);localStorage.setItem(KEY,JSON.stringify(db));syncMsg="Queue updated";if(cb)cb(true);draw();}).catch(function(){syncMsg="Could not load hotel code";if(cb)cb(false);draw();});}
function startQueue(){fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(slim())}).then(function(r){var id=r.headers.get("X-jsonblob")||(r.headers.get("Location")||"").split("/").pop();if(!id)throw new Error("no id");db.hotelCode=id;localStorage.setItem(KEY,JSON.stringify(db));syncMsg="Hotel code ready";draw();}).catch(function(){syncMsg="Could not start shared queue";draw();});}
function draw(){var el=document.getElementById("app");
if(!user){if(pending){el.innerHTML="<div class=login><h1>Enter PIN</h1><p>"+pending.name+"</p>"+(loginErr?"<div class=err>"+loginErr+"</div>":"")+"<input id=pinbox type=password inputmode=numeric placeholder='PIN'><p><button class=btn id=pinok>Unlock</button> <button class='btn dark' id=pincancel>Back</button></p></div>";document.getElementById("pinok").onclick=function(){if(document.getElementById("pinbox").value.trim()===String(pending.pin)){user=pending;pending=null;loginErr="";tab="rooms";roomId=null;if(db.hotelCode)pullQueue();draw();}else{loginErr="Wrong PIN";draw();}};document.getElementById("pincancel").onclick=function(){pending=null;loginErr="";draw();};return;}
el.innerHTML="<div class=login><h1>Posh Certify</h1><p>Tap your name, then PIN.</p>"+db.users.map(function(u){return "<button class=acct data-id='"+u.id+"'><b>"+u.name+"</b><br>"+u.role+" · "+u.site+"</button>";}).join("")+"<div class=card style='color:#111'><b>Join shared queue</b><input id=joinCode placeholder='Hotel code'><button class=btn id=joinBtn>Join</button></div></div>";
el.querySelectorAll(".acct").forEach(function(b){b.onclick=function(){pending=db.users.filter(function(u){return u.id===b.getAttribute("data-id");})[0];loginErr="";draw();};});
var jb=document.getElementById("joinBtn");if(jb)jb.onclick=function(){var c=document.getElementById("joinCode").value.trim();if(!c)return;db.hotelCode=c;localStorage.setItem(KEY,JSON.stringify(db));pullQueue();};
return;}
var inner=tab==="staff"?viewStaff():(tab==="me"?viewMe():(roomId?viewRoom():viewBoard()));
el.innerHTML="<div class=top><span>Certify NG</span><span>"+user.name.split(" ")[0]+"</span></div><div class=wrap>"+inner+"</div><div class=dock><button id=d1>Rooms</button><button id=d3>Staff</button><button id=d4>Me</button></div>";
document.getElementById("d1").onclick=function(){tab="rooms";roomId=null;draw();};
document.getElementById("d3").onclick=function(){tab="staff";roomId=null;draw();};
document.getElementById("d4").onclick=function(){tab="me";roomId=null;draw();};
bind();}
function viewBoard(){var list=mgr()?db.rooms:db.rooms.filter(function(r){return r.hk===user.id;});return "<div class=ok>"+(db.hotelCode?"Shared queue on":"This phone only")+"</div><h1>Rooms</h1>"+list.map(function(r){return "<div class=room><b>"+r.number+"</b> "+r.type+"<br>"+r.site+" · "+r.status+" <button class='btn open' data-id='"+r.id+"'>Open</button></div>";}).join("");}
function viewRoom(){var r=db.rooms.filter(function(x){return x.id===roomId;})[0];var pts=POINTS.map(function(p){return "<div class=card><b>"+p+"</b>"+mediaBox(r.photos[p])+"<label class=btn>Photo<input type=file accept='image/*' capture='environment' data-pt='"+p+"'></label> <label class=btn>Record video<input type=file accept='video/*' capture='environment' data-pt='"+p+"'></label></div>";}).join("");return "<p id=back>&larr; Back</p><h1>Room "+r.number+"</h1><p>Photo or a short video. Walkthrough should be a clip.</p>"+pts+(mgr()?"<button class=btn id=cert>Certify</button>":"<button class=btn id=send>Send + WhatsApp</button>");}
function viewStaff(){if(!mgr())return "<h1>Staff</h1><div class=warn>Duty manager only.</div>";
var people=db.users.map(function(u){return "<div class=card><b>"+u.name+"</b><br>"+u.role+" · "+u.site+"<br><input data-pinfor='"+u.id+"' placeholder='New PIN'><button class='btn setPin' data-id='"+u.id+"'>Set PIN</button> <button class='btn bad delU' data-id='"+u.id+"'>Remove</button></div>";}).join("");
var opts=db.users.filter(function(u){return u.role==="housekeeper";}).map(function(u){return "<option value='"+u.id+"'>"+u.name+"</option>";}).join("");
return "<h1>Staff</h1><div class=card><h3>Shared queue</h3><div class=code>"+(db.hotelCode||"No code yet")+"</div><button class=btn id=startQ>Start shared queue</button> <button class='btn dark' id=pullQ>Refresh</button></div>"+people+"<p><button class='btn dark' id=clearDemo>Remove demo</button> <button class='btn bad' id=clearStaff>Clear staff except me</button></p><div class=card><h3>WhatsApp</h3><input id=wa value='"+waDigits()+"'><button class=btn id=saveWa>Save</button></div><div class=card><h3>Add staff</h3><input id=sn placeholder='Full name'><select id=sr><option value=housekeeper>Housekeeper</option><option value=manager>Duty manager</option></select>"+locSel("ss","Ikeja")+"<input id=sp placeholder='PIN'><button class=btn id=addStaff>Save staff</button></div><div class=card><h3>Add room</h3><input id=rn placeholder='Number'><input id=rt placeholder='Deluxe King'>"+locSel("rs","Ikeja")+"<select id=rh>"+opts+"</select><button class=btn id=addRoom>Save room</button></div><div class=card><h3>Location</h3><input id=ln placeholder='Lekki'><button class=btn id=addLoc>Save location</button></div>";}
function viewMe(){return "<h1>"+user.name+"</h1><p>"+user.role+" · "+user.site+"</p><div class=card><b>Hotel code</b><div class=code>"+(db.hotelCode||"not joined")+"</div><input id=joinCode3 placeholder='Paste code'><button class=btn id=joinBtn3>Join</button></div><button class=btn id=out>Sign out</button>";}
function bind(){
document.querySelectorAll(".open").forEach(function(b){b.onclick=function(){roomId=b.getAttribute("data-id");draw();};});
var back=document.getElementById("back");if(back)back.onclick=function(){roomId=null;draw();};
var out=document.getElementById("out");if(out)out.onclick=function(){user=null;draw();};
var jb3=document.getElementById("joinBtn3");if(jb3)jb3.onclick=function(){var c=document.getElementById("joinCode3").value.trim();if(!c)return;db.hotelCode=c;localStorage.setItem(KEY,JSON.stringify(db));pullQueue();};
var startQ=document.getElementById("startQ");if(startQ)startQ.onclick=function(){if(mgr())startQueue();};
var pullQ=document.getElementById("pullQ");if(pullQ)pullQ.onclick=function(){pullQueue();};
document.querySelectorAll("input[type=file]").forEach(function(inp){inp.onchange=function(){var f=inp.files[0];if(!f)return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];var rd=new FileReader();rd.onload=function(){r.photos[inp.getAttribute("data-pt")]=rd.result;save();draw();};rd.readAsDataURL(f);};});
var send=document.getElementById("send");if(send)send.onclick=function(){var r=db.rooms.filter(function(x){return x.id===roomId;})[0];r.status="submitted";save();var n=waDigits();if(n.length>=11)window.open("https://wa.me/"+n+"?text="+encodeURIComponent("POSH CERTIFY Room "+r.number+" by "+user.name),"_blank");roomId=null;draw();};
var cert=document.getElementById("cert");if(cert)cert.onclick=function(){var r=db.rooms.filter(function(x){return x.id===roomId;})[0];r.status="certified";save();roomId=null;draw();};
var saveWa=document.getElementById("saveWa");if(saveWa)saveWa.onclick=function(){if(!mgr())return;db.whatsapp=document.getElementById("wa").value.replace(/[^0-9]/g,"");save();draw();};
var addStaff=document.getElementById("addStaff");if(addStaff)addStaff.onclick=function(){if(!mgr())return;var n=document.getElementById("sn").value.trim();if(!n)return;var pin=document.getElementById("sp").value.trim();if(pin.length<4){alert("Need PIN");return;}db.users.push({id:"u"+Date.now(),name:n,role:document.getElementById("sr").value,title:"Staff",site:document.getElementById("ss").value,pin:pin,demo:false});save();draw();};
var addRoom=document.getElementById("addRoom");if(addRoom)addRoom.onclick=function(){if(!mgr())return;var n=document.getElementById("rn").value.trim();if(!n)return;db.rooms.push({id:"r"+Date.now(),number:n,type:document.getElementById("rt").value||"Deluxe",site:document.getElementById("rs").value,hk:document.getElementById("rh").value,status:"pending",photos:{},notes:"",demo:false});save();tab="rooms";roomId=null;draw();};
var addLoc=document.getElementById("addLoc");if(addLoc)addLoc.onclick=function(){if(!mgr())return;var n=document.getElementById("ln").value.trim();if(!n)return;if(db.locations.indexOf(n)<0)db.locations.push(n);save();draw();};
document.querySelectorAll(".delU").forEach(function(b){b.onclick=function(){if(!mgr())return;var id=b.getAttribute("data-id");if(id===user.id)return;db.users=db.users.filter(function(u){return u.id!==id;});save();draw();};});
document.querySelectorAll(".setPin").forEach(function(b){b.onclick=function(){if(!mgr())return;var id=b.getAttribute("data-id");var box=document.querySelector("[data-pinfor='"+id+"']");var p=(box&&box.value||"").trim();if(p.length<4)return;db.users.forEach(function(u){if(u.id===id)u.pin=p;});save();draw();};});
var clearDemo=document.getElementById("clearDemo");if(clearDemo)clearDemo.onclick=function(){if(!mgr())return;db.users=db.users.filter(function(u){return !u.demo||u.id===user.id;});db.rooms=db.rooms.filter(function(r){return !r.demo;});save();draw();};
var clearStaff=document.getElementById("clearStaff");if(clearStaff)clearStaff.onclick=function(){if(!mgr())return;db.users=db.users.filter(function(u){return u.id===user.id;});save();draw();};
}
setInterval(function(){if(db.hotelCode)pullQueue();},20000);
draw();
</script></body></html>
