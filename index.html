<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c332c">
<title>Posh Certify · Posh Hotels & Suites Nigeria</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#101512;--soft:#5a635e;--paper:#f4efe6;--gold:#c4a574;--green:#1c332c}
*{box-sizing:border-box}html,body{margin:0;background:#0d1613;font-family:Outfit,system-ui,sans-serif;color:var(--ink)}
body{max-width:480px;margin:0 auto}h1,h3{font-family:"Cormorant Garamond",Georgia,serif;margin:0}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.login{min-height:100vh;color:#f4efe6;padding:32px 20px;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(16,21,18,.35),#1c332c),url(https://images.unsplash.com/photo-1611892440504-42a792e24d32?auto=format&fit=crop&w=900&q=70) center/cover}
.brand{letter-spacing:.2em;text-transform:uppercase;font-size:10px;color:#e8d7b3}
.login h1{font-size:38px;line-height:.95;margin:22px 0 10px}
.sheet{margin-top:auto;background:var(--paper);color:var(--ink);border-radius:22px 22px 0 0;padding:16px;margin-left:-20px;margin-right:-20px}
.acct,.room,.card{background:#fff;border-radius:14px;padding:12px;margin:8px 0}
.acct{width:100%;text-align:left;border:0;display:flex;justify-content:space-between}
.top{background:var(--green);color:#f4efe6;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.wrap{background:var(--paper);min-height:calc(100vh - 52px);padding:16px 16px 96px}
.btn{border:0;border-radius:999px;padding:10px 14px;background:#c4a574;color:#101512}
.btn.dark{background:#101512;color:#fff}.btn.line{background:#fff;border:1px solid #ddd}
.ok{background:#dcebe3;color:#215c3a;padding:10px;border-radius:12px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.item{background:#fff;border-radius:14px;padding:12px;margin:8px 0}
.item h3{font-size:20px}.vs{color:var(--soft);font-size:13px;margin:6px 0}
.thumb{width:72px;height:56px;object-fit:cover;border-radius:8px;background:#eee}
.file{position:relative;overflow:hidden}.file input{position:absolute;inset:0;opacity:0}
input,textarea,select{width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;margin:6px 0}
.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;font-size:11px;text-align:center}
.dock button{border:0;background:none}.kicker{color:var(--soft);font-size:12px}
</style>
</head>
<body>
<div id="app">Opening Posh Certify…</div>
<script>
const POINTS = ["Doorway","Bed","Vanity","Shower","Towels","Wardrobe","Desk","Minibar","High-touch","Floor edges","Curtains","Walkthrough"];
const KEY = "posh-full-v3";
function store() {
  const raw = localStorage.getItem(KEY);
  if (raw) { try { return JSON.parse(raw); } catch (e) {}
  }
  return {
    users: [
      {id:"sophia",name:"Sophia Adeyemi",role:"manager",title:"Duty Manager",site:"Ikeja & VI"},
      {id:"blessing",name:"Blessing Okoro",role:"housekeeper",title:"Senior Housekeeper",site:"Ikeja"},
      {id:"tunde",name:"Tunde Balogun",role:"housekeeper",title:"Room Attendant",site:"Victoria Island"}
    ],
    rooms: [
      {id:"r201",number:"201",site:"Ikeja",type:"Deluxe King",hk:"blessing",status:"pending",photos:{},notes:""},
      {id:"r204",number:"204",site:"Ikeja",type:"Deluxe Twin",hk:"blessing",status:"pending",photos:{},notes:""},
      {id:"r501",number:"501",site:"Victoria Island",type:"Executive King",hk:"tunde",status:"pending",photos:{},notes:""},
      {id:"r510",number:"510",site:"Victoria Island",type:"Junior Suite",hk:"tunde",status:"submitted",photos:{},notes:""}
    ]
  };
}
const db = store();
let user = null, tab = "rooms", roomId = null;
function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
function uid(p) { return p + Date.now(); }
function draw() {
  const el = document.getElementById("app");
  if (!user) {
    el.innerHTML = '<section class="login"><div class="brand">P · Posh Hotels & Suites · NG</div><h1>Every room certified before the guest arrives.</h1><p>Photos to the duty manager. Posh standard, not a normal tick-box.</p><div class="sheet"><p class="kicker">Staff login · tap your name</p>' +
      db.users.map(function(u){ return '<button class="acct" data-id="'+u.id+'"><span><b>'+u.name+'</b><br>'+u.title+' · '+u.site+'</span><span>'+u.role+'</span></button>'; }).join("") +
      '</div></section>';
    el.querySelectorAll(".acct").forEach(function(b){ b.onclick = function(){ user = db.users.find(function(x){return x.id===b.getAttribute("data-id");}); tab="rooms"; roomId=null; draw(); }; });
    return;
  }
  var inner = "";
  if (tab==="rooms" && !roomId) inner = viewBoard();
  else if (tab==="room") inner = viewRoom();
  else if (tab==="staff") inner = viewStaff();
  else inner = viewMe();
  el.innerHTML = '<div class="top"><span>Certify NG</span><span>'+user.name.split(" ")[0]+'</span></div><div class="wrap">'+inner+'</div><nav class="dock"><button id="d1"><b>▣</b>Rooms</button><button id="d2"><b>◉</b>Queue</button><button id="d3"><b>+</b>Staff</button><button id="d4"><b>○</b>Me</button></nav>';
  document.getElementById("d1").onclick = function(){ tab="rooms"; roomId=null; draw(); };
  document.getElementById("d2").onclick = function(){ tab="rooms"; roomId=null; draw(); };
  document.getElementById("d3").onclick = function(){ tab="staff"; roomId=null; draw(); };
  document.getElementById("d4").onclick = function(){ tab="me"; roomId=null; draw(); };
  bind();
}
function listForUser() {
  if (user.role==="manager") return db.rooms;
  return db.rooms.filter(function(r){ return r.hk===user.id; });
}
function viewBoard() {
  var rows = listForUser().map(function(r){
    return '<div class="room"><div><b>'+r.number+'</b> '+r.type+'<br><span class="kicker">'+r.site+' · '+r.status+' · '+(hkName(r.hk))+'</span></div><button class="btn open" data-id="'+r.id+'">'+(user.role==="manager"?"Review":"Open")+'</button></div>';
  }).join("");
  return '<div class="ok">Hosted Posh Certify · add staff and rooms on Staff</div><h1>'+(user.role==="manager"?"House board":"My rooms")+'</h1>'+rows;
}
function hkName(id){ var u=db.users.find(function(x){return x.id===id;}); return u?u.name.split(" ")[0]:"—"; }
function viewRoom() {
  var r = db.rooms.find(function(x){return x.id===roomId;});
  if (!r) return "Room missing";
  var pts = POINTS.map(function(p){
    var src = r.photos[p];
    return '<div class="item"><h3>'+p+'</h3><p class="vs">Posh point vs a normal hotel tick-box</p>'+(src?'<img class="thumb" src="'+src+'">':'')+'<label class="btn line file">Photo<input type="file" accept="image/*" capture="environment" data-pt="'+p+'"></label></div>';
  }).join("");
  var actions = user.role==="manager"
    ? '<div class="row"><button class="btn" id="cert">Certify</button><button class="btn dark" id="ret">Return</button></div>'
    : '<div class="row"><button class="btn" id="send">Send to manager</button></div>';
  return '<p class="kicker" id="back">← Rooms</p><h1>Room '+r.number+'</h1><p class="kicker">'+r.site+' · '+r.type+' · '+r.status+'</p>'+pts+'<textarea id="note" placeholder="Note">'+((r.notes)||"")+'</textarea>'+actions;
}
function viewStaff() {
  var people = db.users.map(function(u){ return '<div class="card"><b>'+u.name+'</b><br>'+u.role+' · '+u.site+'</div>'; }).join("");
  var hks = db.users.filter(function(u){return u.role==="housekeeper";});
  var opts = hks.map(function(u){ return '<option value="'+u.id+'">'+u.name+'</option>'; }).join("");
  return '<h1>Staff & rooms</h1><div class="ok">Add real Posh names and room numbers here.</div>'+people+
    '<div class="card"><h3>Add staff</h3><input id="sn" placeholder="Full name"><input id="st" placeholder="Title"><select id="sr"><option value="housekeeper">Housekeeper</option><option value="manager">Duty manager</option></select><input id="ss" placeholder="Ikeja or Victoria Island" value="Ikeja"><button class="btn" id="addStaff">Save staff</button></div>'+
    '<div class="card"><h3>Add room</h3><input id="rn" placeholder="Room number"><input id="rt" placeholder="Deluxe King"><input id="rs" placeholder="Ikeja" value="Ikeja"><select id="rh">'+opts+'</select><button class="btn" id="addRoom">Save room</button></div>';
}
function viewMe() {
  return '<h1>'+user.name+'</h1><p class="kicker">'+user.title+' · '+user.site+'</p><div class="ok">This hosted page saves staff, rooms and photos in this phone browser.</div><button class="btn line" id="out">Sign out</button>';
}
function bind() {
  document.querySelectorAll(".open").forEach(function(b){ b.onclick = function(){ roomId=b.getAttribute("data-id"); tab="room"; draw(); }; });
  var back = document.getElementById("back"); if (back) back.onclick = function(){ tab="rooms"; roomId=null; draw(); };
  var out = document.getElementById("out"); if (out) out.onclick = function(){ user=null; draw(); };
  document.querySelectorAll("input[type=file]").forEach(function(inp){
    inp.onchange = function(){
      var file = inp.files && inp.files[0]; if (!file) return;
      var r = db.rooms.find(function(x){return x.id===roomId;});
      var reader = new FileReader();
      reader.onload = function(){ r.photos[inp.getAttribute("data-pt")] = reader.result; save(); draw(); };
      reader.readAsDataURL(file);
    };
  });
  var send = document.getElementById("send");
  if (send) send.onclick = function(){
    var r = db.rooms.find(function(x){return x.id===roomId;});
    r.notes = (document.getElementById("note")||{}).value || "";
    r.status = "submitted"; save();
    window.open("https://wa.me/2348012345678?text="+encodeURIComponent("POSH CERTIFY Room "+r.number+" waiting"), "_blank");
    tab="rooms"; roomId=null; draw();
  };
  var cert = document.getElementById("cert");
  if (cert) cert.onclick = function(){ var r=db.rooms.find(function(x){return x.id===roomId;}); r.status="certified"; save(); tab="rooms"; roomId=null; draw(); };
  var ret = document.getElementById("ret");
  if (ret) ret.onclick = function(){ var r=db.rooms.find(function(x){return x.id===roomId;}); r.status="returned"; save(); tab="rooms"; roomId=null; draw(); };
  var addStaff = document.getElementById("addStaff");
  if (addStaff) addStaff.onclick = function(){
    var name = (document.getElementById("sn").value||"").trim();
    if (!name) return;
    db.users.push({id:uid("u"), name:name, role:document.getElementById("sr").value, title:document.getElementById("st").value||"Staff", site:document.getElementById("ss").value||"Ikeja"});
    save(); draw();
  };
  var addRoom = document.getElementById("addRoom");
  if (addRoom) addRoom.onclick = function(){
    var number = (document.getElementById("rn").value||"").trim();
    if (!number) return;
    db.rooms.push({id:uid("r"), number:number, type:document.getElementById("rt").value||"Deluxe", site:document.getElementById("rs").value||"Ikeja", hk:document.getElementById("rh").value||"blessing", status:"pending", photos:{}, notes:""});
    save(); tab="rooms"; draw();
  };
}
draw();
</script>
</body>
</html>
