<!DOCTYPE html>
<html lang="en-NG"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Posh Certify</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#0d1613;max-width:480px;margin:0 auto}h1{font-family:Georgia,serif}.wrap{background:#f4efe6;min-height:100vh;padding:16px 16px 90px}.top{background:#1c332c;color:#f4efe6;padding:14px 16px;display:flex;justify-content:space-between}.btn{border:0;border-radius:999px;padding:10px 14px;background:#c4a574;margin:4px 4px 0 0}.btn.bad{background:#8c3a32;color:#fff}.btn.dark{background:#101512;color:#fff}.card,.room,.acct{background:#fff;border-radius:14px;padding:12px;margin:8px 0;border:0;width:100%;text-align:left}.ok{background:#dcebe3;padding:10px;border-radius:12px}.warn{background:#f3e6c8;padding:10px;border-radius:12px}textarea,input,select{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}p{margin:8px 0 0}textarea{min-height:64px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #eee}.row input{width:64px;margin:0}.qty{font-weight:700;color:#8c3a32}small{color:#5c6b64}.dock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;padding:10px}.login{min-height:100vh;color:#fff;padding:28px 18px;background:#1c332c}</style></head><body><div id="app"></div>
<script>
const KEY="posh-full-v10";
const ITEMS=[{id:"bath_towel",cat:"Towels",name:"Bath towel"},{id:"hand_towel",cat:"Towels",name:"Hand towel"},{id:"face_cloth",cat:"Towels",name:"Face cloth"},{id:"bath_mat",cat:"Towels",name:"Bath mat"},{id:"bathrobe",cat:"Towels",name:"Bathrobe"},{id:"sheet",cat:"Linen",name:"Bed sheet"},{id:"pillow",cat:"Linen",name:"Pillowcase"},{id:"duvet",cat:"Linen",name:"Duvet / comforter"},{id:"blanket",cat:"Linen",name:"Extra blanket"},{id:"soap",cat:"Toiletries",name:"Soap / shower gel"},{id:"shampoo",cat:"Toiletries",name:"Shampoo"},{id:"conditioner",cat:"Toiletries",name:"Conditioner"},{id:"lotion",cat:"Toiletries",name:"Body lotion"},{id:"dental",cat:"Toiletries",name:"Dental kit"},{id:"tissue",cat:"Toiletries",name:"Tissue / toilet paper"},{id:"slippers",cat:"Amenities",name:"Slippers"},{id:"water",cat:"Amenities",name:"Bottled water"},{id:"tea",cat:"Amenities",name:"Tea / coffee / sugar"},{id:"sew",cat:"Amenities",name:"Sewing kit"},{id:"bag",cat:"Amenities",name:"Laundry bag"},{id:"other",cat:"Other",name:"Other item"}];
function seed(){return{whatsapp:"",frontDesk:"",locations:["Ikeja","Victoria Island"],catalog:ITEMS.map(function(x){return{id:x.id,cat:x.cat,name:x.name,par:1};}),users:[{id:"sophia",name:"Sophia Adeyemi",role:"manager",site:"Ikeja",pin:"2401",whatsapp:"",demo:true},{id:"blessing",name:"Blessing Okoro",role:"housekeeper",site:"Ikeja",pin:"4412",whatsapp:"",demo:true},{id:"tunde",name:"Tunde Balogun",role:"housekeeper",site:"Victoria Island",pin:"5508",whatsapp:"",demo:true},{id:"desk",name:"Front Desk Ikeja",role:"frontdesk",site:"Ikeja",pin:"1100",whatsapp:"",demo:true},{id:"dunni",name:"Oladunni Olayanju",role:"gm",site:"Ikeja & VI",pin:"2026",whatsapp:"",demo:true},{id:"maint",name:"Ibrahim Musa",role:"maint",site:"Ikeja & VI",pin:"3300",whatsapp:"",demo:true}],rooms:[{id:"r201",number:"201",site:"Ikeja",type:"Deluxe King",hk:"blessing",status:"pending",photos:{},missing:{},laundryLog:[],demo:true},{id:"r501",number:"501",site:"Victoria Island",type:"Executive King",hk:"tunde",status:"pending",photos:{},missing:{},laundryLog:[],demo:true}]};}
function load(){try{var x=JSON.parse(localStorage.getItem(KEY)||"");if(x&&x.users)return x;}catch(e){}return seed();}
var db=load();if(!db.frontDesk)db.frontDesk="";if(!db.whatsapp)db.whatsapp="";if(!db.locations)db.locations=["Ikeja","Victoria Island"];
if(!db.catalog||!db.catalog.length)db.catalog=ITEMS.map(function(x){return{id:x.id,cat:x.cat,name:x.name,par:1};});
db.rooms.forEach(function(r){if(!r.missing)r.missing={};if(!r.laundryLog)r.laundryLog=[];if(r.laundryChecked==null)r.laundryChecked=false;});
function catalog(){return db.catalog&&db.catalog.length?db.catalog:ITEMS;}
function itemName(id){var it=catalog().filter(function(x){return x.id===id;})[0];return it?it.name:id;}
var user=null,tab="rooms",roomId=null,pending=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function mgr(){return user&&user.role==="manager";}
function isFD(){return user&&user.role==="frontdesk";}
function isGM(){return user&&user.role==="gm";}
function isMaint(){return user&&user.role==="maint";}
function digits(s){return String(s||"").replace(/[^0-9]/g,"");}
function firstWa(role, fallback){var u=db.users.filter(function(x){return x.role===role&&digits(x.whatsapp).length>=11;})[0];var n=u?digits(u.whatsapp):"";return n.length>=11?n:digits(fallback);}
function waDigits(){return digits(db.whatsapp)||firstWa("manager","");}
function fdDigits(){return digits(db.frontDesk)||firstWa("frontdesk","");}
function pingBoth(msg){var a=fdDigits(),b=waDigits();if(a.length>=11)window.open("https://wa.me/"+a+"?text="+encodeURIComponent(msg),"_blank");setTimeout(function(){if(b.length>=11&&b!==a)window.open("https://wa.me/"+b+"?text="+encodeURIComponent(msg),"_blank");},700);}
function locSel(id,v){return "<select id='"+id+"'>"+db.locations.map(function(l){return "<option"+(l===v?" selected":"")+">"+l+"</option>";}).join("")+"</select>";}
function roleSel(id,v){var roles=[["housekeeper","Housekeeper"],["manager","Duty manager"],["frontdesk","Front desk"],["gm","General Manager"],["maint","Maintenance"]];return "<select id='"+id+"'>"+roles.map(function(r){return "<option value='"+r[0]+"'"+(v===r[0]?" selected":"")+">"+r[1]+"</option>";}).join("")+"</select>";}
function missCount(r){var n=0;Object.keys(r.missing||{}).forEach(function(k){n+=Number(r.missing[k]||0);});return n;}
function draw(){var el=document.getElementById("app");
if(!user){if(pending){el.innerHTML="<div class=login><h1>Enter PIN</h1><p>"+pending.name+"</p><input id=pinbox type=password inputmode=numeric placeholder='PIN'><p><button class=btn id=pinok>Unlock</button> <button class='btn dark' id=pincancel>Back</button></p></div>";document.getElementById("pinok").onclick=function(){if(document.getElementById("pinbox").value.trim()===String(pending.pin)){user=pending;pending=null;tab="rooms";roomId=null;draw();}};document.getElementById("pincancel").onclick=function(){pending=null;draw();};return;}
el.innerHTML="<div class=login><h1>Posh Certify</h1>"+db.users.map(function(u){return "<button class=acct data-id='"+u.id+"'><b>"+u.name+"</b><br>"+u.role+" · "+u.site+"</button>";}).join("")+"</div>";
el.querySelectorAll(".acct").forEach(function(b){b.onclick=function(){pending=db.users.filter(function(u){return u.id===b.getAttribute("data-id");})[0];draw();};});return;}
var inner=tab==="staff"?viewStaff():(tab==="me"?viewMe():(tab==="laundry"?viewTrack():(roomId?viewRoom():viewBoard())));
el.innerHTML="<div class=top><span>Certify NG</span><span>"+user.name.split(" ")[0]+"</span></div><div class=wrap>"+inner+"</div><div class=dock><button id=d1>Rooms</button><button id=d2>Laundry</button><button id=d3>Staff</button><button id=d4>Me</button></div>";
document.getElementById("d1").onclick=function(){tab="rooms";roomId=null;draw();};
document.getElementById("d2").onclick=function(){tab="laundry";roomId=null;draw();};
document.getElementById("d3").onclick=function(){tab="staff";roomId=null;draw();};
document.getElementById("d4").onclick=function(){tab="me";roomId=null;draw();};
bind();}
function names(a){return a.length?a.map(function(r){return r.number;}).join(", "):"—";}
function gmCard(site){var rs=db.rooms.filter(function(r){return !site||r.site===site;});var short=rs.filter(function(r){return missCount(r)>0;});return "<div class=card><h3>"+(site||"All locations")+"</h3><p><b>"+rs.filter(function(r){return r.status==="certified";}).length+"</b> certified</p><p><b>"+short.length+"</b> rooms short on items</p></div>";}
function viewBoard(){if(isGM())return "<div class=ok>GM report only.</div><h1>House report</h1>"+gmCard("")+db.locations.map(gmCard).join("");
var list=(mgr()||isMaint())?db.rooms:(isFD()?db.rooms.filter(function(r){return r.status==="certified"||r.status==="submitted"||r.status==="ooo";}):db.rooms.filter(function(r){return r.hk===user.id&&r.status!=="ooo";}));
return "<h1>Rooms</h1>"+list.map(function(r){var m=missCount(r);return "<div class=room><b>"+r.number+"</b> "+r.type+"<br>"+r.site+" · "+r.status+(m?" · <span class=qty>"+m+" missing</span>":"")+" <button class='btn open' data-id='"+r.id+"'>Open</button></div>";}).join("");}
function viewCatalog(){if(!mgr())return "";
var list=catalog().map(function(it){return "<div class=card><b>"+it.name+"</b><br>"+it.cat+" · should be in room: "+(it.par||0)+"<input data-par='"+it.id+"' type=number min=0 value='"+(it.par||0)+"'><button class='btn savePar' data-id='"+it.id+"'>Save par</button> <button class='btn bad delIt' data-id='"+it.id+"'>Remove item</button></div>";}).join("");
return "<div class=ok>Set what must be in every room. Housekeepers monitor only this list.</div><h1>Room item list</h1>"+list+"<div class=card><h3>Add item to rooms</h3><select id=icat><option>Towels</option><option>Linen</option><option>Toiletries</option><option>Amenities</option><option>Other</option></select><input id=iname placeholder='Item name e.g. Guest slippers'><input id=ipar type=number min=0 value=1 placeholder='How many in each room'><button class=btn id=addItem>Add to all rooms</button></div>";}
function viewTrack(){var rooms=db.rooms.filter(function(r){return missCount(r)>0||(r.laundryLog&&r.laundryLog.length);});
var head=viewCatalog()+"<h1>Laundry tracker</h1>";
if(!rooms.length)return head+"<div class=ok>No missing-item reports yet.</div>";
return head+rooms.map(function(r){var lines=catalog().map(function(it){var n=Number((r.missing||{})[it.id]||0);return n?"<div class=row><span>"+it.cat+" · "+it.name+"</span><span class=qty>"+n+"</span></div>":"";}).join("");
var log=(r.laundryLog||[]).slice(-5).reverse().map(function(e){return "<p>"+e.at+" · "+e.by+" — "+e.summary+"</p>";}).join("");
return "<div class=card><b>Room "+r.number+"</b> · "+r.site+" · total "+missCount(r)+lines+(log?"<p><b>History</b></p>"+log:"")+(mgr()?"<button class='btn restock' data-id='"+r.id+"'>Mark restocked</button>":"")+"</div>";}).join("");}
function laundryBox(r){var canEdit=!(mgr()||isFD()||isGM()||isMaint());
var lastCat="";var rows=catalog().map(function(it){var n=Number((r.missing||{})[it.id]||0);var expect=Number(it.par||0);var head=it.cat!==lastCat?(lastCat=it.cat,"<p><b>"+it.cat+"</b></p>"):"";
var ctrl=canEdit?"<input class=q type=number min=0 inputmode=numeric data-item='"+it.id+"' value='"+(n||"")+"' placeholder='0'>":"<span class=qty>"+n+"</span>";
return head+"<div class=row><span>"+it.name+" <small>should be "+expect+"</small></span>"+ctrl+"</div>";}).join("");
var log=(r.laundryLog||[]).slice(-4).reverse().map(function(e){return "<p>"+e.at+" · "+e.by+" — "+e.summary+"</p>";}).join("");
return "<div class=card><h3>Missing item count</h3><p>Required before submit. 0 = complete. This count is part of room certification.</p>"+rows+(canEdit?"<textarea id=lnote placeholder='Note'>"+(r.laundryNote||"")+"</textarea><button class=btn id=lrep>Save count and report to duty manager</button>":"")+(mgr()?"<button class='btn restock' data-id='"+r.id+"'>Mark restocked</button>":"")+(log?"<p><b>Tracking</b></p>"+log:"")+"</div>";}
function viewRoom(){var r=db.rooms.filter(function(x){return x.id===roomId;})[0];
var miss=missCount(r);var act=mgr()?(miss?"<div class=warn>Cannot certify yet. "+miss+" missing items. Restock is part of certification.</div><button class='btn bad' id=ooo>Set OUT OF ORDER</button> <button class=btn id=rel>Return to service</button>":"<button class=btn id=cert>Certify and notify front desk</button> <button class='btn bad' id=ooo>Set OUT OF ORDER</button> <button class=btn id=rel>Return to service</button>"):isMaint()?"<button class='btn bad' id=ooo>Set OUT OF ORDER</button> <button class=btn id=rel>Return to service</button>":isFD()?(r.status==="ooo"?"<div class=warn>OOO. Do not sell.</div>":"<div class=ok>Sell when CERTIFIED.</div>"):isGM()?"<div class=ok>Reports only.</div>":(r.laundryChecked?"<button class=btn id=send>Submit to duty manager</button>":"<div class=warn>Laundry count is part of certification. Save the count first (0 on every line if complete).</div>");
return "<p id=back>&larr; Back</p><h1>Room "+r.number+"</h1><p>"+r.status+(missCount(r)?" · "+missCount(r)+" missing":"")+"</p>"+laundryBox(r)+act;}
function viewStaff(){if(!mgr())return "<h1>Staff</h1><div class=warn>Duty manager only.</div>";
var people=db.users.map(function(u){return "<div class=card><b>"+u.name+"</b> · "+u.role+"<p>Name</p><input data-en='"+u.id+"' value='"+u.name+"'><p>Role</p>"+roleSel("er-"+u.id,u.role)+"<p>Location</p>"+locSel("es-"+u.id,u.site)+"<p>PIN</p><input data-pinfor='"+u.id+"' placeholder='New PIN'><p>WhatsApp</p><input data-ew='"+u.id+"' value='"+digits(u.whatsapp)+"'><button class='btn saveU' data-id='"+u.id+"'>Save changes</button> <button class='btn bad delU' data-id='"+u.id+"'>Remove</button></div>";}).join("");
return "<h1>Staff</h1>"+people+"<p><button class='btn dark' id=clearDemo>Remove demo staff and rooms</button></p><div class=card><h3>Hotel WhatsApp</h3><p>Duty manager</p><input id=wa value='"+digits(db.whatsapp)+"'><p>Front desk</p><input id=fd value='"+digits(db.frontDesk)+"'><button class=btn id=saveWa>Save hotel numbers</button></div><div class=card><h3>Add staff</h3><input id=sn placeholder='Full name'>"+roleSel("sr","housekeeper")+locSel("ss","Ikeja")+"<input id=sp placeholder='PIN'><input id=sw placeholder='WhatsApp'><button class=btn id=addStaff>Save staff</button></div>";}
function viewMe(){return "<h1>"+user.name+"</h1><p>"+user.role+"</p><button class=btn id=out>Sign out</button>";}
function collectCounts(){var miss={};document.querySelectorAll(".q").forEach(function(inp){var n=parseInt(inp.value,10);if(n>0)miss[inp.getAttribute("data-item")]=n;});return miss;}
function bind(){
document.querySelectorAll(".open").forEach(function(b){b.onclick=function(){roomId=b.getAttribute("data-id");tab="rooms";draw();};});
var back=document.getElementById("back");if(back)back.onclick=function(){roomId=null;draw();};
var out=document.getElementById("out");if(out)out.onclick=function(){user=null;draw();};
var addItem=document.getElementById("addItem");if(addItem)addItem.onclick=function(){if(!mgr())return;var name=(document.getElementById("iname").value||"").trim();if(!name){alert("Item name required");return;}var par=parseInt(document.getElementById("ipar").value,10);if(!(par>=0))par=1;db.catalog.push({id:"i"+Date.now(),cat:document.getElementById("icat").value,name:name,par:par});save();draw();};
document.querySelectorAll(".savePar").forEach(function(b){b.onclick=function(){if(!mgr())return;var id=b.getAttribute("data-id");var box=document.querySelector("[data-par='"+id+"']");var n=parseInt(box&&box.value,10);if(!(n>=0))n=0;catalog().forEach(function(it){if(it.id===id)it.par=n;});save();draw();};});
document.querySelectorAll(".delIt").forEach(function(b){b.onclick=function(){if(!mgr())return;var id=b.getAttribute("data-id");if(!confirm("Remove this item from the room list?"))return;db.catalog=catalog().filter(function(it){return it.id!==id;});save();draw();};});
var lrep=document.getElementById("lrep");if(lrep)lrep.onclick=function(){if(mgr()||isFD()||isGM()||isMaint())return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];var miss=collectCounts();var note=(document.getElementById("lnote")||{}).value||"";if(!Object.keys(miss).length&&!String(note).trim()){note="All listed items complete.";}r.missing=miss;r.laundryNote=String(note).trim();r.laundryChecked=true;var parts=Object.keys(miss).map(function(k){return miss[k]+" x "+itemName(k);});var summary=parts.join(", ")||note;r.laundryLog=r.laundryLog||[];r.laundryLog.push({at:new Date().toLocaleString(),by:user.name,summary:summary});save();var n=waDigits();if(n.length>=11)window.open("https://wa.me/"+n+"?text="+encodeURIComponent("POSH CERTIFY LAUNDRY\nRoom "+r.number+"\n"+summary+"\n"+note+"\nBy "+user.name),"_blank");draw();};
document.querySelectorAll(".restock").forEach(function(b){b.onclick=function(){if(!mgr())return;var id=b.getAttribute("data-id");var r=db.rooms.filter(function(x){return x.id===id;})[0];if(!r)return;r.missing={};r.laundryChecked=true;r.laundryLog=r.laundryLog||[];r.laundryLog.push({at:new Date().toLocaleString(),by:user.name,summary:"RESTOCKED"});save();draw();};});
var send=document.getElementById("send");if(send)send.onclick=function(){if(mgr()||isFD()||isGM()||isMaint())return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];if(!r.laundryChecked){alert("Save the laundry count first. It is part of certification.");return;}r.status="submitted";save();var n=waDigits();if(n.length>=11)window.open("https://wa.me/"+n+"?text="+encodeURIComponent("POSH CERTIFY Room "+r.number+" submitted"+(missCount(r)?" | missing "+missCount(r):"")),"_blank");roomId=null;draw();};
var cert=document.getElementById("cert");if(cert)cert.onclick=function(){if(!mgr())return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];if(r.status==="ooo"){alert("Release OOO first");return;}if(missCount(r)>0){alert("Cannot certify. Restock missing items first. Laundry is part of certification.");return;}if(!r.laundryChecked){alert("Housekeeper has not completed the laundry count.");return;}r.status="certified";save();var fd=fdDigits();if(fd.length>=11)window.open("https://wa.me/"+fd+"?text="+encodeURIComponent("POSH CERTIFY Room "+r.number+" CERTIFIED. Ready to sell."),"_blank");roomId=null;draw();};
var ooo=document.getElementById("ooo");if(ooo)ooo.onclick=function(){if(!(isMaint()||mgr()))return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];r.status="ooo";save();pingBoth("POSH CERTIFY Room "+r.number+" OUT OF ORDER. CLOSED.");roomId=null;draw();};
var rel=document.getElementById("rel");if(rel)rel.onclick=function(){if(!(isMaint()||mgr()))return;var r=db.rooms.filter(function(x){return x.id===roomId;})[0];r.status="pending";save();pingBoth("POSH CERTIFY Room "+r.number+" BACK IN SERVICE.");roomId=null;draw();};
var saveWa=document.getElementById("saveWa");if(saveWa)saveWa.onclick=function(){if(!mgr())return;db.whatsapp=digits(document.getElementById("wa").value);db.frontDesk=digits(document.getElementById("fd").value);save();draw();};
document.querySelectorAll(".delU").forEach(function(b){b.onclick=function(){if(!mgr())return;var id=b.getAttribute("data-id");if(user&&id===user.id){alert("Cannot remove the account in use.");return;}db.users=db.users.filter(function(u){return u.id!==id;});save();draw();};});
document.querySelectorAll(".saveU").forEach(function(b){b.onclick=function(){if(!mgr())return;var id=b.getAttribute("data-id");var n=(document.querySelector("[data-en='"+id+"']")||{}).value;var roleEl=document.getElementById("er-"+id);var siteEl=document.getElementById("es-"+id);var pinEl=document.querySelector("[data-pinfor='"+id+"']");var waEl=document.querySelector("[data-ew='"+id+"']");db.users.forEach(function(u){if(u.id!==id)return;if(n&&String(n).trim())u.name=String(n).trim();if(roleEl)u.role=roleEl.value;if(siteEl)u.site=siteEl.value;if(pinEl&&pinEl.value.trim().length>=4)u.pin=pinEl.value.trim();if(waEl)u.whatsapp=digits(waEl.value);});save();draw();};});
var clearDemo=document.getElementById("clearDemo");if(clearDemo)clearDemo.onclick=function(){if(!mgr())return;db.users=db.users.filter(function(u){return !u.demo||(user&&u.id===user.id);});db.rooms=db.rooms.filter(function(r){return !r.demo;});save();draw();};
var addStaff=document.getElementById("addStaff");if(addStaff)addStaff.onclick=function(){if(!mgr())return;var n=document.getElementById("sn").value.trim();if(!n)return;var pin=document.getElementById("sp").value.trim();if(pin.length<4)return;db.users.push({id:"u"+Date.now(),name:n,role:document.getElementById("sr").value,site:document.getElementById("ss").value,pin:pin,whatsapp:digits(document.getElementById("sw").value),demo:false});save();draw();};
}
draw();
</script></body></html>
