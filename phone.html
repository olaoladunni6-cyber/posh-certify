<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posh Manager 33K</title>
<style>
html,body{margin:0;height:100%;background:#1c332c;font-family:system-ui}
#bar{padding:10px;font-size:13px;font-weight:700;background:#c4a574;color:#101512}
#msg{display:block;margin-bottom:8px}
#acts button{border:0;border-radius:999px;padding:10px 14px;background:#101512;color:#fff;font-weight:700;margin:0 6px 6px 0}
iframe{position:fixed;left:0;right:0;bottom:0;width:100%;border:0;top:56px;height:calc(100% - 56px)}
iframe.tall{top:200px;height:calc(100% - 200px)}
#vidWrap{display:none;margin-top:6px}#vidWrap.on{display:block}
</style>
</head>
<body>
<div id=bar>
  <span id=msg>POSH MANAGER 33K — loading…</span>
  <div id=acts>
    <button type=button id=barTok>Save token</button>
    <button type=button id=barPub>Publish</button>
    <button type=button id=barPull>Refresh</button>
    <button type=button id=barQuery>Query sales</button>
    <button type=button id=barReply>Reply to query</button>
    <button type=button id=barMartSell>Sell mini mart</button>
    <button type=button id=barMartIn>Receive mini mart</button>
    <button type=button id=barMartItem>Add mart item</button>
    <button type=button id=barIn>Clock in</button>
    <button type=button id=barOpen>Submit opening</button>
    <button type=button id=barClose>Submit closing</button>
    <button type=button id=barFolio>Save folio</button>
    <button type=button id=barShift>Submit shift</button>
    <button type=button id=barAck>Acknowledge</button>
    <button type=button id=barCert>Certify room</button>
    <button type=button id=barSvc>Return to service</button>
    <button type=button id=barOOO>Set OOO</button>
    <button type=button id=barFix>Open Fix</button>
    <button type=button id=barMaint>Send to maintenance</button>
    <button type=button id=barSaveCnt>Save counts</button>
    <button type=button id=barLaundry>Send to laundry</button>
    <button type=button id=barSendRoom>Submit room</button>
  </div>
  <div id=vidWrap><input id=barVid type=file accept="video/*,video/mp4" capture="environment"></div>
</div>
<script>
var V="20260901AK"+Date.now(),frame;
var ALL=["barTok","barPub","barPull","barQuery","barReply","barMartSell","barMartIn","barMartItem","barIn","barOpen","barClose","barFolio","barShift","barAck","barCert","barSvc","barOOO","barFix","barMaint","barSaveCnt","barLaundry","barSendRoom"];
function win(){return frame&&frame.contentWindow;}
function say(t){document.getElementById("msg").textContent=t;}
function loadInto(w,src){return fetch(src+"?v="+V,{cache:"reload"}).then(function(r){if(!r.ok)throw new Error(src);return r.text();}).then(function(code){var s=w.document.createElement("script");s.text=code;w.document.body.appendChild(s);});}
function show(id,on){var el=document.getElementById(id);if(el)el.style.display=on?"inline-block":"none";}
function val(w,id){var el=w.document.getElementById(id);return el?(el.value||"").trim():"";}
function num(w,id){var n=parseFloat(val(w,id)||"0");return isNaN(n)?0:n;}
function openRoom(w){if(!w||!w.roomId||!w.db)return null;return w.db.rooms.filter(function(x){return x.id===w.roomId;})[0]||null;}
function hkRoom(w){var r=openRoom(w);if(r)return r;return ((w&&w.db&&w.db.rooms||[]).filter(function(x){return w.user&&x.hk===w.user.id&&x.status!=="certified"&&x.status!=="ooo";})[0]||null);}
function hidePageBtns(w){try{var st=w.document.getElementById("hidePageBtns");if(!st){st=w.document.createElement("style");st.id="hidePageBtns";w.document.head.appendChild(st);}st.textContent="#send,#sendL,#lrep,#cert,#rel,#ooo,#saveCin,#submitShift{display:none!important}";}catch(e){}}
function nairaTxt(n){return "NGN "+Number(n||0).toLocaleString();}
function paintBar(){
  var w=win(),fr=frame;ALL.forEach(function(id){show(id,false);});document.getElementById("vidWrap").className="";
  if(!w||!w.user){if(fr)fr.className="";return;}hidePageBtns(w);if(fr)fr.className="tall";
  var role=w.user.role,r=openRoom(w);
  if(role==="housekeeper"){show("barSaveCnt",true);show("barLaundry",true);show("barSendRoom",true);show("barFix",true);show("barMaint",true);show("barPub",true);document.getElementById("vidWrap").className="on";say("Housekeeper");return;}
  if(role==="frontdesk"){show("barTok",true);show("barPub",true);show("barPull",true);show("barIn",true);show("barOpen",true);show("barClose",true);show("barFolio",true);show("barMartSell",true);show("barMartIn",true);show("barMartItem",true);show("barShift",true);show("barFix",true);show("barMaint",true);show("barReply",true);say("Front Desk — choose on page first");return;}
  if(role==="manager"){show("barTok",true);show("barPub",true);show("barPull",true);show("barAck",true);show("barCert",true);show("barSvc",true);show("barOOO",true);show("barFix",true);show("barMaint",true);say(r?("Room "+r.number):"Open a room");return;}
  if(role==="accountant"||role==="ceo"){show("barTok",true);show("barPub",true);show("barPull",true);show("barQuery",true);show("barReply",true);say("Query sales");return;}
  if(role==="superadmin"){show("barTok",true);show("barPub",true);show("barPull",true);show("barQuery",true);show("barMartIn",true);show("barMartItem",true);say("Super Admin");return;}
  show("barTok",true);show("barPub",true);show("barPull",true);say(w.user.name);
}
setInterval(paintBar,800);
document.getElementById("barMartSell").onclick=function(){var w=win();if(w&&w.poshMartSell)w.poshMartSell();};
document.getElementById("barMartIn").onclick=function(){var w=win();if(w&&w.poshMartReceive)w.poshMartReceive();};
document.getElementById("barMartItem").onclick=function(){var w=win();if(w&&w.poshMartAddItem)w.poshMartAddItem();};
document.getElementById("barQuery").onclick=function(){var w=win();if(!w)return;alert("Open Desk, review figures, then use Query sales after Refresh.");};
document.getElementById("barFix").onclick=function(){var w=win();if(!w)return;w.tab="issues";try{w.draw();}catch(e){};};
document.getElementById("barTok").onclick=function(){var v=prompt("Paste GitHub token");if(!v)return;localStorage.setItem("posh-gh-token",v.trim());var w=win();if(w)try{w.localStorage.setItem("posh-gh-token",v.trim());}catch(e){}alert("Token saved");};
document.getElementById("barPub").onclick=function(){var w=win();if(w&&w.publishHotel)w.publishHotel(function(ok,err){alert(ok?"Published":String(err||"fail"));});};
document.getElementById("barPull").onclick=function(){var w=win();if(w&&w.refreshHotel)w.refreshHotel(function(ok){alert(ok?"Refreshed":"Could not refresh");});};
document.getElementById("barFolio").onclick=function(){var w=win();if(!w||w.user.role!=="frontdesk")return;var name=val(w,"cinName"),room=val(w,"cinRoom");if(!name||!room){alert("Fill guest name and room on Desk first");return;}if(!w.db.checkins)w.db.checkins=[];w.db.checkins.push({id:"c"+Date.now(),guest:name,room:room,amount:num(w,"cinAmt"),extras:{early:num(w,"cinEarly"),earlyNote:val(w,"cinEarlyNote"),late:num(w,"cinLate"),lateNote:val(w,"cinLateNote"),laundry:num(w,"cinLau"),laundryNote:val(w,"cinLauNote"),other:num(w,"cinOth"),otherNote:val(w,"cinOthNote")},debt:num(w,"cinDebt"),debtNote:val(w,"cinDebtNote"),site:w.user.site,by:w.user.name,byId:w.user.id,day:w.today(),at:new Date().toLocaleString()});try{w.save();}catch(e){}alert("Room folio saved");};
document.getElementById("barShift").onclick=function(){var w=win();if(!w.db.shiftReports)w.db.shiftReports=[];w.db.shiftReports.push({id:"sh"+Date.now(),day:w.today(),site:w.user.site,by:w.user.name,at:new Date().toLocaleString()});try{w.save();}catch(e){}alert("Shift submitted");};
document.getElementById("barCert").onclick=function(){var w=win(),r=openRoom(w);if(!r){alert("Open the room first");return;}r.status="certified";if(w.pingRoomWa)w.pingRoomWa(r.number,"CERTIFIED. Ready to sell");if(w.poshDeskNote)w.poshDeskNote(r.number,"CERTIFIED");try{w.save();}catch(e){}alert("Certified");};
document.getElementById("barSvc").onclick=function(){var w=win(),r=openRoom(w);if(!r){alert("Open the room first");return;}var note=prompt("What should the housekeeper do?","Spring clean");if(note===null)return;r.status="pending";r.hkNote=String(note).trim();if(w.pingRoomWa)w.pingRoomWa(r.number,"RETURNED TO SERVICE. "+r.hkNote);if(w.poshDeskNote)w.poshDeskNote(r.number,"RETURNED TO SERVICE");try{w.save();}catch(e){}alert("Returned to service");};
document.getElementById("barOOO").onclick=function(){var w=win(),r=openRoom(w);if(!r)return;r.status="ooo";if(w.pingRoomWa)w.pingRoomWa(r.number,"OUT OF ORDER. Do not sell");if(w.poshDeskNote)w.poshDeskNote(r.number,"OUT OF ORDER");try{w.save();}catch(e){}alert("OOO");};
document.getElementById("barVid").onchange=function(){var w=win(),f=this.files&&this.files[0],r=hkRoom(w);if(!r||!f)return;r.videoReady=true;try{w.save();}catch(e){};};
document.getElementById("barSaveCnt").onclick=function(){var w=win(),r=hkRoom(w);if(!r)return;if(!r.missing)r.missing={};try{w.document.querySelectorAll(".q").forEach(function(inp){var n=parseInt(inp.value,10);if(n>0)r.missing[inp.getAttribute("data-item")]=n;});}catch(e){}r.laundryChecked=true;try{w.save();}catch(e){}alert("Counts saved");};
document.getElementById("barLaundry").onclick=function(){var w=win(),r=hkRoom(w);if(!r)return;var items={};try{w.document.querySelectorAll(".sq").forEach(function(inp){var n=parseInt(inp.value,10);if(n>0)items[inp.getAttribute("data-item")]=n;});}catch(e){}if(!Object.keys(items).length){alert("Type linen quantities on the room first");return;}if(!w.db.slips)w.db.slips=[];w.db.slips.push({id:"s"+Date.now(),room:r.number,site:r.site,by:w.user.name,at:new Date().toLocaleString(),items:items,status:"sent",summary:Object.keys(items).map(function(k){return items[k]+" x "+(w.itemName?w.itemName(k):k);}).join(", ")});try{w.save();}catch(e){}alert("Sent to laundry");};
document.getElementById("barSendRoom").onclick=function(){var w=win(),r=hkRoom(w);if(!r)return;if(!r.videoReady){alert("Attach video first");return;}r.status="submitted";try{w.save();}catch(e){}alert("Submitted");};
document.getElementById("barIn").onclick=function(){var w=win();if(!w.db.clocks)w.db.clocks=[];w.db.clocks.push({id:"ck"+Date.now(),day:w.today(),site:w.user.site,by:w.user.name,byId:w.user.id,inAt:new Date().toLocaleTimeString(),outAt:""});try{w.save();}catch(e){}try{w.draw();}catch(e){}alert("Clocked in. Tick opening list, then Submit opening.");};
document.getElementById("barOpen").onclick=function(){var w=win();var items=w.poshCollectOpen?w.poshCollectOpen():[];if(!items.length){alert("Tick the opening checklist on Desk first.");return;}if(!w.db.fdChecks)w.db.fdChecks=[];w.db.fdChecks.push({id:"fc"+Date.now(),day:w.today(),site:w.user.site,kind:"open",by:w.user.name,byId:w.user.id,items:items,note:w.poshOpenNote?w.poshOpenNote():"",at:new Date().toLocaleString(),seen:false,seenBy:""});try{w.save();}catch(e){}try{w.draw();}catch(e){}alert("Opening sent · "+items.length+" ticked");};
document.getElementById("barClose").onclick=function(){var w=win();var items=w.poshCollectClose?w.poshCollectClose():[];if(!items.length){alert("Tick the closing checklist on Desk first.");return;}if(!w.db.fdChecks)w.db.fdChecks=[];w.db.fdChecks.push({id:"fc"+Date.now(),day:w.today(),site:w.user.site,kind:"close",by:w.user.name,byId:w.user.id,items:items,note:w.poshCloseNote?w.poshCloseNote():"",at:new Date().toLocaleString(),seen:false,seenBy:""});try{w.save();}catch(e){}try{w.draw();}catch(e){}alert("Closing sent · "+items.length+" ticked");};
document.getElementById("barAck").onclick=function(){var w=win();(w.db.fdChecks||[]).forEach(function(c){c.seen=true;c.seenBy=w.user.name;});try{w.save();}catch(e){}alert("Acknowledged");};
document.getElementById("barMaint").onclick=function(){var w=win();if(!w||!w.user)return;var room=(openRoom(w)||{}).number||prompt("Room?");if(!room)return;var detail=prompt("Fault?");if(!detail)return;if(!w.db.issues)w.db.issues=[];w.db.issues.push({id:"is"+Date.now(),room:String(room),site:w.user.site,by:w.user.name,detail:String(detail).trim(),fault:String(detail).trim(),status:"received",day:w.today(),at:new Date().toLocaleString()});try{w.save();}catch(e){}alert("Sent to maintenance");};
document.getElementById("barReply").onclick=function(){var w=win();if(!w||!w.db)return;var list=(w.db.salesQueries||[]).filter(function(q){return !w.user.site||!q.site||q.site===w.user.site;});if(!list.length){alert("No sales query yet");return;}var q=list[list.length-1];var text=prompt("Reply on this dialogue","");if(!text)return;if(w.poshContinueQuery)w.poshContinueQuery(q,text,w.user.role==="accountant"?"accountant":"frontdesk");try{w.save();}catch(e){}alert("Reply sent");};
function start(){
  frame=document.createElement("iframe");frame.src="app.html?v="+V;
  frame.onload=function(){
    var w=win();
    loadInto(w,"desk.js").then(function(){return loadInto(w,"minimart.js");}).then(function(){return loadInto(w,"salesq.js");}).then(function(){return loadInto(w,"acctquery.js");}).then(function(){return loadInto(w,"debtbox.js");}).then(function(){return loadInto(w,"fdclock.js");}).then(function(){return loadInto(w,"fdguard.js");}).then(function(){return loadInto(w,"hkfix.js");}).then(function(){return loadInto(w,"hknote.js");}).then(function(){return loadInto(w,"hkresub.js");}).then(function(){return loadInto(w,"clock.js");}).then(function(){return loadInto(w,"loss.js");}).then(function(){return loadInto(w,"fixtures.js");}).then(function(){return loadInto(w,"evidence.js");}).then(function(){return loadInto(w,"wahotel.js");}).then(function(){return loadInto(w,"statuswa.js");}).then(function(){return loadInto(w,"sync.js");}).then(function(){say("33K READY");try{w.draw();}catch(e){}paintBar();}).catch(function(err){say("33K failed: "+err);});
  };
  document.body.appendChild(frame);
}
start();
</script>
</body>
</html>
