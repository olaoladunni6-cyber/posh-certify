<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posh Manager 33F</title>
<style>
html,body{margin:0;height:100%;background:#1c332c;font-family:system-ui}
#bar{padding:10px;font-size:13px;font-weight:700;background:#c4a574;color:#101512}
#msg{display:block;margin-bottom:8px}
#acts button{border:0;border-radius:999px;padding:10px 14px;background:#101512;color:#fff;font-weight:700;margin:0 6px 6px 0}
#vidWrap{display:none;margin-top:6px}#vidWrap.on{display:block}
iframe{position:fixed;left:0;right:0;bottom:0;width:100%;border:0;top:56px;height:calc(100% - 56px)}
iframe.tall{top:168px;height:calc(100% - 168px)}
</style>
</head>
<body>
<div id=bar>
  <span id=msg>POSH MANAGER 33F — loading…</span>
  <div id=acts>
    <button type=button id=barTok>Save token</button>
    <button type=button id=barPub>Publish</button>
    <button type=button id=barPull>Refresh</button>
    <button type=button id=barQuery>Query sales</button>
    <button type=button id=barIn>Clock in</button>
    <button type=button id=barOpen>Submit opening</button>
    <button type=button id=barClose>Submit closing</button>
    <button type=button id=barFolio>Save folio</button>
    <button type=button id=barShift>Submit shift</button>
    <button type=button id=barAck>Acknowledge</button>
    <button type=button id=barCert>Certify room</button>
    <button type=button id=barSvc>Return to service</button>
    <button type=button id=barOOO>Set OOO</button>
    <button type=button id=barFix>Open Fix</button>
    <button type=button id=barMaint>Send to maintenance</button>
    <button type=button id=barSaveCnt>Save counts</button>
    <button type=button id=barLaundry>Send to laundry</button>
    <button type=button id=barSendRoom>Submit room</button>
  </div>
  <div id=vidWrap><input id=barVid type=file accept="video/*,video/mp4" capture="environment"></div>
</div>
<script>
var V="20260901AF"+Date.now(),frame;
var ALL=["barTok","barPub","barPull","barQuery","barIn","barOpen","barClose","barFolio","barShift","barAck","barCert","barSvc","barOOO","barFix","barMaint","barSaveCnt","barLaundry","barSendRoom"];
function win(){return frame&&frame.contentWindow;}
function say(t){document.getElementById("msg").textContent=t;}
function loadInto(w,src){return fetch(src+"?v="+V,{cache:"reload"}).then(function(r){if(!r.ok)throw new Error(src);return r.text();}).then(function(code){var s=w.document.createElement("script");s.text=code;w.document.body.appendChild(s);});}
function show(id,on){var el=document.getElementById(id);if(el)el.style.display=on?"inline-block":"none";}
function val(w,id){var el=w.document.getElementById(id);return el?(el.value||"").trim():"";}
function num(w,id){var n=parseFloat(val(w,id)||"0");return isNaN(n)?0:n;}
function openRoom(w){if(!w||!w.roomId||!w.db)return null;return w.db.rooms.filter(function(x){return x.id===w.roomId;})[0]||null;}
function hkRoom(w){var r=openRoom(w);if(r)return r;return ((w&&w.db&&w.db.rooms||[]).filter(function(x){return w.user&&x.hk===w.user.id&&x.status!=="certified"&&x.status!=="ooo";})[0]||null);}
function hidePageBtns(w){try{var st=w.document.getElementById("hidePageBtns");if(!st){st=w.document.createElement("style");st.id="hidePageBtns";w.document.head.appendChild(st);}st.textContent="#send,#sendL,#lrep,#cert,#rel,#ooo,#saveCin,#submitShift,label.btn{display:none!important}";}catch(e){}}
function nairaTxt(n){return "NGN "+Number(n||0).toLocaleString();}
function querySales(){
  var w=win();if(!w||!w.user)return;
  var today=w.today?w.today():"";
  var from=prompt("From date YYYY-MM-DD",today);if(from===null)return;
  var to=prompt("To date YYYY-MM-DD",from||today);if(to===null)return;
  from=String(from||"").trim();to=String(to||from).trim();
  var rooms=0,mart=0,extras=0,debt=0,paid=0,count=0;
  (w.db.checkins||[]).forEach(function(c){
    if(from&&c.day<from)return;if(to&&c.day>to)return;
    if(w.user.role==="accountant"&&c.site&&c.site!==w.user.site)return;
    count++;rooms+=Number(c.amount||0);var e=c.extras||{};
    mart+=Number(e.minimart||0);extras+=Number(e.early||0)+Number(e.late||0)+Number(e.laundry||0)+Number(e.other||0);debt+=Number(c.debt||0);
  });
  (w.db.debts||[]).forEach(function(d){
    if(w.user.role==="accountant"&&d.site&&d.site!==w.user.site)return;
    (d.payments||[]).forEach(function(p){if((!from||p.day>=from)&&(!to||p.day<=to))paid+=Number(p.amount||0);});
  });
  alert("SALES REPORT\n"+from+" to "+to+"\n\nRoom sales  "+nairaTxt(rooms)+"\nMini mart  "+nairaTxt(mart)+"\nExtras  "+nairaTxt(extras)+"\nTotal billed  "+nairaTxt(rooms+mart+extras)+"\nNew debt  "+nairaTxt(debt)+"\nDebt paid  "+nairaTxt(paid)+"\nFolios  "+count);
}
function paintBar(){
  var w=win(),fr=frame;ALL.forEach(function(id){show(id,false);});document.getElementById("vidWrap").className="";
  if(!w||!w.user){if(fr)fr.className="";return;}hidePageBtns(w);if(fr)fr.className="tall";
  var role=w.user.role,r=openRoom(w);
  if(role==="housekeeper"){show("barSaveCnt",true);show("barLaundry",true);show("barSendRoom",true);show("barFix",true);show("barMaint",true);show("barPub",true);document.getElementById("vidWrap").className="on";say("Housekeeper");return;}
  if(role==="frontdesk"){show("barTok",true);show("barPub",true);show("barPull",true);show("barIn",true);show("barOpen",true);show("barClose",true);show("barFolio",true);show("barShift",true);show("barFix",true);show("barMaint",true);say("Front Desk");return;}
  if(role==="manager"){show("barTok",true);show("barPub",true);show("barPull",true);show("barAck",true);show("barCert",true);show("barSvc",true);show("barOOO",true);show("barFix",true);show("barMaint",true);say(r?("Room "+r.number):"Open a room");return;}
  if(role==="accountant"||role==="ceo"||role==="superadmin"){show("barTok",true);show("barPub",true);show("barPull",true);show("barQuery",true);say("Query sales");return;}
  show("barTok",true);show("barPub",true);show("barPull",true);say(w.user.name);
}
setInterval(paintBar,800);
document.getElementById("barQuery").onclick=querySales;
document.getElementById("barFix").onclick=function(){var w=win();if(!w)return;w.tab="issues";try{w.draw();}catch(e){};};
document.getElementById("barMaint").onclick=function(){var w=win();if(!w||!w.user)return;var r=openRoom(w);var room=r?r.number:prompt("Room number?");if(!room)return;var detail=prompt("What should maintenance do?");if(!detail)return;if(!w.db.issues)w.db.issues=[];w.db.issues.push({id:"is"+Date.now(),room:String(room),site:w.user.site,by:w.user.name,detail:String(detail).trim(),fault:String(detail).trim(),status:"received",day:w.today(),at:new Date().toLocaleString()});try{w.save();}catch(e){}alert("Sent to maintenance");};
document.getElementById("barTok").onclick=function(){var v=prompt("Paste GitHub token");if(!v)return;localStorage.setItem("posh-gh-token",v.trim());var w=win();if(w)try{w.localStorage.setItem("posh-gh-token",v.trim());}catch(e){}alert("Token saved");};
document.getElementById("barPub").onclick=function(){var w=win();if(w&&w.publishHotel)w.publishHotel(function(ok,err){alert(ok?"Published":String(err||"fail"));});};
document.getElementById("barPull").onclick=function(){var w=win();if(w&&w.refreshHotel)w.refreshHotel(function(ok){alert(ok?"Refreshed":"Could not refresh");});};
document.getElementById("barFolio").onclick=function(){var w=win();if(!w||w.user.role!=="frontdesk")return;var name=val(w,"cinName"),room=val(w,"cinRoom");if(!name||!room){alert("Enter guest name and room");return;}if(!w.db.checkins)w.db.checkins=[];w.db.checkins.push({id:"c"+Date.now(),guest:name,room:room,amount:num(w,"cinAmt"),site:w.user.site,by:w.user.name,day:w.today(),at:new Date().toLocaleString()});try{w.save();}catch(e){}alert("Folio saved");};
document.getElementById("barShift").onclick=function(){var w=win();if(!w.db.shiftReports)w.db.shiftReports=[];w.db.shiftReports.push({id:"sh"+Date.now(),day:w.today(),site:w.user.site,by:w.user.name,at:new Date().toLocaleString()});try{w.save();}catch(e){}alert("Shift submitted");};
document.getElementById("barCert").onclick=function(){var w=win(),r=openRoom(w);if(!r){alert("Open the room first");return;}r.status="certified";r.hkNote="";if(w.pingRoomWa)w.pingRoomWa(r.number,"CERTIFIED. Ready to sell");try{w.save();}catch(e){}alert("Certified. WhatsApp sent.");};
document.getElementById("barSvc").onclick=function(){var w=win(),r=openRoom(w);if(!r){alert("Open the room first");return;}var note=prompt("What should the housekeeper do on Room "+r.number+"?","Spring clean and recertify");if(note===null)return;r.status="pending";r.hkNote=String(note).trim();if(w.pingRoomWa)w.pingRoomWa(r.number,"RETURNED TO SERVICE. "+r.hkNote);try{w.save();}catch(e){}alert("Returned to service. WhatsApp sent.");};
document.getElementById("barOOO").onclick=function(){var w=win(),r=openRoom(w);if(!r)return;r.status="ooo";if(w.pingRoomWa)w.pingRoomWa(r.number,"OUT OF ORDER. Do not sell");try{w.save();}catch(e){}alert("OOO. WhatsApp sent.");};
document.getElementById("barVid").onchange=function(){var w=win(),f=this.files&&this.files[0],r=hkRoom(w);if(!r||!f){alert("Open YOUR allocated room first");return;}r.videoReady=true;try{w.save();}catch(e){};};
document.getElementById("barSaveCnt").onclick=function(){var r=hkRoom(win());if(!r)return;r.laundryChecked=true;try{win().save();}catch(e){}alert("Counts saved");};
document.getElementById("barLaundry").onclick=function(){var w=win(),r=hkRoom(w);if(!r)return;if(!w.db.slips)w.db.slips=[];var n=parseInt(prompt("Dirty bags?","1"),10);if(!(n>0))return;w.db.slips.push({id:"s"+Date.now(),room:r.number,site:r.site,by:w.user.name,at:new Date().toLocaleString(),items:{dirty_bag:n},status:"sent",summary:n+" bags"});try{w.save();}catch(e){}alert("Sent to laundry");};
document.getElementById("barSendRoom").onclick=function(){var w=win(),r=hkRoom(w);if(!r){alert("Open YOUR allocated room first");return;}if(!r.videoReady){alert("Attach a new video first");return;}var fix=prompt("What correction did you make?",r.hkNote||"Corrected");if(fix===null)return;r.hkFix=String(fix).trim();r.status="submitted";try{w.save();}catch(e){}alert("Submitted");};
document.getElementById("barIn").onclick=function(){var w=win();if(!w.db.clocks)w.db.clocks=[];w.db.clocks.push({id:"ck"+Date.now(),day:w.today(),site:w.user.site,by:w.user.name,byId:w.user.id,inAt:new Date().toLocaleTimeString(),outAt:""});try{w.save();}catch(e){}alert("Clocked in");};
document.getElementById("barOpen").onclick=function(){var w=win();if(!w.db.fdChecks)w.db.fdChecks=[];w.db.fdChecks.push({id:"fc"+Date.now(),day:w.today(),site:w.user.site,kind:"open",by:w.user.name,byId:w.user.id,items:[],at:new Date().toLocaleString(),seen:false,seenBy:""});try{w.save();}catch(e){}alert("Opening sent");};
document.getElementById("barClose").onclick=function(){var w=win();if(!w.db.fdChecks)w.db.fdChecks=[];w.db.fdChecks.push({id:"fc"+Date.now(),day:w.today(),site:w.user.site,kind:"close",by:w.user.name,byId:w.user.id,items:[],at:new Date().toLocaleString(),seen:false,seenBy:""});try{w.save();}catch(e){}alert("Closing sent");};
document.getElementById("barAck").onclick=function(){var w=win();(w.db.fdChecks||[]).forEach(function(c){c.seen=true;c.seenBy=w.user.name;});try{w.save();}catch(e){}alert("Acknowledged");};
function start(){
  frame=document.createElement("iframe");frame.src="app.html?v="+V;
  frame.onload=function(){
    var w=win();
    loadInto(w,"desk.js").then(function(){return loadInto(w,"acctquery.js");}).then(function(){return loadInto(w,"debtbox.js");}).then(function(){return loadInto(w,"fdclock.js");}).then(function(){return loadInto(w,"fdguard.js");}).then(function(){return loadInto(w,"hkfix.js");}).then(function(){return loadInto(w,"hknote.js");}).then(function(){return loadInto(w,"hkresub.js");}).then(function(){return loadInto(w,"clock.js");}).then(function(){return loadInto(w,"loss.js");}).then(function(){return loadInto(w,"fixtures.js");}).then(function(){return loadInto(w,"evidence.js");}).then(function(){return loadInto(w,"wahotel.js");}).then(function(){return loadInto(w,"statuswa.js");}).then(function(){return loadInto(w,"sync.js");}).then(function(){say("33F READY");try{w.draw();}catch(e){}paintBar();}).catch(function(err){say("33F failed: "+err);});
  };
  document.body.appendChild(frame);
}
start();
</script>
</body>
</html>
