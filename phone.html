<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Posh Manager 32H</title>
<style>
html,body{margin:0;height:100%;background:#1c332c;color:#f4efe6;font-family:system-ui}
#bar{padding:8px 10px;font-size:12px;font-weight:700;background:#c4a574;color:#101512}
#msg{display:block;margin-bottom:6px}
#acts{display:none;gap:6px;flex-wrap:wrap}
#acts.on{display:flex}
#bar button{border:0;border-radius:999px;padding:8px 12px;background:#101512;color:#fff;font-weight:700}
iframe{position:fixed;top:52px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 52px);border:0}
iframe.tall{top:96px;height:calc(100% - 96px)}
</style>
</head>
<body>
<div id=bar>
  <span id=msg>POSH MANAGER 32H — loading…</span>
  <div id=acts>
    <button type=button id=barIn>Clock in</button>
    <button type=button id=barOut>Clock out</button>
  </div>
</div>
<script>
var V="20260831H"+Date.now();
var frame;
function win(){return frame&&frame.contentWindow;}
function say(t){document.getElementById("msg").textContent=t;}
function loadInto(w, src){
  return fetch(src+"?v="+V,{cache:"reload"}).then(function(r){
    if(!r.ok)throw new Error(src+" "+r.status);
    return r.text();
  }).then(function(code){
    var s=w.document.createElement("script");
    s.text=code;
    w.document.body.appendChild(s);
  });
}
function clocked(w){
  if(!w.user||!w.db||!w.db.clocks)return null;
  var day=w.today();
  for(var i=0;i<w.db.clocks.length;i++){
    var c=w.db.clocks[i];
    if(c.day===day&&c.byId===w.user.id&&!c.outAt)return c;
  }
  return null;
}
function paintBar(){
  var w=win();
  var acts=document.getElementById("acts");
  var fr=frame;
  if(!w||!w.user||w.user.role!=="frontdesk"){
    acts.className="";
    if(fr)fr.className="";
    if(w&&w.user)say(w.user.name+" · "+(w.user.site||"")+" · clock is Front Desk only");
    return;
  }
  acts.className="on";
  if(fr)fr.className="tall";
  var site=w.user.site||"your site";
  var c=clocked(w);
  document.getElementById("barIn").textContent="Clock in · "+site;
  document.getElementById("barOut").textContent="Clock out · "+site;
  say(c?("On duty · "+site+" · "+c.inAt):("Front Desk · "+site+" · not clocked in"));
}
document.getElementById("barIn").onclick=function(){
  var w=win();
  if(!w||!w.user||w.user.role!=="frontdesk"){alert("Only the Front Desk login for this hotel can clock in.");return;}
  if(clocked(w)){alert("Already on duty at "+w.user.site+" since "+clocked(w).inAt);return;}
  if(!w.db.clocks)w.db.clocks=[];
  var now=new Date().toLocaleTimeString();
  w.db.clocks.push({id:"ck"+Date.now(),day:w.today(),site:w.user.site||w.workSite(),by:w.user.name,byId:w.user.id,shift:w.user.shift||"",inAt:now,outAt:""});
  try{w.save();}catch(e){}
  w.__poshForceDraw=true;w.__poshTyping=0;
  try{w.draw();}catch(e){}
  paintBar();
  alert("Clocked in at "+w.user.site+" \n"+now);
};
document.getElementById("barOut").onclick=function(){
  var w=win();
  if(!w||!w.user||w.user.role!=="frontdesk"){alert("Only Front Desk can clock out.");return;}
  var c=clocked(w);
  if(!c){alert("You are not clocked in");return;}
  c.outAt=new Date().toLocaleTimeString();
  try{w.save();}catch(e){}
  w.__poshForceDraw=true;w.__poshTyping=0;
  try{w.draw();}catch(e){}
  paintBar();
  alert("Clocked out at "+w.user.site+" \n"+c.outAt);
};
function start(){
  frame=document.createElement("iframe");
  frame.setAttribute("allow","notifications; camera; microphone");
  frame.src="app.html?v="+V;
  frame.onload=function(){
    var w=win();
    if(!w){say("32H failed to open app");return;}
    loadInto(w,"desk.js")
      .then(function(){return loadInto(w,"fdclock.js");})
      .then(function(){return loadInto(w,"clock.js");})
      .then(function(){return loadInto(w,"loss.js");})
      .then(function(){return loadInto(w,"fixtures.js");})
      .then(function(){return loadInto(w,"evidence.js");})
      .then(function(){return loadInto(w,"sync.js");})
      .then(function(){
        say("32H READY");
        try{if(w.draw)w.draw();}catch(e){}
        paintBar();
      }).catch(function(err){say("32H failed: "+err);});
  };
  document.body.appendChild(frame);
}
setInterval(paintBar,1000);
if(navigator.serviceWorker){
  navigator.serviceWorker.getRegistrations().then(function(list){
    return Promise.all(list.map(function(r){return r.unregister();}));
  }).then(start).catch(start);
}else start();
</script>
</body>
</html>
