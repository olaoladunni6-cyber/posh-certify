<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Posh Manager 32R</title>
<style>
html,body{margin:0;height:100%;background:#1c332c;font-family:system-ui}
#bar{padding:10px;font-size:13px;font-weight:700;background:#c4a574;color:#101512}
#msg{display:block;margin-bottom:8px}
#acts button{border:0;border-radius:999px;padding:10px 14px;background:#101512;color:#fff;font-weight:700;margin:0 6px 6px 0}
#vidWrap{display:none;margin-top:6px}
#vidWrap.on{display:block}
iframe{position:fixed;left:0;right:0;bottom:0;width:100%;border:0;top:56px;height:calc(100% - 56px)}
iframe.tall{top:168px;height:calc(100% - 168px)}
</style>
</head>
<body>
<div id=bar>
  <span id=msg>POSH MANAGER 32R — loading…</span>
  <div id=acts>
    <button type=button id=barTok>Save token</button>
    <button type=button id=barPub>Publish</button>
    <button type=button id=barPull>Refresh</button>
    <button type=button id=barIn>Clock in</button>
    <button type=button id=barOpen>Submit opening</button>
    <button type=button id=barClose>Submit closing</button>
    <button type=button id=barAck>Acknowledge</button>
    <button type=button id=barSaveCnt>Save counts</button>
    <button type=button id=barLaundry>Send to laundry</button>
    <button type=button id=barSendRoom>Submit room</button>
  </div>
  <div id=vidWrap><input id=barVid type=file accept="video/*,video/mp4" capture="environment"></div>
</div>
<script>
var V="20260831R"+Date.now(),frame;
function win(){return frame&&frame.contentWindow;}
function say(t){document.getElementById("msg").textContent=t;}
function loadInto(w,src){return fetch(src+"?v="+V,{cache:"reload"}).then(function(r){if(!r.ok)throw new Error(src);return r.text();}).then(function(code){var s=w.document.createElement("script");s.text=code;w.document.body.appendChild(s);});}
function show(id,on){var el=document.getElementById(id);if(el)el.style.display=on?"inline-block":"none";}
function hkRoom(w){
  if(!w||!w.user||!w.db)return null;
  if(w.roomId){var r=w.db.rooms.filter(function(x){return x.id===w.roomId;})[0];if(r)return r;}
  return (w.db.rooms||[]).filter(function(x){return x.hk===w.user.id&&x.job&&x.status!=="certified"&&x.status!=="ooo";})[0]||null;
}
function hasVid(r){return !!(r&&(r.videoReady||r.video||(r.photos&&r.photos.Walkthrough)));}
function hidePageBtns(w){
  try{
    var st=w.document.getElementById("hidePageBtns");
    if(!st){st=w.document.createElement("style");st.id="hidePageBtns";w.document.head.appendChild(st);}
    st.textContent="#send,#sendL,#lrep,#cert,#saveCin,#submitShift,label.btn{display:none!important}";
  }catch(e){}
}
function paintBar(){
  var w=win(),fr=frame;
  ["barTok","barPub","barPull","barIn","barOpen","barClose","barAck","barSaveCnt","barLaundry","barSendRoom"].forEach(function(id){show(id,false);});
  document.getElementById("vidWrap").className="";
  if(!w||!w.user){if(fr)fr.className="";return;}
  hidePageBtns(w);
  if(fr)fr.className="tall";
  var role=w.user.role,site=w.user.site||"";
  if(role==="housekeeper"){
    show("barSaveCnt",true);show("barLaundry",true);show("barSendRoom",true);show("barPub",true);
    document.getElementById("vidWrap").className="on";
    var r=hkRoom(w);
    say(r?("Room "+r.number+(hasVid(r)?" · video on file":" · choose video below")):"Open your room, then choose video below");
    return;
  }
  if(role==="frontdesk"){show("barTok",true);show("barPub",true);show("barPull",true);show("barIn",true);show("barOpen",true);show("barClose",true);say("Front Desk · "+site);return;}
  if(role==="manager"){show("barTok",true);show("barPub",true);show("barPull",true);show("barAck",true);say("Duty manager · "+site);return;}
  show("barTok",true);show("barPub",true);show("barPull",true);say(w.user.name+" · "+site);
}
setInterval(paintBar,800);
document.getElementById("barTok").onclick=function(){var v=prompt("Paste GitHub token");if(!v)return;localStorage.setItem("posh-gh-token",v.trim());var w=win();if(w)try{w.localStorage.setItem("posh-gh-token",v.trim());}catch(e){}alert("Token saved");};
document.getElementById("barPub").onclick=function(){var w=win();if(w&&w.publishHotel)w.publishHotel(function(ok,err){alert(ok?"Published":String(err||"fail"));});};
document.getElementById("barPull").onclick=function(){var w=win();if(w&&w.refreshHotel)w.refreshHotel(function(ok){alert(ok?"Refreshed":"Could not refresh");});};
document.getElementById("barVid").onchange=function(){
  var w=win(),f=this.files&&this.files[0],r=hkRoom(w);
  if(!r){alert("Tap the allocated room first");return;}if(!f)return;
  r.videoReady=true;r.videoName=f.name||"walkthrough";r.videoAt=new Date().toLocaleString();
  w.roomId=r.id;
  if(f.size>8000000){try{w.save();}catch(e){}alert("Video marked on Room "+r.number+" (clip kept on this phone only, file was large)");paintBar();return;}
  var rd=new FileReader();
  rd.onload=function(){r.video=rd.result;if(!r.photos)r.photos={};r.photos.Walkthrough=rd.result;try{w.save();}catch(e){}alert("Video attached to Room "+r.number);paintBar();};
  rd.onerror=function(){try{w.save();}catch(e){}alert("Video marked on Room "+r.number);};
  rd.readAsDataURL(f);
};
document.getElementById("barSaveCnt").onclick=function(){var w=win(),r=hkRoom(w);if(!r){alert("Open the room first");return;}r.laundryChecked=true;try{w.save();}catch(e){}alert("Counts saved for Room "+r.number);};
document.getElementById("barLaundry").onclick=function(){
  var w=win(),r=hkRoom(w);
  if(!r){alert("Open the room first");return;}
  if(!w.db.slips)w.db.slips=[];
  var items={};
  w.document.querySelectorAll(".sq").forEach(function(inp){var n=parseInt(inp.value,10);if(n>0)items[inp.getAttribute("data-item")]=n;});
  if(!Object.keys(items).length){
    var raw=prompt("How many dirty bags / towels are you sending to laundry?", "1");
    var n=parseInt(raw,10);if(!(n>0)){alert("Enter a quantity");return;}
    items.dirty_bag=n;
  }
  var summary=Object.keys(items).map(function(k){return items[k]+" x "+(typeof w.itemName==="function"?w.itemName(k):k);}).join(", ");
  w.db.slips.push({id:"s"+Date.now(),room:r.number,site:r.site||w.user.site,by:w.user.name,at:new Date().toLocaleString(),items:items,status:"sent",summary:summary});
  try{w.save();}catch(e){}
  alert("Sent to laundry from Room "+r.number+"\n"+summary);
};
document.getElementById("barSendRoom").onclick=function(){
  var w=win(),r=hkRoom(w);
  if(!r){alert("Open the room first");return;}
  if(!hasVid(r)){alert("Choose the video file first");return;}
  r.videoReady=true;r.laundryChecked=true;r.status="submitted";
  try{w.save();}catch(e){}
  if(w.publishHotel)w.publishHotel(function(){});
  alert("Room "+r.number+" submitted with video on file");
};
document.getElementById("barIn").onclick=function(){var w=win();if(!w||w.user.role!=="frontdesk")return;if(!w.db.clocks)w.db.clocks=[];w.db.clocks.push({id:"ck"+Date.now(),day:w.today(),site:w.user.site,by:w.user.name,byId:w.user.id,inAt:new Date().toLocaleTimeString(),outAt:""});try{w.save();}catch(e){}alert("Clocked in");};
document.getElementById("barOpen").onclick=function(){var w=win();if(!w.db.fdChecks)w.db.fdChecks=[];w.db.fdChecks.push({id:"fc"+Date.now(),day:w.today(),site:w.user.site,kind:"open",by:w.user.name,byId:w.user.id,items:[],at:new Date().toLocaleString(),seen:false,seenBy:""});try{w.save();}catch(e){}alert("Opening sent");};
document.getElementById("barClose").onclick=function(){var w=win();if(!w.db.fdChecks)w.db.fdChecks=[];w.db.fdChecks.push({id:"fc"+Date.now(),day:w.today(),site:w.user.site,kind:"close",by:w.user.name,byId:w.user.id,items:[],at:new Date().toLocaleString(),seen:false,seenBy:""});try{w.save();}catch(e){}alert("Closing sent");};
document.getElementById("barAck").onclick=function(){var w=win();(w.db.fdChecks||[]).forEach(function(c){if(c.site===w.user.site){c.seen=true;c.seenBy=w.user.name;}});try{w.save();}catch(e){}alert("Acknowledged");};
function start(){
  frame=document.createElement("iframe");frame.setAttribute("allow","camera; microphone");frame.src="app.html?v="+V;
  frame.onload=function(){
    var w=win();
    loadInto(w,"desk.js").then(function(){return loadInto(w,"fdclock.js");}).then(function(){return loadInto(w,"clock.js");}).then(function(){return loadInto(w,"loss.js");}).then(function(){return loadInto(w,"fixtures.js");}).then(function(){return loadInto(w,"evidence.js");}).then(function(){return loadInto(w,"sync.js");}).then(function(){say("32R READY");try{w.draw();}catch(e){}paintBar();}).catch(function(err){say("32R failed: "+err);});
  };
  document.body.appendChild(frame);
}
start();
</script>
</body>
</html>
