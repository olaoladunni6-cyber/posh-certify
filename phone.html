<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>Posh Manager Phone</title>
<style>html,body{margin:0;height:100%;background:#1c332c;color:#f4efe6;font-family:system-ui}#bar{padding:10px 14px;font-size:13px}iframe{position:fixed;top:36px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 36px);border:0}</style>
</head>
<body>
<div id=bar>Posh Manager phone build 31P — loading modules…</div>
<script>
var V="31P"+Date.now();
function loadInto(win, src){
  return fetch(src+"?v="+V,{cache:"reload"}).then(function(r){return r.text();}).then(function(code){
    var s=win.document.createElement("script");
    s.text=code;
    win.document.body.appendChild(s);
  });
}
function start(){
  var f=document.createElement("iframe");
  f.src="app.html?v="+V;
  f.onload=function(){
    var win=f.contentWindow;
    if(!win||!win.document){document.getElementById("bar").textContent="Phone could not open the app.";return;}
    loadInto(win,"desk.js").then(function(){return loadInto(win,"loss.js");}).then(function(){return loadInto(win,"fixtures.js");}).then(function(){
      document.getElementById("bar").textContent="Posh Manager phone build 31P — ready. Staff use this page.";
      try{if(win.draw)win.draw();}catch(e){}
    }).catch(function(err){
      document.getElementById("bar").textContent="Module load failed: "+err;
    });
  };
  document.body.appendChild(f);
}
if(navigator.serviceWorker){
  navigator.serviceWorker.getRegistrations().then(function(list){
    return Promise.all(list.map(function(r){return r.unregister();}));
  }).then(start).catch(start);
}else start();
</script>
</body>
</html>
