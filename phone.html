<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posh Manager</title>
<style>
html,body{margin:0;background:#1c332c;font-family:system-ui}
#bar{position:sticky;top:0;z-index:20;padding:10px;font-size:13px;font-weight:700;background:#c4a574;color:#101512}
#msg{display:block;margin-bottom:8px;white-space:pre-wrap}
#acts a.gbtn{display:inline-block;touch-action:manipulation;border:0;border-radius:999px;padding:10px 14px;background:#101512;color:#fff;font-weight:700;margin:0 6px 6px 0;text-decoration:none}
iframe{display:block;width:100%;border:0;min-height:70vh;height:70vh;background:#fff}
</style>
</head>
<body>
<div id=bar>
  <span id=msg>POSH MANAGER</span>
  <div id=acts>
    <a class=gbtn href="#do-barTok" id=barTok>Save token</a>
    <a class=gbtn href="#do-barPub" id=barPub>Publish</a>
    <a class=gbtn href="#do-barPull" id=barPull>Refresh</a>
    <a class=gbtn href="#do-barAlert" id=barAlert>Allow phone alerts</a>
    <a class=gbtn href="#do-barInstall" id=barInstall>Install app</a>
    <a class=gbtn href="#do-navRooms" id=navRooms>Rooms</a>
    <a class=gbtn href="#do-navDesk" id=navDesk>Desk</a>
    <a class=gbtn href="#do-navStaff" id=navStaff>Staff</a>
    <a class=gbtn href="#do-navMeals" id=navMeals>Meals</a>
    <a class=gbtn href="#do-navMe" id=navMe>Me</a>
    <a class=gbtn href="#do-barChat" id=barChat>Staff chat</a>
  </div>
</div>
<script>
var V="20260904H"+Date.now(),frame;
var FILES=["desk.js","minimart.js","salesq.js","acctquery.js","debtbox.js","fdclock.js","fdguard.js","hkfix.js","hknote.js","hkresub.js","clock.js","loss.js","fixtures.js","evidence.js","wahotel.js","statuswa.js","sync.js","martfix.js","dashfix.js","chat.js","alerts.js","hkflow.js","tapfix.js","submitfix.js","lockgate.js","roleview.js"];
function win(){return frame&&frame.contentWindow;}
function say(t){document.getElementById("msg").textContent=t;}
function fitFrame(){if(!frame)return;var h=Math.max((window.innerHeight||700)-((document.getElementById("bar")||{}).offsetHeight||120)-12,520);frame.style.height=h+"px";}
function loadInto(w,src){return fetch(src+"?v="+V,{cache:"reload"}).then(function(r){return r.text();}).then(function(code){try{w.eval(code);}catch(e){say(src+":"+e);}});}
function goTab(name){
  var w=win();if(!w||!w.user){alert("Sign in first");return;}
  if(w.user.role==="housekeeper"&&(name==="meals"||name==="desk"))name="rooms";
  w.tab=name;w.roomId=null;try{w.draw();}catch(e){alert(String(e));}
}
document.getElementById("navRooms").onclick=function(){goTab("rooms");};
document.getElementById("navDesk").onclick=function(){goTab("desk");};
document.getElementById("navStaff").onclick=function(){goTab("staff");};
document.getElementById("navMeals").onclick=function(){goTab("meals");};
document.getElementById("navMe").onclick=function(){goTab("me");};
document.getElementById("barTok").onclick=function(){var v=prompt("Paste GitHub token");if(!v)return;localStorage.setItem("posh-gh-token",v.trim());};
document.getElementById("barPub").onclick=function(){var w=win();if(w&&w.publishHotel)w.publishHotel(function(ok,err){alert(ok?"Published":String(err||"fail"));});};
document.getElementById("barPull").onclick=function(){var w=win();if(w&&w.refreshHotel)w.refreshHotel(function(ok){alert(ok?"Refreshed":"Could not refresh");});};
document.getElementById("barAlert").onclick=function(){Notification.requestPermission();};
document.getElementById("barInstall").onclick=function(){alert("Safari: Share then Add to Home Screen. Android Chrome: Install app.");};
document.getElementById("barChat").onclick=function(){var w=win();if(w&&w.poshChatPrompt)w.poshChatPrompt();else alert("Sign in first");};
function start(){
  frame=document.createElement("iframe");
  frame.src="app.html?v="+V;
  frame.onload=function(){
    var w=win(),chain=Promise.resolve();
    FILES.forEach(function(src){chain=chain.then(function(){return loadInto(w,src);});});
    chain.then(function(){say("READY");try{w.draw();}catch(e){say("draw "+e);}fitFrame();});
  };
  document.body.appendChild(frame);
}
start();
</script>
</body>
</html>
