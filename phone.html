<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posh Manager 32W</title>
<style>
html,body{margin:0;height:100%;background:#1c332c;font-family:system-ui}
#bar{padding:10px;font-size:13px;font-weight:700;background:#c4a574;color:#101512}
#msg{display:block;margin-bottom:8px}
#acts button{border:0;border-radius:999px;padding:10px 14px;background:#101512;color:#fff;font-weight:700;margin:0 6px 6px 0}
#vidWrap{display:none;margin-top:6px}#vidWrap.on{display:block}
iframe{position:fixed;left:0;right:0;bottom:0;width:100%;border:0;top:56px;height:calc(100% - 56px)}
iframe.tall{top:168px;height:calc(100% - 168px)}
</style>
</head>
<body>
<div id=bar>
  <span id=msg>POSH MANAGER 32W — loading…</span>
  <div id=acts>
    <button type=button id=barTok>Save token</button>
    <button type=button id=barPub>Publish</button>
    <button type=button id=barPull>Refresh</button>
    <button type=button id=barIn>Clock in</button>
    <button type=button id=barOpen>Submit opening</button>
    <button type=button id=barClose>Submit closing</button>
    <button type=button id=barFolio>Save folio</button>
    <button type=button id=barShift>Submit shift</button>
    <button type=button id=barAck>Acknowledge</button>
    <button type=button id=barCert>Certify room</button>
    <button type=button id=barSvc>Return to service</button>
    <button type=button id=barOOO>Set OOO</button>
    <button type=button id=barMaint>Send to maintenance</button>
    <button type=button id=barSaveCnt>Save counts</button>
    <button type=button id=barLaundry>Send to laundry</button>
    <button type=button id=barSendRoom>Submit room</button>
  </div>
  <div id=vidWrap><input id=barVid type=file accept="video/*,video/mp4" capture="environment"></div>
</div>
<script>
var V="20260831W"+Date.now(),frame;
var ALL=["barTok","barPub","barPull","barIn","barOpen","barClose","barFolio","barShift","barAck","barCert","barSvc","barOOO","barMaint","barSaveCnt","barLaundry","barSendRoom"];
function win(){return frame&&frame.contentWindow;}
function say(t){document.getElementById("msg").textContent=t;}
function loadInto(w,src){return fetch(src+"?v="+V,{cache:"reload"}).then(function(r){if(!r.ok)throw new Error(src);return r.text();}).then(function(code){var s=w.document.createElement("script");s.text=code;w.document.body.appendChild(s);});}
function show(id,on){var el=document.getElementById(id);if(el)el.style.display=on?"inline-block":"none";}
function val(w,id){var el=w.document.getElementById(id);return el?(el.value||"").trim():"";}
function num(w,id){var n=parseFloat(val(w,id)||"0");return isNaN(n)?0:n;}
function openRoom(w){if(!w||!w.roomId||!w.db)return null;return w.db.rooms.filter(function(x){return x.id===w.roomId;})[0]||null;}
function hkRoom(w){return openRoom(w)||((w&&w.db&&w.db.rooms||[]).filter(function(x){return w.user&&x.hk===w.user.id&&x.job&&x.status!=="certified";})[0]||null);}
function pingDesk(w,room,kind){if(!w.db.deskNotes)w.db.deskNotes=[];w.db.deskNotes.push({id:"n"+Date.now(),room:room,kind:kind,site:w.user.site,at:new Date().toLocaleString()});}
function hidePageBtns(w){try{var st=w.document.getElementById("hidePageBtns");if(!st){st=w.document.createElement("style");st.id="hidePageBtns";w.document.head.appendChild(st);}st.textContent="#send,#sendL,#lrep,#cert,#rel,#ooo,#saveCin,#submitShift,label.btn{display:none!important}";}catch(e){}}
function paintBar(){
  var w=win(),fr=frame;ALL.forEach(function(id){show(id,false);});document.getElementById("vidWrap").className="";
  if(!w||!w.user){if(fr)fr.className="";return;}hidePageBtns(w);if(fr)fr.className="tall";
  var role=w.user.role,r=openRoom(w);
  if(role==="housekeeper"){show("barSaveCnt",true);show("barLaundry",true);show("barSendRoom",true);show("barMaint",true);show("barPub",true);document.getElementById("vidWrap").className="on";say("Housekeeper");return;}
  if(role==="frontdesk"){show("barTok",true);show("barPub",true);show("barPull",true);show("barIn",true);show("barOpen",true);show("barClose",true);show("barFolio",true);show("barShift",true);show("barMaint",true);say("Front Desk");return;}
  if(role==="manager"){show("barTok",true);show("barPub",true);show("barPull",true);show("barAck",true);show("barCert",true);show("barSvc",true);show("barOOO",true);show("barMaint",true);say(r?("Room "+r.number):"Open a room");return;}
  if(role==="ceo"){show("barTok",true);show("barPub",true);show("barPull",true);show("barMaint",true);say(w.user.name);return;}
  show("barTok",true);show("barPub",true);show("barPull",true);say(w.user.name);
}
setInterval(paintBar,800);
function sendMaint(){
  var w=win();if(!w||!w.user)return;
  var r=openRoom(w);
  var room=r?r.number:prompt("Room number for maintenance?");
  if(!room)return;
  var detail=prompt("What should maintenance do on Room "+room+"?");
  if(detail===null||!String(detail).trim())return;
  if(!w.db.issues)w.db.issues=[];
  var due=new Date();due.setHours(due.getHours()+6);
  w.db.issues.push({id:"is"+Date.now(),room:String(room),site:w.user.site,by:w.user.name,byId:w.user.id,detail:String(detail).trim(),status:"received",stage:"received",deadline:due.toLocaleString(),day:w.today(),at:new Date().toLocaleString()});
  pingDesk(w,room,"MAINTENANCE: "+detail);
  try{w.save();}catch(e){}
  if(w.publishHotel)w.publishHotel(function(){});
  alert("Sent to maintenance\nRoom "+room+"\n"+detail);
}
document.getElementById("barMaint").onclick=sendMaint;
document.getElementById("barTok").onclick=function(){var v=prompt("Paste GitHub token");if(!v)return;localStorage.setItem("posh-gh-token",v.trim());var w=win();if(w)try{w.localStorage.setItem("posh-gh-token",v.trim());}catch(e){}alert("Token saved");};
document.getElementById("barPub").onclick=function(){var w=win();if(w&&w.publishHotel)w.publishHotel(function(ok,err){alert(ok?"Published":String(err||"fail"));});};
document.getElementById("barPull").onclick=function(){var w=win();if(w&&w.refreshHotel)w.refreshHotel(function(ok){alert(ok?"Refreshed":"Could not refresh");});};
document.getElementById("barFolio").onclick=function(){
  var w=win();if(!w||w.user.role!=="frontdesk")return;
  var name=val(w,"cinName"),room=val(w,"cinRoom"),amount=num(w,"cinAmt"),debt=num(w,"cinDebt"),paid=num(w,"cinPaid");
  if(!name||!room){alert("Enter guest name and room on Desk first");return;}
  var hit=(w.db.rooms||[]).filter(function(r){return String(r.number)===String(room)&&r.site===w.user.site;})[0];
  if(!hit||hit.status!=="certified"){alert("Room "+room+" is not certified.");return;}
  if(!w.db.checkins)w.db.checkins=[];if(!w.db.debts)w.db.debts=[];
  w.db.checkins.push({id:"c"+Date.now(),guest:name,room:room,amount:amount,debt:debt,debtNote:val(w,"cinDebtNote"),paidToday:paid,site:w.user.site,by:w.user.name,byId:w.user.id,day:w.today(),at:new Date().toLocaleString()});
  if(debt>0)w.db.debts.push({id:"db"+Date.now(),guest:name,room:room,site:w.user.site,amount:debt,remaining:debt,note:val(w,"cinDebtNote"),by:w.user.name,day:w.today(),at:new Date().toLocaleString(),payments:[]});
  if(paid>0&&typeof w.applyDebtPaidToday==="function")w.applyDebtPaidToday(paid,val(w,"cinPaidNote"),name,room);
  try{w.save();}catch(e){}alert("Folio saved");
};
document.getElementById("barShift").onclick=function(){var w=win();if(!w.db.shiftReports)w.db.shiftReports=[];w.db.shiftReports.push({id:"sh"+Date.now(),day:w.today(),site:w.user.site,by:w.user.name,at:new Date().toLocaleString()});try{w.save();}catch(e){}alert("Shift submitted");};
document.getElementById("barCert").onclick=function(){var w=win(),r=openRoom(w);if(!r){alert("Open the room first");return;}r.status="certified";r.hkNote="";pingDesk(w,r.number,"CERTIFIED");try{w.save();}catch(e){}alert("Certified");};
document.getElementById("barSvc").onclick=function(){var w=win(),r=openRoom(w);if(!r)return;var note=prompt("What should the housekeeper do on Room "+r.number+"?","Spring clean and recertify");if(note===null)return;r.status="pending";r.hkNote=String(note).trim();r.hkNoteBy=w.user.name;r.hkNoteAt=new Date().toLocaleString();try{w.save();}catch(e){}alert("Returned to service");};
document.getElementById("barOOO").onclick=function(){var w=win(),r=openRoom(w);if(!r)return;r.status="ooo";pingDesk(w,r.number,"OUT OF ORDER");try{w.save();}catch(e){}alert("OOO");};
document.getElementById("barVid").onchange=function(){var w=win(),f=this.files&&this.files[0],r=hkRoom(w);if(!r||!f)return;r.videoReady=true;var rd=new FileReader();rd.onload=function(){r.video=rd.result;try{w.save();}catch(e){}alert("Video attached");};rd.readAsDataURL(f);};
document.getElementById("barSaveCnt").onclick=function(){var r=hkRoom(win());if(!r)return;r.laundryChecked=true;try{win().save();}catch(e){}alert("Counts saved");};
document.getElementById("barLaundry").onclick=function(){var w=win(),r=hkRoom(w);if(!r)return;if(!w.db.slips)w.db.slips=[];var n=parseInt(prompt("Dirty bags?","1"),10);if(!(n>0))return;w.db.slips.push({id:"s"+Date.now(),room:r.number,site:r.site,by:w.user.name,at:new Date().toLocaleString(),items:{dirty_bag:n},status:"sent",summary:n+" bags"});try{w.save();}catch(e){}alert("Sent to laundry");};
document.getElementById("barSendRoom").onclick=function(){var r=hkRoom(win());if(!r)return;r.status="submitted";r.videoReady=true;try{win().save();}catch(e){}alert("Submitted");};
document.getElementById("barIn").onclick=function(){var w=win();if(!w.db.clocks)w.db.clocks=[];w.db.clocks.push({id:"ck"+Date.now(),day:w.today(),site:w.user.site,by:w.user.name,byId:w.user.id,inAt:new Date().toLocaleTimeString(),outAt:""});try{w.save();}catch(e){}alert("Clocked in");};
document.getElementById("barOpen").onclick=function(){var w=win();if(!w.db.fdChecks)w.db.fdChecks=[];w.db.fdChecks.push({id:"fc"+Date.now(),day:w.today(),site:w.user.site,kind:"open",by:w.user.name,byId:w.user.id,items:[],at:new Date().toLocaleString(),seen:false,seenBy:""});try{w.save();}catch(e){}alert("Opening sent");};
document.getElementById("barClose").onclick=function(){var w=win();if(!w.db.fdChecks)w.db.fdChecks=[];w.db.fdChecks.push({id:"fc"+Date.now(),day:w.today(),site:w.user.site,kind:"close",by:w.user.name,byId:w.user.id,items:[],at:new Date().toLocaleString(),seen:false,seenBy:""});try{w.save();}catch(e){}alert("Closing sent");};
document.getElementById("barAck").onclick=function(){var w=win();(w.db.fdChecks||[]).forEach(function(c){c.seen=true;c.seenBy=w.user.name;});try{w.save();}catch(e){}alert("Acknowledged");};
function start(){
  frame=document.createElement("iframe");frame.src="app.html?v="+V;
  frame.onload=function(){
    var w=win();
    loadInto(w,"desk.js").then(function(){return loadInto(w,"debtbox.js");}).then(function(){return loadInto(w,"fdclock.js");}).then(function(){return loadInto(w,"fdguard.js");}).then(function(){return loadInto(w,"hknote.js");}).then(function(){return loadInto(w,"clock.js");}).then(function(){return loadInto(w,"loss.js");}).then(function(){return loadInto(w,"fixtures.js");}).then(function(){return loadInto(w,"evidence.js");}).then(function(){return loadInto(w,"sync.js");}).then(function(){say("32W READY");try{w.draw();}catch(e){}paintBar();}).catch(function(err){say("32W failed: "+err);});
  };
  document.body.appendChild(frame);
}
start();
</script>
</body>
</html>
