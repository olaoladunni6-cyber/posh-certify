<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posh Manager</title>
</head>
<body style="margin:0;font-family:system-ui;background:#1c332c;color:#f4efe6;padding:24px">
<p>Opening Posh Manager…</p>
<script>
var V="20260830g";
fetch("app.html?v="+V,{cache:"no-store"}).then(function(r){
  if(!r.ok)throw new Error(r.status);
  return r.text();
}).then(function(html){
  document.open();
  document.write(html);
  document.close();
  var s=document.createElement("script");
  s.src="desk.js?v="+V;
  document.documentElement.appendChild(s);
}).catch(function(){
  document.body.innerHTML="<p>Could not load. Open this instead:</p><p><a href='app.html' style='color:#c4a574'>app.html</a></p>";
});
</script>
</body>
</html>
