<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Posh Manager</title>
</head>
<body style="margin:0;font-family:system-ui;background:#1c332c;color:#f4efe6;padding:24px">
<p>Opening Posh Manager…</p>
<script>
var V="20260831A";
function addScript(src,next){
  var s=document.createElement("script");
  s.src=src+"?v="+V;
  s.onload=next||function(){};
  s.onerror=next||function(){};
  document.documentElement.appendChild(s);
}
fetch("app.html?v="+V,{cache:"no-store"}).then(function(r){
  if(!r.ok)throw new Error(r.status);
  return r.text();
}).then(function(html){
  document.open();
  document.write(html);
  document.close();
  addScript("desk.js",function(){addScript("loss.js",function(){addScript("fixtures.js");});});
}).catch(function(){
  document.body.innerHTML="<p>Could not load. <a href='app.html' style='color:#c4a574'>Open app.html</a></p>";
});
</script>
</body>
</html>
