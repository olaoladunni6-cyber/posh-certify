<!DOCTYPE html>
<html lang="en-NG">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posh Manager</title>
</head>
<body style="margin:0;font-family:system-ui;background:#1c332c;color:#f4efe6;padding:24px">
<p>Opening Posh Manager…</p>
<script>
fetch("app.html").then(function(r){return r.text();}).then(function(html){
  document.open();
  document.write(html.replace("</body>","<script src=\"desk.js\"><\/script></body>"));
  document.close();
}).catch(function(){
  document.body.innerHTML="<p>Could not load. <a href='run.html' style='color:#c4a574'>Retry</a></p>";
});
</script>
</body>
</html>
