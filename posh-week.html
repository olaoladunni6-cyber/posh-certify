<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posh Manager Week</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#1c332c}
#top{position:sticky;top:0;z-index:20;background:#101512;color:#f3e6c5;padding:10px}
#nav{display:flex;flex-wrap:wrap;gap:6px}#nav button,.btn{border:0;border-radius:999px;padding:10px 12px;font-weight:800;background:#c4a574;min-height:42px}
.btn.bad{background:#8b2e2e;color:#fff}#app{max-width:560px;margin:0 auto;padding:12px}
.card,.login{background:#fff;border-radius:14px;padding:12px;margin:0 0 10px}
input,select,textarea{width:100%;margin:4px 0 8px;padding:10px;border:1px solid #ccc;border-radius:10px}
.ok{background:#e7f4ea;padding:8px;border-radius:10px;margin:0 0 8px}.warn{background:#f8e7c8;padding:8px;border-radius:10px;margin:0 0 8px}
</style></head><body>
<div id=top><b id=who>Posh Manager Week</b><div id=nav></div></div>
<div id=app></div>
<script>
var KEY="posh-week-v3",TAB="rooms",ROOM=null,USER=null,DB=null;
var SITES=["Ikeja","Victoria Island"],JOBS=["checkout","inhouse","postmaint","spring"];
function uid(p){return p+Date.now()}function today(){return new Date().toLocaleDateString("en-CA")}function now(){return new Date().toLocaleString()}function naira(n){return "NGN "+Number(n||0).toLocaleString()}function group(){return USER&&(USER.role==="superadmin"||USER.role==="ceo")}function siteOk(s){return !USER||group()||!s||s===USER.site}function role(){return USER?USER.role:""}function toast(m){alert(m)}
function seed(){return [
 {id:"admin",name:"Super Admin",role:"superadmin",site:"All locations",pin:"9090"},
 {id:"dunni",name:"Oladunni Olayanju",role:"ceo",site:"All locations",pin:"2026"},
 {id:"sophia",name:"Emmanuel Okeleke",role:"manager",site:"Ikeja",pin:"2401"},
 {id:"kemi",name:"Funmi Ogunnupe",role:"manager",site:"Victoria Island",pin:"2402"},
 {id:"blessing",name:"Blessing Okoro",role:"housekeeper",site:"Ikeja",pin:"4412"},
 {id:"tunde",name:"Tunde Balogun",role:"housekeeper",site:"Victoria Island",pin:"5508"},
 {id:"deska",name:"Collins",role:"frontdesk",site:"Ikeja",pin:"1101"},
 {id:"deskb",name:"Front Desk Ikeja B",role:"frontdesk",site:"Ikeja",pin:"1102"},
 {id:"deskvia",name:"Front Desk VI A",role:"frontdesk",site:"Victoria Island",pin:"1103"},
 {id:"deskvib",name:"Front Desk VI B",role:"frontdesk",site:"Victoria Island",pin:"1104"},
 {id:"maint",name:"Ibrahim Musa",role:"maint",site:"Ikeja",pin:"3300"},
 {id:"chinedu",name:"Chinedu Okeke",role:"maint",site:"Victoria Island",pin:"3301"},
 {id:"store",name:"Yemi Lawal",role:"storekeeper",site:"Ikeja",pin:"8800"},
 {id:"storevi",name:"Ngozi Eze",role:"storekeeper",site:"Victoria Island",pin:"8801"},
 {id:"amina",name:"Amina Bello",role:"laundry",site:"Ikeja",pin:"6600"},
 {id:"laundvi",name:"Laundry VI",role:"laundry",site:"Victoria Island",pin:"6601"},
 {id:"chef",name:"Chef Ade",role:"kitchen",site:"Ikeja",pin:"7700"},
 {id:"bisi",name:"Chef Bisi",role:"kitchen",site:"Victoria Island",pin:"7701"},
 {id:"acctikeja",name:"Accountant Ikeja",role:"accountant",site:"Ikeja",pin:"5501"},
 {id:"acctvi",name:"Accountant VI",role:"accountant",site:"Victoria Island",pin:"5502"}
]}
function roomsSeed(){var o=[],i;for(i=301;i<=306;i++)o.push({id:"ik"+i,number:String(i),site:"Ikeja",status:"pending",hk:"",job:"",videoReady:false,check:false,fx:{}});for(i=901;i<=906;i++)o.push({id:"vi"+i,number:String(i),site:"Victoria Island",status:"pending",hk:"",job:"",videoReady:false,check:false,fx:{}});return o}
function blank(){return {users:seed(),rooms:roomsSeed(),fixtures:[{id:"kettle",name:"Kettle",par:1},{id:"cup",name:"Tea cup",par:2},{id:"glass",name:"Glass",par:2},{id:"remote",name:"TV remote",par:1}],fdChecks:["Cash float","Keys collected","Occupancy reviewed"],lauItems:[{id:"bath_towel",name:"Bath towel"},{id:"sheet",name:"Sheet"},{id:"pillow",name:"Pillowcase"}],lauStock:[{item:"bath_towel",site:"Ikeja",qty:40},{item:"sheet",site:"Ikeja",qty:40},{item:"pillow",site:"Ikeja",qty:40},{item:"bath_towel",site:"Victoria Island",qty:40},{item:"sheet",site:"Victoria Island",qty:40},{item:"pillow",site:"Victoria Island",qty:40}],lauMoves:[],martItems:[{id:"water",name:"Water",price:500},{id:"soda",name:"Soft drink",price:700}],martStock:[{item:"water",site:"Ikeja",qty:20},{item:"soda",site:"Ikeja",qty:10},{item:"water",site:"Victoria Island",qty:20},{item:"soda",site:"Victoria Island",qty:10}],martSales:[],slips:[],issues:[],scores:[],clocks:[],checkins:[],shifts:[],menus:[],breakfasts:[],queries:[],msgs:[],storeMoves:[],log:[]}}
function load(){try{DB=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){DB=null}if(!DB||!DB.users)DB=blank();if(!DB.fdChecks)DB.fdChecks=["Cash float","Keys collected","Occupancy reviewed"];if(!DB.lauItems)DB.lauItems=[{id:"bath_towel",name:"Bath towel"},{id:"sheet",name:"Sheet"},{id:"pillow",name:"Pillowcase"}];if(!DB.lauStock)DB.lauStock=[];if(!DB.lauMoves)DB.lauMoves=[];if(!DB.clocks)DB.clocks=[];if(!DB.shifts)DB.shifts=[];if(!DB.log)DB.log=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function note(t){DB.log=DB.log||[];DB.log.push({at:now(),day:today(),by:USER?USER.name:"",site:USER?USER.site:"",text:t});save()}
function rooms(){return DB.rooms.filter(function(r){return siteOk(r.site)})}
function hks(){return DB.users.filter(function(u){return u.role==="housekeeper"&&siteOk(u.site)})}
function findRoom(id){return DB.rooms.filter(function(r){return r.id===id})[0]}
function byNum(n){return rooms().filter(function(r){return String(r.number)===String(n)})[0]}
function stock(id,site){site=site||USER.site;var row=DB.martStock.filter(function(s){return s.item===id&&s.site===site})[0];return row?Number(row.qty||0):0}
function setStock(id,site,q){var row=DB.martStock.filter(function(s){return s.item===id&&s.site===site})[0];if(!row){row={item:id,site:site,qty:0};DB.martStock.push(row)}row.qty=Math.max(0,Number(q)||0)}
function lStock(id,site){site=site||USER.site;var row=DB.lauStock.filter(function(s){return s.item===id&&s.site===site})[0];return row?Number(row.qty||0):0}
function setLau(id,site,q){var row=DB.lauStock.filter(function(s){return s.item===id&&s.site===site})[0];if(!row){row={item:id,site:site,qty:0};DB.lauStock.push(row)}row.qty=Math.max(0,Number(q)||0)}
function tabs(){var r=role(),c=["chat","Chat"];
 if(r==="housekeeper")return[["rooms","Rooms"],["laundry","Laundry"],["fix","Fix"],c,["me","Me"]];
 if(r==="frontdesk")return[["desk","Desk"],["rooms","Rooms"],["mart","Mini mart"],["meals","Meals"],["fix","Fix"],["shift","Shift"],c,["me","Me"]];
 if(r==="manager")return[["rooms","Rooms"],["desk","Sales"],["mart","Mart"],["fix","Fix"],["score","Score HK"],["act","Activity"],c,["me","Me"]];
 if(r==="laundry")return[["laundry","Laundry"],c,["me","Me"]];
 if(r==="kitchen")return[["meals","Kitchen"],c,["me","Me"]];
 if(r==="maint")return[["fix","Maintenance"],["rooms","Rooms"],c,["me","Me"]];
 if(r==="storekeeper")return[["store","Store"],c,["me","Me"]];
 if(r==="accountant")return[["desk","Sales"],["mart","Mart"],["query","Query"],["act","Activity"],c,["me","Me"]];
 if(r==="ceo")return[["rooms","Rooms"],["desk","Sales"],["mart","Mart"],["act","Activity"],["fix","Issues"],["score","HK"],c,["me","Me"]];
 if(r==="superadmin")return[["staff","Staff"],["lists","Lists"],["rooms","Rooms"],["mart","Mart"],["act","Activity"],c,["me","Me"]];
 return[["me","Me"]]}
function draw(){document.getElementById("who").textContent=USER?(USER.name+" · "+USER.role+" · "+USER.site):"Posh Manager Week";var nav=document.getElementById("nav");nav.innerHTML="";tabs().forEach(function(t){var b=document.createElement("button");b.textContent=t[1];b.onclick=function(){TAB=t[0];ROOM=null;draw()};nav.appendChild(b)});if(USER){var x=document.createElement("button");x.textContent="Sign out";x.onclick=function(){USER=null;draw()};nav.appendChild(x)}var el=document.getElementById("app");if(!USER){el.innerHTML=viewLogin();bindLogin();return}var map={rooms:viewRooms,desk:viewDesk,mart:viewMart,meals:viewMeals,laundry:viewLaundry,fix:viewFix,score:viewScore,staff:viewStaff,lists:viewLists,store:viewStore,shift:viewShift,query:viewQuery,chat:viewChat,act:viewAct,me:viewMe};el.innerHTML=(map[TAB]||viewRooms)();bind()}
function viewLogin(){return "<h1>Posh Manager</h1><p class=ok>Tap your name, enter PIN.</p>"+DB.users.map(function(u){return "<div class=login data-id='"+u.id+"'><b>"+u.name+"</b><br><small>"+u.role+" · "+u.site+"</small></div>"}).join("")}
function bindLogin(){document.querySelectorAll(".login").forEach(function(c){c.onclick=function(){var u=DB.users.filter(function(x){return x.id===c.getAttribute("data-id")})[0];var p=prompt("PIN for "+u.name,"");if(p===null)return;if(String(p)!==String(u.pin)){toast("Wrong PIN");return}USER=u;TAB=tabs()[0][0];draw()}})}
function viewRooms(){if(ROOM)return viewOne(findRoom(ROOM));var list=rooms();if(role()==="housekeeper")list=list.filter(function(r){return r.status!=="certified"&&r.status!=="ooo"&&(r.hk===USER.id||r.hk===USER.name)});var h="<h1>Rooms</h1>";if(role()==="frontdesk"||role()==="manager"||role()==="superadmin"){h+="<div class=card><h2>Assign</h2><select id=asRoom>"+rooms().map(function(r){return "<option value='"+r.id+"'>"+r.number+" · "+r.status+"</option>"}).join("")+"</select><select id=asHk>"+hks().map(function(u){return "<option value='"+u.id+"'>"+u.name+"</option>"}).join("")+"</select><select id=asJob>"+JOBS.map(function(j){return "<option>"+j+"</option>"}).join("")+"</select><button class=btn id=doAssign>Assign</button></div>"}return h+list.map(function(r){return "<div class=card><b>Rm "+r.number+"</b> · "+r.site+"<br>"+r.status+(r.hkName?(" · "+r.hkName):"")+(r.videoReady?" · video": "")+"<br><button type=button class='btn openR' data-id='"+r.id+"'>Open</button></div>"}).join("")}
function viewOne(r){if(!r)return "<div class=warn>Missing</div><button class=btn id=backRooms>Back</button>";var h="<button class=btn id=backRooms>Back</button><h1>Rm "+r.number+"</h1><div class=ok>"+r.site+" · "+r.status+" · "+(r.hkName||"")+"</div>";if(role()==="housekeeper"&&r.status!=="certified"&&r.status!=="ooo"){h+="<div class=card><h2>1 Checklist</h2>";(DB.fixtures||[]).forEach(function(f){h+="<label>"+f.name+" exp "+f.par+" <input class=fx data-id='"+f.id+"' type=number value='"+(r.fx&&r.fx[f.id]!=null?r.fx[f.id]:f.par)+"'></label>"});h+="<button class=btn id=saveFx>Save checklist</button></div>";h+="<div class=card><h2>2 Record one video</h2><p class=warn>Camera record is required. Attach-only is not enough unless the file is a video.</p><input id=oneVid type=file accept='video/*' capture='environment'><p>"+(r.videoReady?("VIDEO SAVED: "+(r.videoName||"yes")):"NO VIDEO — submit blocked")+"</p></div>";h+="<div class=card><h2>3 Linen to laundry</h2>";(DB.lauItems||[]).forEach(function(it){h+="<label>"+it.name+" <input class=lq data-id='"+it.id+"' type=number min=0 placeholder='0'></label>"});h+="<button class=btn id=sendLau>Send to laundry</button></div>";h+="<button class=btn id=submitRm>Submit room</button>"}if(role()==="manager"||role()==="superadmin")h+="<div class=card><button class=btn id=certify>Certify</button> <button class=btn id=rts>Return</button> <button class='btn bad' id=ooo>OOO</button></div>";if(role()==="maint")h+="<div class=card><button class='btn bad' id=ooo>OOO</button> <button class=btn id=backSvc>Clear OOO</button></div>";return h}
function martList(){return (DB.martSales||[]).filter(function(s){return siteOk(s.site)}).slice().reverse().map(function(s){return "<p>"+s.qty+" x "+s.name+" · "+naira(s.amount)+" · "+s.by+"</p>"}).join("")||"<p>No mart sales</p>"}
function viewDesk(){var h="<h1>Front desk</h1>";if(role()==="frontdesk")h+="<div class=card><input id=gName placeholder='Guest name'><select id=gRoom>"+rooms().map(function(r){return "<option>"+r.number+"</option>"}).join("")+"</select><input id=gAmt type=number placeholder='Room amount'><label>Check-out date</label><input id=gOut type=date><input id=gDebt type=number placeholder='Debt today'><input id=gPaid type=number placeholder='Paid today'><button class=btn id=saveFolio>Save folio</button></div>";h+="<div class=card><h2>Folios</h2>"+((DB.checkins||[]).filter(function(c){return siteOk(c.site)}).slice().reverse().map(function(c){return "<p><b>"+c.guest+"</b> Rm "+c.room+" · out "+(c.checkout||"-")+" · "+naira(c.amount)+" · "+c.by+"</p>"}).join("")||"<p>None</p>")+"</div>";return h}
function viewMart(){var h="<h1>Mini mart</h1><div class=card>"+DB.martItems.map(function(it){return "<p>"+it.name+" · "+naira(it.price)+" · Ikeja "+stock(it.id,"Ikeja")+" · VI "+stock(it.id,"Victoria Island")+"</p>"}).join("")+"</div>";if(role()==="frontdesk")h+="<div class=card><select id=mItem>"+DB.martItems.map(function(it){return "<option value='"+it.id+"'>"+it.name+"</option>"}).join("")+"</select><input id=mQty type=number value=1><button class=btn id=sellMart>Sell</button></div>";if(role()==="superadmin"||role()==="ceo")h+="<div class=card><input id=ni placeholder='Name'><input id=np type=number placeholder='Price'><input id=nq type=number placeholder='Stock'><button class=btn id=addMart>Add</button></div><div class=card><select id=ei>"+DB.martItems.map(function(it){return "<option value='"+it.id+"'>"+it.name+"</option>"}).join("")+"</select><input id=ep type=number placeholder='Price'><input id=es type=number placeholder='Ikeja'><input id=ev type=number placeholder='VI'><button class=btn id=editMart>Save edit</button></div>";h+="<div class=card><h2>Sales</h2>"+martList()+"</div>";return h}
function viewMeals(){var h="<h1>Breakfast</h1>";if(role()==="kitchen")h+="<div class=card><input id=mDay type=date value='"+today()+"'><input id=mChoices placeholder='Continental, Nigerian'><button class=btn id=saveMenu>Save menu</button></div><div class=card><input id=vCode placeholder='Code'><button class=btn id=verBf>Verify</button><div id=vHit></div></div>";if(role()==="frontdesk"){var menu=(DB.menus||[]).filter(function(m){return m.site===USER.site&&m.day===today()})[0];var ch=menu?menu.choices:[];h+="<div class=card><input id=bfName placeholder='Guest'><select id=bfMeal>"+ch.map(function(c){return "<option>"+c+"</option>"}).join("")+"</select><button class=btn id=issueBf>Issue code</button></div>"}return h}
function viewLaundry(){var h="<h1>Laundry inventory</h1><div class=card>";(DB.lauItems||[]).forEach(function(it){h+="<p><b>"+it.name+"</b> · stock "+lStock(it.id,USER.site==="All locations"?"Ikeja":USER.site)+"</p>"});h+="</div>";if(role()==="laundry"){h+="<div class=card><h2>Qty in (replacement / restock)</h2><select id=linItem>"+DB.lauItems.map(function(it){return "<option value='"+it.id+"'>"+it.name+"</option>"}).join("")+"</select><input id=linQty type=number><button class=btn id=lauIn>Receive into stock</button></div>";h+="<div class=card><h2>Supply clean</h2><select id=loutItem>"+DB.lauItems.map(function(it){return "<option value='"+it.id+"'>"+it.name+"</option>"}).join("")+"</select><input id=loutQty type=number><input id=loutTo placeholder='Room or HK'><button class=btn id=lauOut>Supply</button></div>"}h+="<div class=card><h2>HK dirty bags</h2>"+(DB.slips||[]).filter(function(s){return siteOk(s.site)}).slice().reverse().map(function(s){return "<div class=card>Rm "+s.room+" · "+s.status+" · "+JSON.stringify(s.items)+(role()==="laundry"&&s.status==="sent"?"<br><button class='btn recSlip' data-id='"+s.id+"'>Qty received — confirm</button>":"")+(role()==="laundry"&&s.status==="received"?"<br><button class='btn issSlip' data-id='"+s.id+"'>Issued clean</button>":"")+"</div>"}).join("")+"</div>";h+="<div class=card><h2>Movement</h2>"+((DB.lauMoves||[]).filter(function(m){return siteOk(m.site)}).slice().reverse().map(function(m){return "<p>"+m.kind+" · "+m.item+" x "+m.qty+(m.to?(" → "+m.to):"")+" · "+m.by+"</p>"}).join("")||"<p>None</p>")+"</div>";return h}
function viewFix(){return "<h1>Maintenance</h1><div class=card><input id=fRoom placeholder='Room'><textarea id=fTxt></textarea><button class=btn id=logFault>Log</button></div>"+(DB.issues||[]).filter(function(i){return siteOk(i.site)}).map(function(i){return "<div class=card>Rm "+i.room+" · "+i.status+"<br>"+i.fault+"</div>"}).join("")}
function viewScore(){return "<h1>HK score</h1>"+hks().map(function(u){return "<div class=card><b>"+u.name+"</b> · "+u.site+"<br><button class='btn sc' data-id='"+u.id+"' data-r='sat'>Satisfactory</button> <button class='btn sc' data-id='"+u.id+"' data-r='unsat'>Unsatisfactory</button> <button class='btn bad sc' data-id='"+u.id+"' data-r='nosal'>No salary</button></div>"}).join("")}
function viewStaff(){return "<h1>Staff</h1><div class=card><input id=sn placeholder='Name'><select id=sr><option>housekeeper</option><option>frontdesk</option><option>manager</option><option>laundry</option><option>kitchen</option><option>maint</option><option>storekeeper</option><option>accountant</option></select><select id=ss><option>Ikeja</option><option>Victoria Island</option><option>All locations</option></select><input id=sp placeholder='PIN'><button class=btn id=addStaff>Add</button></div>"+DB.users.map(function(u,i){return "<div class=card><b>"+u.name+"</b><br>"+u.role+" · <b>"+u.site+"</b> · PIN "+u.pin+"<br><button class='btn edU' data-i='"+i+"'>Edit</button></div>"}).join("")+"<div class=card><input id=rn placeholder='Room'><select id=rsite><option>Ikeja</option><option>Victoria Island</option></select><button class=btn id=addRoom>Add room</button></div>"}
function viewLists(){return "<h1>Lists Super Admin can edit</h1><div class=card><h2>Front desk shift checklist</h2>"+(DB.fdChecks||[]).map(function(c,i){return "<p>"+c+" <button class='btn bad delFd' data-i='"+i+"'>Remove</button></p>"}).join("")+"<input id=fdNew placeholder='New checklist line'><button class=btn id=addFd>Add line</button></div><div class=card><h2>Room fixtures</h2>"+(DB.fixtures||[]).map(function(f,i){return "<p>"+f.name+" exp "+f.par+" <button class='btn bad delFx' data-i='"+i+"'>Remove</button></p>"}).join("")+"<input id=fxN placeholder='Name'><input id=fxP type=number placeholder='Expected qty'><button class=btn id=addFx>Add fixture</button></div><div class=card><h2>Laundry items</h2>"+(DB.lauItems||[]).map(function(f,i){return "<p>"+f.name+" <button class='btn bad delLi' data-i='"+i+"'>Remove</button></p>"}).join("")+"<input id=liN placeholder='Item name'><button class=btn id=addLi>Add laundry item</button></div>"}
function viewStore(){return "<h1>Store</h1><div class=card><input id=stItem placeholder='Item'><input id=stQty type=number><button class=btn id=stIn>Receive</button></div><div class=card><input id=suItem placeholder='Item'><input id=suQty type=number><input id=suTo placeholder='To'><button class=btn id=stOut>Supply</button></div>"}
function viewShift(){var checks=DB.fdChecks||[];var h="<h1>Shift</h1><div class=card><button type=button class=btn id=clockIn>Clock in</button> <button type=button class=btn id=clockOut>Clock out</button></div>";h+="<div class=card><h2>Opening / closing checklist</h2>"+checks.map(function(c,i){return "<label><input type=checkbox class=fdc> "+c+"</label><br>"}).join("")+"<button class=btn id=subOpen>Submit checklist</button></div>";h+="<div class=card><input id=inhouse placeholder='In-house now'><textarea id=inc placeholder='Incidents'></textarea><button class=btn id=subShift>Submit end of shift</button></div>";h+="<div class=card><h2>Clocks today</h2>"+((DB.clocks||[]).filter(function(c){return siteOk(c.site)&&c.day===today()}).map(function(c){return "<p>"+c.by+" in "+(c.inAt||"-")+" out "+(c.outAt||"still in")+"</p>"}).join("")||"<p>None</p>")+"</div>";h+="<div class=card><h2>Shift reports</h2>"+((DB.shifts||[]).filter(function(s){return siteOk(s.site)}).slice().reverse().map(function(s){return "<p>"+s.day+" · "+s.by+" · in-house "+(s.inhouse||"-")+" · "+(s.incident||s.checks||"")+"</p>"}).join("")||"<p>None</p>")+"</div>";return h}
function viewQuery(){return "<h1>Query</h1><div class=card><textarea id=qTxt></textarea><button class=btn id=sendQ>Send</button></div>"+(DB.queries||[]).map(function(q){return "<div class=card>"+q.by+": "+q.text+"</div>"}).join("")}
function viewChat(){var people=DB.users.filter(function(u){return u.id!==USER.id&&(group()||u.site===USER.site||u.site==="All locations")});return "<h1>Chat</h1><div class=card><select id=cTo><option value=''>Site</option>"+people.map(function(u){return "<option value='"+u.id+"'>"+u.name+"</option>"}).join("")+"</select><textarea id=cTxt></textarea><button class=btn id=sendC>Send</button></div>"+(DB.msgs||[]).filter(function(m){return group()||!m.to||m.to===USER.id||m.from===USER.id}).slice().reverse().map(function(m){return "<div class=card>"+m.fromName+": "+m.text+"</div>"}).join("")}
function viewAct(){return "<h1>Activity</h1><div class=card><h2>Folios</h2>"+((DB.checkins||[]).filter(function(c){return siteOk(c.site)}).slice().reverse().map(function(c){return "<p>"+c.guest+" Rm "+c.room+" out "+(c.checkout||"-")+" · "+naira(c.amount)+"</p>"}).join("")||"<p>None</p>")+"</div><div class=card><h2>Mart</h2>"+martList()+"</div><div class=card><h2>Clocks</h2>"+((DB.clocks||[]).filter(function(c){return siteOk(c.site)}).slice().reverse().map(function(c){return "<p>"+c.day+" · "+c.by+" in "+(c.inAt||"-")+" out "+(c.outAt||"-")+"</p>"}).join("")||"<p>None</p>")+"</div><div class=card><h2>Shift reports</h2>"+((DB.shifts||[]).filter(function(s){return siteOk(s.site)}).slice().reverse().map(function(s){return "<p>"+s.day+" · "+s.by+" · "+(s.incident||s.checks||"")+"</p>"}).join("")||"<p>None</p>")+"</div><div class=card><h2>Log</h2>"+((DB.log||[]).slice().reverse().slice(0,40).map(function(l){return "<p>"+l.at+" · "+l.by+" · "+l.text+"</p>"}).join("")||"<p>None</p>")+"</div>"}
function viewMe(){return "<h1>"+USER.name+"</h1><p>"+USER.role+" · "+USER.site+"</p>"}
function openRoom(id){ROOM=id;TAB="rooms";draw()}
if(!window.__weekClicks){window.__weekClicks=true;document.addEventListener("click",function(ev){var t=ev.target;if(!t||!t.id&&!t.className)return;if(t.className&&String(t.className).indexOf("openR")>=0){ev.preventDefault();openRoom(t.getAttribute("data-id"));return}if(t.id==="clockIn"){ev.preventDefault();DB.clocks.push({day:today(),site:USER.site,by:USER.name,inAt:new Date().toLocaleTimeString(),outAt:""});note("Clock in");save();toast("Clocked in");draw();return}if(t.id==="clockOut"){ev.preventDefault();var c=(DB.clocks||[]).filter(function(x){return x.by===USER.name&&x.day===today()&&!x.outAt}).pop();if(!c){toast("Clock in first");return}c.outAt=new Date().toLocaleTimeString();note("Clock out");save();toast("Clocked out");draw()}},true)}
function bind(){function on(id,fn){var e=document.getElementById(id);if(e)e.onclick=fn}
 on("backRooms",function(){ROOM=null;draw()});
 on("doAssign",function(){var r=findRoom(document.getElementById("asRoom").value);var hk=DB.users.filter(function(u){return u.id===document.getElementById("asHk").value})[0];if(!r||!hk)return;r.hk=hk.id;r.hkName=hk.name;r.job=document.getElementById("asJob").value;r.status="assigned";r.videoReady=false;r.check=false;save();toast("Assigned");draw()});
 on("saveFx",function(){var r=findRoom(ROOM);r.fx={};r.check=true;document.querySelectorAll(".fx").forEach(function(i){r.fx[i.getAttribute("data-id")]=parseInt(i.value,10)||0});save();toast("Checklist saved")});
 var vid=document.getElementById("oneVid");if(vid)vid.onchange=function(){var r=findRoom(ROOM);var f=this.files&&this.files[0];if(!f)return;if(f.type&&f.type.indexOf("video")!==0){toast("Must be a video file");this.value="";return}r.videoReady=true;r.videoName=f.name;r.videoAt=now();save();toast("Video stored for this room");draw()};
 on("sendLau",function(){var r=findRoom(ROOM);var items={};document.querySelectorAll(".lq").forEach(function(i){var n=parseInt(i.value,10);if(n>0)items[i.getAttribute("data-id")]=n});if(!Object.keys(items).length){toast("Enter counts");return}DB.slips.push({id:uid("s"),room:r.number,site:r.site,by:USER.name,items:items,status:"sent"});save();toast("Sent to laundry");draw()});
 on("submitRm",function(){var r=findRoom(ROOM);if(!r.check){toast("Save checklist first");return}if(!r.videoReady){toast("Record / attach a VIDEO first. Submit blocked.");return}r.status="submitted";r.submittedAt=now();note("Submitted Rm "+r.number+" with video");save();toast("Submitted with video");draw()});
 on("certify",function(){var r=findRoom(ROOM);if(r.status!=="submitted"){toast("Must be submitted");return}r.status="certified";save();draw()});
 on("rts",function(){var r=findRoom(ROOM);r.status="assigned";r.videoReady=false;r.check=false;r.hkNote=prompt("Note","Redo")||"Redo";save();draw()});
 on("ooo",function(){findRoom(ROOM).status="ooo";save();draw()});on("backSvc",function(){findRoom(ROOM).status="pending";save();draw()});
 on("saveFolio",function(){var name=document.getElementById("gName").value.trim(),num=document.getElementById("gRoom").value,out=document.getElementById("gOut").value,r=byNum(num);if(!name||!r)return;if(r.status!=="certified"){toast("Only certified rooms");return}if(!out){toast("Check-out date required");return}DB.checkins.push({guest:name,room:num,amount:parseFloat(document.getElementById("gAmt").value)||0,debt:parseFloat(document.getElementById("gDebt").value)||0,paid:parseFloat(document.getElementById("gPaid").value)||0,checkout:out,site:USER.site,by:USER.name,day:today()});r.status="occupied";r.checkOut=out;note("Check-in "+name+" out "+out);save();toast("Folio saved with check-out "+out);draw()});
 on("sellMart",function(){var id=document.getElementById("mItem").value,qty=parseInt(document.getElementById("mQty").value,10)||0,it=DB.martItems.filter(function(x){return x.id===id})[0];if(stock(id,USER.site)<qty){toast("No stock");return}setStock(id,USER.site,stock(id,USER.site)-qty);DB.martSales.push({name:it.name,qty:qty,amount:qty*it.price,site:USER.site,by:USER.name,day:today(),at:now()});save();draw()});
 on("addMart",function(){var name=document.getElementById("ni").value.trim();if(!name)return;var id="m"+Date.now();DB.martItems.push({id:id,name:name,price:parseFloat(document.getElementById("np").value)||0});SITES.forEach(function(s){DB.martStock.push({item:id,site:s,qty:parseInt(document.getElementById("nq").value,10)||0})});save();draw()});
 on("editMart",function(){var id=document.getElementById("ei").value,it=DB.martItems.filter(function(x){return x.id===id})[0];if(!it)return;if(document.getElementById("ep").value)it.price=parseFloat(document.getElementById("ep").value)||0;if(document.getElementById("es").value!=="")setStock(id,"Ikeja",document.getElementById("es").value);if(document.getElementById("ev").value!=="")setStock(id,"Victoria Island",document.getElementById("ev").value);save();draw()});
 on("lauIn",function(){var id=document.getElementById("linItem").value,q=parseInt(document.getElementById("linQty").value,10)||0;setLau(id,USER.site,lStock(id,USER.site)+q);DB.lauMoves.push({kind:"in",item:id,qty:q,site:USER.site,by:USER.name,at:now()});save();toast("Qty in logged");draw()});
 on("lauOut",function(){var id=document.getElementById("loutItem").value,q=parseInt(document.getElementById("loutQty").value,10)||0;if(lStock(id,USER.site)<q){toast("Not enough clean stock");return}setLau(id,USER.site,lStock(id,USER.site)-q);DB.lauMoves.push({kind:"supplied",item:id,qty:q,to:document.getElementById("loutTo").value,site:USER.site,by:USER.name,at:now()});save();toast("Supplied");draw()});
 document.querySelectorAll(".recSlip").forEach(function(b){b.onclick=function(){var s=DB.slips.filter(function(x){return x.id===b.getAttribute("data-id")})[0];s.status="received";DB.lauMoves.push({kind:"received_dirty",item:JSON.stringify(s.items),qty:1,site:s.site,by:USER.name,at:now()});save();draw()}});
 document.querySelectorAll(".issSlip").forEach(function(b){b.onclick=function(){DB.slips.filter(function(x){return x.id===b.getAttribute("data-id")})[0].status="issued";save();draw()}});
 on("addFd",function(){var t=document.getElementById("fdNew").value.trim();if(!t)return;DB.fdChecks.push(t);save();draw()});
 document.querySelectorAll(".delFd").forEach(function(b){b.onclick=function(){DB.fdChecks.splice(parseInt(b.getAttribute("data-i"),10),1);save();draw()}});
 on("addFx",function(){DB.fixtures.push({id:uid("f"),name:document.getElementById("fxN").value,par:parseInt(document.getElementById("fxP").value,10)||1});save();draw()});
 document.querySelectorAll(".delFx").forEach(function(b){b.onclick=function(){DB.fixtures.splice(parseInt(b.getAttribute("data-i"),10),1);save();draw()}});
 on("addLi",function(){var n=document.getElementById("liN").value.trim();if(!n)return;var id=uid("l");DB.lauItems.push({id:id,name:n});SITES.forEach(function(s){DB.lauStock.push({item:id,site:s,qty:0})});save();draw()});
 document.querySelectorAll(".delLi").forEach(function(b){b.onclick=function(){DB.lauItems.splice(parseInt(b.getAttribute("data-i"),10),1);save();draw()}});
 on("addStaff",function(){DB.users.push({id:uid("u"),name:document.getElementById("sn").value,role:document.getElementById("sr").value,site:document.getElementById("ss").value,pin:document.getElementById("sp").value});save();draw()});
 document.querySelectorAll(".edU").forEach(function(b){b.onclick=function(){var u=DB.users[parseInt(b.getAttribute("data-i"),10)];u.name=prompt("Name",u.name)||u.name;u.role=prompt("Role",u.role)||u.role;u.site=prompt("Location",u.site)||u.site;u.pin=prompt("PIN",u.pin)||u.pin;save();draw()}});
 on("addRoom",function(){var n=document.getElementById("rn").value.trim();if(!n)return;DB.rooms.push({id:uid("r"),number:n,site:document.getElementById("rsite").value,status:"pending",hk:"",videoReady:false,check:false,fx:{}});save();draw()});
 on("stIn",function(){DB.storeMoves.push({kind:"receive",item:document.getElementById("stItem").value,qty:document.getElementById("stQty").value,site:USER.site,by:USER.name});save();draw()});
 on("stOut",function(){DB.storeMoves.push({kind:"supply",item:document.getElementById("suItem").value,qty:document.getElementById("suQty").value,to:document.getElementById("suTo").value,site:USER.site,by:USER.name});save();draw()});
 on("subOpen",function(){var ticks=[];document.querySelectorAll(".fdc").forEach(function(c,i){if(c.checked)ticks.push((DB.fdChecks||[])[i])});DB.shifts.push({day:today(),site:USER.site,by:USER.name,kind:"checklist",checks:ticks.join(", ")});note("Checklist "+ticks.join(","));save();toast("Checklist saved to reports");draw()});
 on("subShift",function(){DB.shifts.push({day:today(),site:USER.site,by:USER.name,kind:"eos",inhouse:document.getElementById("inhouse").value,incident:document.getElementById("inc").value});note("Shift report");save();toast("Shift logged");draw()});
 on("sendC",function(){var to=document.getElementById("cTo").value;var tu=DB.users.filter(function(u){return u.id===to})[0];DB.msgs.push({from:USER.id,fromName:USER.name,to:to,toName:tu?tu.name:"site",site:USER.site,text:document.getElementById("cTxt").value,at:now()});save();draw()});
 on("saveMenu",function(){DB.menus.push({day:document.getElementById("mDay").value,site:USER.site,choices:document.getElementById("mChoices").value.split(",").map(function(x){return x.trim()}).filter(Boolean)});save();draw()});
 on("issueBf",function(){var g=document.getElementById("bfName").value.trim();if(!g)return;var code=String(1000+Math.floor(Math.random()*9000));DB.breakfasts.push({guest:g,meal:document.getElementById("bfMeal").value,code:code,status:"waiting",site:USER.site,day:today()});save();toast("Code "+code)});
 on("verBf",function(){var b=(DB.breakfasts||[]).filter(function(x){return x.code===document.getElementById("vCode").value.trim()})[0];var box=document.getElementById("vHit");if(!b){box.innerHTML="Invalid";return}b.status="served";save();box.innerHTML="Serve "+b.guest});
 on("logFault",function(){DB.issues.push({room:document.getElementById("fRoom").value,site:USER.site,fault:document.getElementById("fTxt").value,by:USER.name,status:"received"});save();draw()});
 document.querySelectorAll(".sc").forEach(function(b){b.onclick=function(){DB.scores.push({hk:b.getAttribute("data-id"),day:today(),rating:b.getAttribute("data-r"),by:USER.name});save();toast("Scored")}});
}
load();draw();
</script></body></html>
