<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posh Manager Week</title>
<style>html,body{margin:0;height:100%;background:#1c332c}iframe{border:0;width:100%;height:100%}</style>
</head>
<body>
<iframe id="appf" src="posh-week.html?v=3"></iframe>
<script>
try{ if(navigator.serviceWorker) navigator.serviceWorker.register("sw.js"); }catch(e){}
(function(){
  var f=document.getElementById("appf");
  f.onload=function(){
    try{
      var w=f.contentWindow;
      if(!w||!w.document||!w.document.body)return;
      function add(id,src){
        if(w.document.getElementById(id))return;
        var s=w.document.createElement("script");
        s.id=id; s.src=src;
        w.document.body.appendChild(s);
      }
      add("poshVidGate","posh-week-vid.js?v=4");
      add("poshExtraGate","posh-week-extra.js?v=9");
      add("poshLinenGate","posh-week-linen.js?v=10");
      add("poshAlertGate","posh-week-alerts.js?v=14");
      add("poshWaGate","posh-week-wa.js?v=15");
      add("poshCloudGate","posh-week-cloud.js?v=7");
    }catch(e){}
  };
})();
</script>
</body>
</html>
