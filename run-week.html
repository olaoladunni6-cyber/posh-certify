<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Posh Manager Week</title>
<style>html,body{margin:0;height:100%;background:#1c332c}iframe{border:0;width:100%;height:100%}</style>
</head>
<body>
<iframe id="appf" src="posh-week.html?v=3"></iframe>
<script>
try{ if(navigator.serviceWorker) navigator.serviceWorker.register("sw.js"); }catch(e){}
(function(){
  var f=document.getElementById("appf");
  f.onload=function(){
    try{
      var w=f.contentWindow;
      if(!w||!w.document||!w.document.body)return;
      function add(id,src){
        if(w.document.getElementById(id))return;
        var s=w.document.createElement("script");
        s.id=id; s.src=src;
        w.document.body.appendChild(s);
      }
      add("poshVidGate","posh-week-vid.js?v=17");
      add("poshExtraGate","posh-week-extra.js?v=9");
      add("poshFolioGate","posh-week-folio.js?v=18");
      add("poshShiftGate","posh-week-shift.js?v=19");
      add("poshScoreGate","posh-week-score.js?v=29");
      add("poshPorterGate","posh-week-porter.js?v=24");
      add("poshFixListGate","posh-week-fixlist.js?v=26");
      add("poshMissGate","posh-week-missing.js?v=27");
      add("poshRcGate","posh-week-receipt.js?v=25");
      add("poshCumulGate","posh-week-cumul.js?v=30");
      add("poshLinenGate","posh-week-linen.js?v=10");
      add("poshAlertGate","posh-week-alerts.js?v=14");
      add("poshDmAlertGate","posh-week-dmalert.js?v=28");
      add("poshWaGate","posh-week-wa.js?v=17");
      add("poshHkSendGate","posh-week-hksend.js?v=31");
      add("poshCloudGate","posh-week-cloud.js?v=9");
    }catch(e){}
  };
})();
</script>
</body>
</html>
